<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="js/stars.js"></script>
  <meta charset="UTF-8" />
  <title>填空挑戰 - 英打小英雄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script type="application/json" id="atlasStageMeta">
  {
    "type": "greek",
    "id": "dynamic",
    "name": "動態神祇",
    "englishName": "Dynamic",
    "order": 0,
    "description": "統一希臘神祇遊戲頁面",
    "questionCount": 0
  }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="responsive_enhanced.css">
  <link rel="stylesheet" href="css/greek-stage.css">
  <link rel="stylesheet" href="css/greek-game-theme.css">
  <style>
    /* 防止水平滾動 */
    html {
      overflow-x: hidden;
    }
    
    /* 確保所有元素都在視窗範圍內 */
    * {
      box-sizing: border-box;
      max-width: 100%;
    }
    
    /* ===== 基礎樣式 ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif, 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
      margin-bottom: 20px;
      letter-spacing: 2px;
      font-family: 'Orbitron', Arial, sans-serif;
      font-size: 2.2rem;
    }

    /* ===== 背景音樂控制按鈕樣式 ===== */
    #bgMusicControl {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 215, 0, 0.9);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 12;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bgMusicControl:hover {
      background: rgba(255, 215, 0, 1);
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    #bgMusicControl.paused {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    #bgMusicControl.paused:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* ===== 按鈕樣式 ===== */
    .top-btns {
      position: fixed;
      top: 20px;
      right: 20px;
      left: auto;
      display: flex;
      gap: 8px;
      z-index: 11;
    }

    .top-btns button {
      padding: 6px 12px;
      font-size: 1rem;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.2);
      font-family: 'Orbitron', Arial, sans-serif;
      transition: background 0.2s;
    }

    .top-btns button:hover {
      background: #ffe54f;
    }

    button {
      font-size: 1rem;
      padding: 10px 26px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px #0003;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    #submit-btn {
      background: #ffd700;
      color: #111;
    }

    #submit-btn:disabled {
      background: #ccc;
      color: #888;
      cursor: not-allowed;
    }

    #skip-btn {
      background: #bbb;
      color: #222;
    }

    #skip-btn:hover {
      background: #ccc;
    }

    #speak-btn {
      background: #0ff;
      color: #111;
      margin-top: 10px;
    }

    #speak-btn:disabled {
      background: #555;
      color: #888;
    }

    #speak-btn:hover {
      background: #7ff;
    }

    #next-btn {
      background: #4caf50;
      color: #fff;
      margin-top: 10px;
    }

    #next-btn:hover {
      background: #6fdc7f;
    }

    /* ===== 顯示區塊樣式 ===== */
    #star-counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(30, 30, 40, 0.92);
      border-radius: 18px;
      box-shadow: 0 4px 18px 0 rgba(31, 38, 135, 0.18);
      padding: 14px 32px;
      margin-bottom: 18px;
      border: 1.5px solid #ffd70044;
      font-size: 1.18rem;
      color: #ffd700;
      min-width: 260px;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    #starsDisplay {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(30, 30, 40, 0.92);
      border: 1.5px solid #ffd70044;
      border-radius: 12px;
      padding: 8px 16px;
      color: #ffd700;
      font-size: 1rem;
      font-family: 'Orbitron', Arial, sans-serif;
      z-index: 11;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #lives {
      position: fixed;
      top: 70px;
      right: 20px;
      background: rgba(30, 30, 40, 0.92);
      border: 1.5px solid #ff444444;
      border-radius: 12px;
      padding: 8px 16px;
      color: #ff4444;
      font-size: 1rem;
      font-family: 'Orbitron', Arial, sans-serif;
      z-index: 11;
    }

    /* ===== 問題容器樣式 ===== */
    #question-container {
      background: rgba(30, 30, 40, 0.95);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 30px;
      max-width: 700px;
      width: 90%;
      margin: 20px auto;
      box-shadow: 0 0 32px #ffd70044, 0 0 80px #00ffff22 inset;
      animation: modalPop 0.5s cubic-bezier(.68, -0.55, .27, 1.55);
    }

    .question-title {
      color: #ffd700;
      font-size: 1.3rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .question-sentence {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .blank {
      color: #0ff;
      font-weight: bold;
      border-bottom: 2px solid #0ff;
      padding: 0 8px;
    }

    .question-zh {
      color: #bbb;
      font-size: 1.1rem;
      margin-bottom: 20px;
      font-style: italic;
    }

    input {
      width: 100%;
      max-width: 400px;
      padding: 15px;
      font-size: 1.2rem;
      border: 2px solid #ffd700;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
      margin: 0 auto 20px auto;
      display: block;
    }

    input:focus {
      outline: none;
      border-color: #0ff;
      box-shadow: 0 0 12px #0ff;
    }

    /* ===== 按鈕列樣式 ===== */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
      width: 100%;
    }

    /* ===== 反饋樣式 ===== */
    #feedback {
      margin-top: 12px;
      font-size: 1.13rem;
      min-height: 28px;
    }

    .feedback-box {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 16px;
      font-size: 1.18rem;
      font-weight: bold;
      box-shadow: 0 2px 16px #0004;
      margin-top: 8px;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      animation: popfade 0.7s cubic-bezier(.68, -0.55, .27, 1.55);
    }

    .feedback-correct {
      background: linear-gradient(90deg, #2ecc40, #bfff00);
      color: #222;
    }

    .feedback-wrong {
      background: linear-gradient(90deg, #ff4f4f, #ffbaba);
      color: #fff;
    }

    .feedback-bonus {
      color: #ffd700;
      animation: bonusflash 1s infinite alternate;
      font-size: 1.25em;
    }

    /* ===== 動畫效果 ===== */
    .complete-anim {
      animation: pop 0.7s cubic-bezier(.68, -0.55, .27, 1.55) both;
    }

    @keyframes pop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      60% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes popfade {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      60% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes bonusflash {
      0% {
        text-shadow: 0 0 8px #ffd700;
      }
      100% {
        text-shadow: 0 0 24px #fff700;
      }
    }

    /* ===== 響應式設計優化 ===== */
    @media (max-width: 768px) {
      .top-btns {
        position: fixed;
        top: 10px;
        right: 10px;
        left: auto;
        display: flex;
        gap: 6px;
        z-index: 11;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      
      .top-btns button {
        padding: 4px 8px;
        font-size: 0.9rem;
      }
      
      #starsDisplay {
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font-size: 1rem;
      }

      #lives {
        top: 62px;
        right: 10px;
        padding: 6px 10px;
        font-size: 1rem;
      }
      
      h1 {
        font-size: 1.8rem;
        margin-top: 60px;
      }
      
      #question-container {
        max-width: 95vw;
        padding: 20px 15px;
        margin: 10px auto;
      }
      
      .question-sentence {
        font-size: 1.3rem;
      }
      
      .modal-content {
        padding: 20px;
        margin: 10px;
        max-width: 95vw;
      }
      
      .end-buttons {
        flex-direction: column;
        gap: 10px;
      }
      
      .end-buttons button {
        width: 100%;
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      
      .top-btns {
        position: relative;
        top: auto;
        right: auto;
        left: auto;
        justify-content: center;
        margin-bottom: 15px;
      }
      
      #starsDisplay {
        position: relative;
        top: auto;
        left: auto;
        display: inline-block;
        margin-bottom: 10px;
      }

      #lives {
        position: relative;
        top: auto;
        right: auto;
        display: inline-block;
        margin-bottom: 10px;
      }
      
      h1 {
        font-size: 1.5rem;
        margin-top: 10px;
      }
      
      #sessionStarsDisplay {
        font-size: 1rem;
        margin-bottom: 8px;
      }
      
      #star-counter {
        font-size: 1rem;
        padding: 10px 20px;
        min-width: 200px;
      }
      
      .question-sentence {
        font-size: 1.1rem;
      }
      
      input {
        font-size: 1rem;
        padding: 12px;
      }
      
      .btn-row {
        flex-direction: column;
        gap: 10px;
      }
      
      .btn-row button {
        width: 100%;
        padding: 12px;
      }
    }

    /* ===== 遊戲結束畫面樣式 ===== */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: rgba(30, 30, 40, 0.95);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 32px #ffd70044, 0 0 80px #00ffff22 inset;
      animation: modalPop 0.5s cubic-bezier(.68, -0.55, .27, 1.55);
    }

    .end-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: tada 1.2s infinite;
    }

    .modal-content h2 {
      color: #ffd700;
      font-size: 2rem;
      margin-bottom: 25px;
      text-shadow: 0 0 12px #ffd700;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    .end-stats {
      margin-bottom: 30px;
    }

    .end-stats p {
      font-size: 1.2rem;
      margin: 10px 0;
      color: #fff;
    }

    .end-stats span {
      color: #ffd700;
      font-weight: bold;
    }

    .end-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .end-buttons button {
      background: linear-gradient(90deg, #ffd700, #ffed4e);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'Orbitron', Arial, sans-serif;
    }

    .end-buttons button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px #ffd700;
    }

    @keyframes modalPop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      60% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes tada {
      0% { transform: scale(1); }
      10%, 20% { transform: scale(0.9) rotate(-3deg); }
      30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
      40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* ===== 錯誤畫面樣式 ===== */
    #errorScreen {
      display: none;
      text-align: center;
      padding: 40px;
    }

    #errorScreen h2 {
      color: #ff4444;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    #errorScreen p {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    #errorScreen button {
      background: #ffd700;
      color: #000;
      padding: 12px 24px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body data-god="dynamic">
  <!-- 背景音樂控制按鈕 -->
  <button id="bgMusicControl" onclick="toggleBackgroundMusic()" title="背景音樂控制">🎵</button>

  <!-- 錯誤畫面 -->
  <div id="errorScreen">
    <h2>⚠️ 錯誤</h2>
    <p id="errorMessage">無法載入題庫資料</p>
    <button onclick="location.href='atlas.html?tab=greek'">返回首頁</button>
  </div>

  <!-- 主內容容器 -->
  <div class="greek-game-shell" id="gameShell" style="display: none;">
    <!-- HUD -->
    <div class="greek-hud">
      <div class="hud-left">
        <div class="hud-stars" id="starsDisplay">
          <span class="hud-stars-icon">⭐</span>
          <span id="totalStarsCount">0</span>
        </div>
      </div>
      <div class="hud-center">
        <span id="godNameDisplay">神祇名稱</span>
      </div>
      <div class="hud-right">
        <div class="hud-hearts" id="lives">
          <span class="hud-heart-icon">❤️</span>
          <span id="lives-count">5</span>
        </div>
        <div class="hud-nav">
          <button class="hud-btn" onclick="showReviewModal()">📚 複習</button>
          <button class="hud-btn" onclick="restartGame()">🔄 重來</button>
        </div>
      </div>
    </div>

    <!-- 神祇 Hero 區塊 -->
    <div class="god-hero">
      <div class="god-icon" id="godIcon">⚡</div>
      <h1 class="god-name" id="godNameTitle">神祇名稱</h1>
      <div class="god-name-en" id="godNameEn">GOD NAME</div>
      <div class="god-title" id="godTitle">神祇標題</div>
    </div>

    <!-- 本次星星顯示 -->
    <div id="sessionStarsDisplay" style="margin-bottom:10px;color:#ffd700;font-weight:bold;font-size:1.08rem;">
      本次已獲得 0 顆星星
    </div>

    <!-- 進度顯示 -->
    <div id="star-counter" style="margin-bottom:15px;font-size:1.1rem;color:#fff;">
      第 <span id="current-index">0</span> / <span id="total-questions">0</span> 題
    </div>

    <!-- 計時器 -->
    <div id="timer" class="hidden" style="margin-bottom:15px;font-size:1rem;color:#00ffff;">
      ⏳ 倒數：<span id="time-left">0</span> 秒
    </div>

    <!-- 問題容器 -->
    <div id="question-container"></div>

    <!-- 遊戲結束畫面 -->
    <div id="gameEndModal" class="modal" style="display: none;">
      <div class="game-end-content">
        <div class="end-icon" id="end-icon">🎉</div>
        <h2 class="end-title" id="end-title">挑戰完成</h2>
        <div class="end-subtitle" id="end-subtitle">神祇名稱</div>

        <div class="settlement-grid">
          <div class="settlement-item">
            <span class="settlement-icon">⭐</span>
            <span class="settlement-label">本次星星</span>
            <span class="settlement-value" id="endSessionStars">0</span>
          </div>
          <div class="settlement-item">
            <span class="settlement-icon">✅</span>
            <span class="settlement-label">答對</span>
            <span class="settlement-value" id="endCorrectCount">0</span>
          </div>
          <div class="settlement-item">
            <span class="settlement-icon">❌</span>
            <span class="settlement-label">答錯</span>
            <span class="settlement-value" id="endWrongCount">0</span>
          </div>
          <div class="settlement-item">
            <span class="settlement-icon">🎯</span>
            <span class="settlement-label">正確率</span>
            <span class="settlement-value" id="endAccuracy">0%</span>
          </div>
          <div class="settlement-item">
            <span class="settlement-icon">⏱</span>
            <span class="settlement-label">總時間</span>
            <span class="settlement-value" id="endTime">0秒</span>
          </div>
          <div class="settlement-item">
            <span class="settlement-icon">🌟</span>
            <span class="settlement-label">累積總星星</span>
            <span class="settlement-value" id="endTotalStars">0</span>
          </div>
        </div>

        <div class="end-buttons">
          <button onclick="restartGame()">🔄 重新開始</button>
          <button onclick="location.href='atlas.html?tab=greek'">🏠 返回首頁</button>
        </div>
      </div>
    </div>

    <!-- 複習單字彈窗 -->
    <div id="reviewModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="end-icon">📚</div>
        <h2>單字複習</h2>

        <!-- 分類選擇器 -->
        <div style="margin-bottom: 20px;">
          <label for="categoryFilter" style="color: #ffd700; font-weight: bold; margin-right: 10px;">選擇分類：</label>
          <select id="categoryFilter" style="
            background: #222; color: #fff; border: 2px solid #ffd700; border-radius: 8px;
            padding: 8px 12px; font-size: 1rem; cursor: pointer;
          ">
            <option value="all">全部單字</option>
          </select>
        </div>

        <!-- 統計資訊 -->
        <div id="vocabStats" style="
          background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; border-radius: 8px;
          padding: 10px; margin-bottom: 15px; color: #ffd700; font-size: 0.9rem;
        ">
          總共 <span id="totalVocabCount">0</span> 個單字
          <button onclick="showVocabStats()" style="
            background: #0ff; color: #000; border: none; border-radius: 6px; padding: 4px 8px;
            font-size: 0.8rem; margin-left: 10px; cursor: pointer;
          ">📊 詳細統計</button>
          <button onclick="exportVocabData()" style="
            background: #4caf50; color: #fff; border: none; border-radius: 6px; padding: 4px 8px;
            font-size: 0.8rem; margin-left: 5px; cursor: pointer;
          ">📥 匯出字庫</button>
        </div>

        <div id="reviewWordsContainer" style="max-height: 400px; overflow-y: auto; margin: 20px 0;">
          <!-- 單字列表將在這裡動態生成 -->
        </div>
        <div class="end-buttons">
          <button onclick="closeReviewModal()">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/bgmController.js"></script>
  <script src="js/userData.js"></script>
  <script src="js/characterDialogue.js"></script>
  <script src="js/gameDialogue.js"></script>
  <script src="js/apiConfig.js"></script>
  <script src="js/greekScoreUpload.js"></script>
  <script src="js/greekStageSystem.js"></script>
  <script src="js/greekGodsData.js"></script>
  <script>
    // ===== 神祇資訊配置 =====
    const GOD_INFO = {
      zeus: { name: '宙斯', englishName: 'ZEUS', title: '天空與雷霆之王', icon: '⚡' },
      hera: { name: '赫拉', englishName: 'HERA', title: '婚姻與女神之後', icon: '👑' },
      poseidon: { name: '波塞冬', englishName: 'POSEIDON', title: '海神與地震之神', icon: '🌊' },
      athena: { name: '雅典娜', englishName: 'ATHENA', title: '智慧與戰爭女神', icon: '🦉' },
      apollo: { name: '阿波羅', englishName: 'APOLLO', title: '太陽與音樂之神', icon: '☀️' },

      nike: { name: '尼刻', englishName: 'NIKE', title: '勝利女神', icon: '🏆' },
      atlas_god: { name: '阿特拉斯', englishName: 'ATLAS', title: '擎天之神', icon: '🏔️' }
    };

    // ===== URL 參數解析 =====
    const urlParams = new URLSearchParams(window.location.search);
    const godKey = urlParams.get('god') || 'zeus';
    const godConfig = GOD_INFO[godKey];

    if (!godConfig) {
      console.error('[Greek] 無效神祇 key:', godKey);
    }

    // ===== 取得目前神祇名稱（用於排行榜 category） =====
    function getCurrentGreekGodName() {
      const config = GOD_INFO[godKey];
      if (config && config.name) {
        return config.name;
      }
      console.error('[Greek] 找不到神祇名稱', { godKey, config });
      return '';
    }

    // ===== 遊戲配置 =====
    const GAME_CONFIG = {
      QUESTIONS_COUNT: 20,
      TIME_LIMIT: 30,
      MAX_ATTEMPTS: 3
    };

    // ===== 全局變數 =====
    let VOCAB_DATA = [];
    let currentGod = null;

    // ===== 遊戲狀態變數 =====
    let gameState = {
      data: [],
      currentIndex: 0,
      attemptCount: 0,
      answered: false,
      timerInterval: null,
      preferredVoice: null,
      answerLog: [],
      sessionStars: 0,
      totalTimeUsed: 0,
      questionStartTs: null
    };

    window.gameState = gameState;

    // 使用共用愛心系統
    let lives = 5;

    function updateLives() {
      if (typeof GreekStageSystem !== 'undefined' && GreekStageSystem.updateLivesUI) {
        GreekStageSystem.updateLivesUI();
      }
    }

    // ===== 從 URL 獲取神祇名稱 =====
    function getGodFromURL() {
      return godKey;
    }

    // ===== 載入神祇題庫 =====
    function loadGodVocabulary(godName) {
      if (!godName) {
        showError('未指定神祇名稱');
        return false;
      }

      if (!window.GREEK_GODS_DATA || !window.GREEK_GODS_DATA[godName]) {
        showError(`找不到神祇 "${godName}" 的題庫資料`);
        return false;
      }

      VOCAB_DATA = window.GREEK_GODS_DATA[godName];
      currentGod = godName;

      // 更新神祇信息顯示
      const godInfo = GOD_INFO[godName];
      if (godInfo) {
        document.getElementById('godNameDisplay').textContent = `${godInfo.name} ${godInfo.englishName}`;
        document.getElementById('godNameTitle').textContent = godInfo.name;
        document.getElementById('godNameEn').textContent = godInfo.englishName;
        document.getElementById('godTitle').textContent = godInfo.title;
        document.getElementById('godIcon').textContent = godInfo.icon;
        document.getElementById('end-subtitle').textContent = `${godInfo.name} ${godInfo.englishName}`;
        document.body.setAttribute('data-god', godName);
      }

      return true;
    }

    // ===== 顯示錯誤畫面 =====
    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorScreen').style.display = 'block';
      document.getElementById('gameShell').style.display = 'none';
    }

    // ===== 音效資源 =====
    const SOUNDS = {
      correct: new Audio('sound/correct.mp3'),
      wrong: new Audio('sound/wrong.mp3'),
      type: new Audio('sound/type.mp3')
    };

    // ===== 背景音樂控制 =====
    let bgMusic = null;
    let isMusicPlaying = false;

    function initBackgroundMusic() {
      bgMusic = new Audio('sound/午後放鬆時光（純音樂）.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      
      const musicState = localStorage.getItem('bgMusicState');
      if (musicState === 'playing') {
        playBackgroundMusic();
      }
    }

    function toggleBackgroundMusic() {
      if (isMusicPlaying) {
        pauseBackgroundMusic();
      } else {
        playBackgroundMusic();
      }
    }

    function playBackgroundMusic() {
      if (bgMusic) {
        bgMusic.play().then(() => {
          isMusicPlaying = true;
          document.getElementById('bgMusicControl').textContent = '🔊';
          document.getElementById('bgMusicControl').classList.remove('paused');
          localStorage.setItem('bgMusicState', 'playing');
        }).catch(err => {
          console.log('背景音樂播放失敗:', err);
        });
      }
    }

    function pauseBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
        isMusicPlaying = false;
        document.getElementById('bgMusicControl').textContent = '🔇';
        document.getElementById('bgMusicControl').classList.add('paused');
        localStorage.setItem('bgMusicState', 'paused');
      }
    }

    // ===== 工具函數 =====
    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
    }

    function getRandomQuestions(arr, n) {
      const count = Math.min(n, arr.length);
      return arr.slice().sort(() => Math.random() - 0.5).slice(0, count);
    }

    // ===== 資料初始化 =====
    function initData() {
      const selected = getRandomQuestions(VOCAB_DATA, GAME_CONFIG.QUESTIONS_COUNT);
      gameState.data = selected.map(item => ({
        answer: item.word,
        zh: item.zh,
        sentence: item.en_sentence.replace(new RegExp(escapeRegExp(item.word), 'i'), '___'),
        original: item.en_sentence,
        zh_sentence: item.zh_sentence,
        category: item.category
      }));
    }

    // ===== 進度管理 =====
    function saveProgress() {
      localStorage.setItem('fillIndex', gameState.currentIndex);
    }

    function loadProgress() {
      gameState.currentIndex = parseInt(localStorage.getItem('fillIndex')) || 0;
      if (typeof gameState.data !== 'undefined' && Array.isArray(gameState.data) && gameState.currentIndex >= gameState.data.length) {
        gameState.currentIndex = 0;
        localStorage.removeItem('fillIndex');
      }
    }

    function resetProgress() {
      localStorage.removeItem('fillIndex');
      location.reload();
    }

    function updateCounter() {
      const currentIndexEl = document.getElementById('current-index');
      const totalQuestionsEl = document.getElementById('total-questions');

      const current = Number.isFinite(gameState?.currentIndex) ? gameState.currentIndex + 1 : 0;
      const total = Array.isArray(gameState?.data) ? gameState.data.length : 0;

      if (currentIndexEl) {
        currentIndexEl.textContent = String(total > 0 ? Math.min(current, total) : 0);
      } else {
        console.warn('[Greek UI] 缺少 #current-index');
      }

      if (totalQuestionsEl) {
        totalQuestionsEl.textContent = String(total);
      } else {
        console.warn('[Greek UI] 缺少 #total-questions');
      }
    }

    // ===== 計時器功能 =====
    function startTimer() {
      clearInterval(gameState.timerInterval);
      let timeLeft = GAME_CONFIG.TIME_LIMIT;
      
      const timeLeftEl = document.getElementById('time-left');
      const timerEl = document.getElementById('timer');
      
      if (timeLeftEl) {
        timeLeftEl.textContent = timeLeft;
      }
      if (timerEl) {
        timerEl.classList.remove('hidden');
      }

      gameState.questionStartTs = Date.now();
      
      gameState.timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeftEl) {
          timeLeftEl.textContent = timeLeft;
        }
        if (timeLeft <= 0) {
          clearInterval(gameState.timerInterval);
          revealAnswer(true);
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(gameState.timerInterval);

      if (gameState.questionStartTs) {
        const deltaSec = Math.max(0, Math.round((Date.now() - gameState.questionStartTs) / 1000));
        gameState.totalTimeUsed = (Number(gameState.totalTimeUsed) || 0) + deltaSec;
        gameState.questionStartTs = null;
      }
    }

    // ===== 語音功能 =====
    function pickVoice() {
      const voices = window.speechSynthesis.getVoices();
      const prefer = [
        'Google US English', 'Microsoft Aria Online', 'Microsoft Jenny Online', 
        'Samantha', 'Jenny', 'Aria', 'en-US'
      ];
      gameState.preferredVoice = voices.find(v => prefer.some(p => v.name.includes(p))) || 
                                 voices.find(v => v.lang === 'en-US') || voices[0];
    }

    function speak(text, rate = 1.0, callback) {
      if (!window.speechSynthesis) return;
      
      const utter = new window.SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = rate;
      utter.pitch = 1.12;
      if (gameState.preferredVoice) utter.voice = gameState.preferredVoice;
      if (callback) utter.onend = callback;
      
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    function speakQuestionAndWord(question) {
      window.speechSynthesis.cancel();
      speak(question.original, 0.97, function() {
        setTimeout(() => {
          speak(question.original.replace(new RegExp(escapeRegExp(question.answer), 'i'), '...'), 1.02, function() {
            setTimeout(() => speak(question.answer, 1.08), 350);
          });
        }, 350);
      });
    }

    // ===== 答案處理 =====
    function revealAnswer(autoNext = false) {
      stopTimer();
      gameState.attemptCount = Infinity;
      
      const feedbackEl = document.getElementById('feedback');
      const submitBtn = document.getElementById('submit-btn');
      const userInput = document.getElementById('user-input');
      
      if (feedbackEl) {
        feedbackEl.innerHTML = 
          '<span style="color:#f66;">⏰ 時間到！正確答案：<b>' + gameState.data[gameState.currentIndex].answer + '</b></span>';
      }
      if (submitBtn) {
        submitBtn.disabled = true;
      }
      if (userInput) {
        userInput.disabled = true;
      }
      
      logAnswer(false);
      
      if (autoNext) {
        setTimeout(() => {
          gameState.currentIndex++;
          showQuestion();
        }, 500);
      }
    }

    function logAnswer(correct, userAnswer = '') {
      const currentQuestion = gameState.data[gameState.currentIndex];
      gameState.answerLog[gameState.currentIndex] = {
        word: currentQuestion.answer,
        zh: currentQuestion.zh_sentence || currentQuestion.zh,
        en: currentQuestion.original,
        user: userAnswer,
        correct: correct,
        stars: 0,
        category: currentQuestion.category
      };
    }

    // ===== 問題顯示 =====
    function showQuestion() {
      const container = document.getElementById('question-container');
      
      if (!container) {
        console.error('[Greek Question] 找不到 #question-container');
        return;
      }
      
      if (!gameState.data || !Array.isArray(gameState.data) || gameState.data.length === 0) {
        container.innerHTML = 
          '<div style="color:#f66;font-size:1.2rem;">⚠️ 題庫沒有題目，請檢查資料！</div>';
        return;
      }

      if (gameState.currentIndex < 0 || gameState.currentIndex >= gameState.data.length) {
        showGameEndScreen();
        return;
      }

      gameState.answered = false;
      gameState.attemptCount = 0;
      const question = gameState.data[gameState.currentIndex];

      container.innerHTML = 
        '<div class="question-title">英文句子：</div>' +
        '<div class="question-sentence">' + question.sentence.replace('___', '<span class="blank">___</span>') + '</div>' +
        '<div class="question-zh">中文提示：' + (question.zh_sentence || question.zh) + '</div>' +
        '<input id="user-input" placeholder="輸入答案…" autocomplete="off" />' +
        '<div class="btn-row">' +
          '<button id="submit-btn" onclick="checkAnswer()">送出</button>' +
          '<button id="skip-btn" onclick="skipQuestion()">跳過</button>' +
          '<button id="next-btn" onclick="nextQuestion()">下一題</button>' +
        '</div>' +
        '<div id="feedback"></div>' +
        '<button id="speak-btn" onclick="speakQuestionAndWord(question)">🔊 朗讀</button>';

      const inputEl = document.getElementById('user-input');
      if (inputEl) {
        inputEl.focus();
        inputEl.onkeydown = function(e) {
          if (e.key === 'Enter') {
            checkAnswer();
          } else if (e.key.length === 1) {
            try {
              SOUNDS.type.currentTime = 0;
              SOUNDS.type.play();
            } catch (e) {}
          }
        };
      }

      updateCounter();
      startTimer();
      
      setTimeout(() => {
        speak(question.original, 0.97);
      }, 400);

      const speakBtn = document.getElementById('speak-btn');
      if (speakBtn) {
        speakBtn.onclick = () => speakQuestionAndWord(question);
      }
      window.answerStartTime = Date.now();
      
      lockReviewButton();
    }

    // ===== 遊戲結束畫面 =====
    let greekGameEnded = false;

    function setTextSafe(id, value) {
      const element = document.getElementById(id);
      if (!element) {
        console.warn('[Greek Settlement] 找不到元素:', id);
        return false;
      }
      element.textContent = value;
      return true;
    }

    function showGameEndScreen() {
      if (greekGameEnded) {
        return;
      }
      greekGameEnded = true;

      try {
        if (gameState.timerInterval) {
          clearInterval(gameState.timerInterval);
          gameState.timerInterval = null;
        }

        const logs = Array.isArray(gameState.answerLog) ? gameState.answerLog : [];
        const correctCount = logs.filter(log => log && log.correct === true).length;
        const wrongCount = logs.filter(log => log && log.correct === false).length;
        const sessionStars = Number(gameState.sessionStars || 0);
        const accuracy = logs.length > 0 ? Math.round((correctCount / logs.length) * 100) : 0;

        let totalStars = 0;
        try {
          totalStars = typeof loadTotalStars === 'function' ? Number(loadTotalStars() || 0) : Number(localStorage.getItem('totalStars') || 0);
        } catch (error) {
          console.warn('[Greek Settlement] 取得總星星失敗', error);
        }

        setTextSafe('endSessionStars', sessionStars);
        setTextSafe('endCorrectCount', correctCount);
        setTextSafe('endWrongCount', wrongCount);
        setTextSafe('endAccuracy', accuracy + '%');
        setTextSafe('endTime', gameState.totalTimeUsed + '秒');
        setTextSafe('endTotalStars', totalStars);

        const modal = document.getElementById('gameEndModal');
        if (!modal) {
          console.error('[Greek Settlement] gameEndModal 不存在');
          return;
        }
        modal.style.display = 'flex';
        modal.classList.add('show');

        stopTimer();
        unlockReviewButton();

        try {
          SOUNDS.correct.currentTime = 0;
          SOUNDS.correct.play();
        } catch (e) {}

        runGreekSettlementExtras({
          correctCount,
          wrongCount,
          sessionStars,
          totalStars
        });

      } catch (error) {
        console.error('❌ [Greek Settlement] 結算發生錯誤', error);

        const modal = document.getElementById('gameEndModal');
        if (modal) {
          modal.style.display = 'flex';
        }
      }
    }

    function runGreekSettlementExtras(settlement) {
      Promise.resolve().then(async () => {
        if (typeof window.submitGreekScore !== 'function') {
          return;
        }

        try {
          await window.submitGreekScore({
            score: settlement.sessionStars,
            correctCount: settlement.correctCount,
            wrongCount: settlement.wrongCount,
            totalTime: gameState.totalTimeUsed || 0,
            averageTime: settlement.correctCount > 0 ? Math.round((gameState.totalTimeUsed || 0) / settlement.correctCount) : 0
          });
        } catch (error) {
          console.error('[Greek Settlement] 排行榜上傳失敗', error);
        }
      });
    }

    function restartGame() {
      greekGameEnded = false;

      document.getElementById('gameEndModal').style.display = 'none';

      gameState.currentIndex = 0;
      gameState.sessionStars = 0;
      gameState.answerLog = [];
      gameState.totalTimeUsed = 0;
      gameState.questionStartTs = null;

      window.gameState = gameState;

      GreekStageSystem.initLives();
      lives = GreekStageSystem.getLives();
      updateLives();

      initData();
      updateCounter();
      showQuestion();

      document.getElementById('sessionStarsDisplay').textContent = '本次已獲得 0 顆星星';
    }

    // ===== 問題操作 =====
    function skipQuestion() {
      stopTimer();
      if (!gameState.answerLog[gameState.currentIndex]) {
        logAnswer(false, '');
      }
      const feedback = document.getElementById('feedback');
      if (feedback) feedback.innerHTML = '<span style="color:#bbb;">已跳過本題</span>';
      setTimeout(() => {
        const lostLife = GreekStageSystem.loseLife('skip');
        if (GreekStageSystem.isGameOver()) {
          showGameEndScreen();
          return;
        }
        gameState.currentIndex++;
        GreekStageSystem.resetQuestionState();
        showQuestion();
      }, 400);
    }

    function nextQuestion() {
      stopTimer();
      if (!gameState.answerLog[gameState.currentIndex]) {
        logAnswer(false, document.getElementById('user-input')?.value || '');
        const feedback = document.getElementById('feedback');
        if (feedback) feedback.innerHTML = '<span style="color:#bbb;">未作答</span>';
      }
      setTimeout(() => {
        const lostLife = GreekStageSystem.loseLife('timeout');
        if (GreekStageSystem.isGameOver()) {
          showGameEndScreen();
          return;
        }
        gameState.currentIndex++;
        GreekStageSystem.resetQuestionState();
        showQuestion();
      }, 400);
    }

    function checkAnswer() {
      if (gameState.answered) return;
      
      gameState.attemptCount++;
      const inputEl = document.getElementById('user-input');
      const feedback = document.getElementById('feedback');
      const answer = gameState.data[gameState.currentIndex].answer.toLowerCase();
      const userAnswer = inputEl.value.trim().toLowerCase();

      if (userAnswer === answer) {
        gameState.answered = true;
        stopTimer();

        const usedSeconds = (Date.now() - (window.answerStartTime || Date.now())) / 1000;
        let bonus = 0;
        let feedbackMsg = '<div class="feedback-box feedback-correct">✅ 答對了！太棒了！';
        
        if (usedSeconds < 10) {
          bonus = 2;
          feedbackMsg += ' <span class="feedback-bonus">BONUS! ⏱️ +2</span>';
        }
        feedbackMsg += '</div>';
        
        feedback.innerHTML = feedbackMsg;
        inputEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;
        
        speak(answer, 1.1);
        saveProgress();
        updateCounter();
        
        logAnswer(true, inputEl.value.trim());
        
        const addStars = 1 + bonus;
        addStarsToTotal(addStars);
        gameState.sessionStars += addStars;
        document.getElementById('sessionStarsDisplay').textContent = '本次已獲得 ' + gameState.sessionStars + ' 顆星星';
        
        try {
          SOUNDS.correct.currentTime = 0;
          SOUNDS.correct.play();
        } catch (e) {}
        
        if (window.GameDialogue) {
          window.GameDialogue.showCorrectAnswerDialogue();
        }
        
        setTimeout(() => {
          gameState.currentIndex++;
          showQuestion();
        }, 1300);
      } else {
        const lostLife = GreekStageSystem.loseLife('wrong_answer');
        
        feedback.innerHTML = '<div class="feedback-box feedback-wrong">❌ 正確答案：<b>' + gameState.data[gameState.currentIndex].answer + '</b><br>' + (lostLife ? '失去 ❤️ ×1' : '') + '</div>';
        inputEl.disabled = true;
        document.getElementById('submit-btn').disabled = true;

        logAnswer(false, inputEl.value.trim());

        try {
          SOUNDS.wrong.currentTime = 0;
          SOUNDS.wrong.play();
        } catch (e) {}

        if (window.GameDialogue) {
          window.GameDialogue.showWrongAnswerDialogue();
        }

        if (GreekStageSystem.isGameOver()) {
          return;
        }

        setTimeout(() => {
          gameState.currentIndex++;
          GreekStageSystem.resetQuestionState();
          showQuestion();
        }, 1300);
      }
    }

    // ===== 星星系統 =====
    function loadTotalStars() {
      if (typeof LinkageSystem !== 'undefined' && LinkageSystem?.stars?.get) {
        return Number(LinkageSystem.stars.get()) || 0;
      }
      if (typeof StarRewardSystem !== 'undefined' && typeof StarRewardSystem.getTotalStars === 'function') {
        return Number(StarRewardSystem.getTotalStars()) || 0;
      }
      const stars = localStorage.getItem('totalStars');
      return stars !== null ? parseInt(stars, 10) : 0;
    }

    function addStarsToTotal(stars) {
      if (typeof StarSystem !== 'undefined' && typeof StarSystem.addTotalStars === 'function') {
        StarSystem.addTotalStars(stars, currentGod + '遊戲獎勵');
        updateStarsDisplay();
        return;
      }
      if (typeof StarRewardSystem !== 'undefined' && typeof StarRewardSystem.addStars === 'function') {
        StarRewardSystem.addStars(stars);
        updateStarsDisplay();
        return;
      }
      if (typeof LinkageSystem !== 'undefined' && LinkageSystem?.stars?.add) {
        LinkageSystem.stars.add(stars);
        updateStarsDisplay();
        return;
      }
      const currentStars = loadTotalStars();
      const newTotal = currentStars + stars;
      window.StarSystem.setTotalStars(newTotal);
      updateStarsDisplay();
    }

    function updateStarsDisplay() {
      const element = document.getElementById('totalStarsCount');
      if (element) {
        element.textContent = loadTotalStars();
      }
    }

    // ===== 複習單字功能 =====
    function showReviewModal() {
      stopTimer();
      
      const container = document.getElementById('reviewWordsContainer');
      const categoryFilter = document.getElementById('categoryFilter');
      const totalVocabCount = document.getElementById('totalVocabCount');
      
      totalVocabCount.textContent = VOCAB_DATA.length;
      
      // 動態生成分類選項
      const categories = [...new Set(VOCAB_DATA.map(item => item.category))];
      categoryFilter.innerHTML = '<option value="all">全部單字</option>';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categoryFilter.appendChild(option);
      });
      
      displayVocabByCategory('all');
      
      categoryFilter.onchange = function() {
        displayVocabByCategory(this.value);
      };
      
      document.getElementById('reviewModal').style.display = 'flex';
    }

    function displayVocabByCategory(category) {
      const container = document.getElementById('reviewWordsContainer');
      const totalVocabCount = document.getElementById('totalVocabCount');
      
      container.innerHTML = '';
      
      let filteredVocab = VOCAB_DATA;
      if (category !== 'all') {
        filteredVocab = VOCAB_DATA.filter(item => item.category === category);
      }
      
      totalVocabCount.textContent = filteredVocab.length;
      
      if (category !== 'all') {
        const categoryTitle = document.createElement('div');
        categoryTitle.style.cssText = `
          color: #0ff;
          font-size: 1.3rem;
          font-weight: bold;
          margin: 15px 0 10px 0;
          padding: 10px;
          background: rgba(0, 255, 255, 0.1);
          border-radius: 8px;
          text-align: center;
        `;
        categoryTitle.textContent = `📂 ${category} (${filteredVocab.length}個單字)`;
        container.appendChild(categoryTitle);
      }
      
      filteredVocab.forEach((item, index) => {
        const wordDiv = document.createElement('div');
        wordDiv.style.cssText = `
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid #ffd700;
          border-radius: 10px;
          padding: 15px;
          margin: 10px 0;
          text-align: left;
          cursor: pointer;
          transition: all 0.3s;
        `;
        
        const categoryLabel = category === 'all' ? `<span style="color: #0ff; font-size: 0.8rem; background: rgba(0,255,255,0.2); padding: 2px 6px; border-radius: 4px; margin-left: 8px;">${item.category}</span>` : '';
        
        wordDiv.innerHTML = `
          <div style="display: flex; align-items: flex-start; gap: 15px;">
            <div style="flex: 1; min-width: 0;">
              <div style="color: #ffd700; font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; word-break: break-word;">
                ${index+1}. ${item.word}${categoryLabel}
              </div>
              <div style="color: #fff; font-size: 1rem; margin-bottom: 8px; word-break: break-word;">
                ${item.zh}
              </div>
              <div style="color: #0ff; font-size: 0.9rem; font-style: italic; word-break: break-word;">
                ${item.en_sentence}
              </div>
            </div>
            <button onclick="event.stopPropagation(); speakWord('${item.word}')" style="
              background: #0ff;
              color: #000;
              border: none;
              border-radius: 50%;
              width: 45px;
              height: 45px;
              font-size: 1.3rem;
              cursor: pointer;
              flex-shrink: 0;
              display: flex;
              align-items: center;
              justify-content: center;
              transition: all 0.2s;
              box-shadow: 0 2px 8px rgba(0,255,255,0.3);">🔊</button>
          </div>
        `;
        
        wordDiv.addEventListener('mouseenter', () => {
          wordDiv.style.background = 'rgba(255, 215, 0, 0.2)';
          wordDiv.style.transform = 'scale(1.02)';
        });
        
        wordDiv.addEventListener('mouseleave', () => {
          wordDiv.style.background = 'rgba(255, 255, 255, 0.1)';
          wordDiv.style.transform = 'scale(1)';
        });
        
        wordDiv.addEventListener('click', () => {
          speakWord(item.word);
        });
        
        container.appendChild(wordDiv);
      });
      
      if (filteredVocab.length === 0) {
        const noWordsDiv = document.createElement('div');
        noWordsDiv.style.cssText = `
          text-align: center;
          color: #888;
          font-size: 1.1rem;
          padding: 40px;
          font-style: italic;
        `;
        noWordsDiv.textContent = '此分類暫無單字';
        container.appendChild(noWordsDiv);
      }
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').style.display = 'none';
      if (gameState.currentIndex < gameState.data.length && !gameState.answered) {
        startTimer();
      }
    }

    function speakWord(word) {
      if (!window.speechSynthesis) return;
      
      const utter = new window.SpeechSynthesisUtterance(word);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      utter.pitch = 1.1;
      if (gameState.preferredVoice) utter.voice = gameState.preferredVoice;
      
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    // ===== 複習按鈕鎖定功能 =====
    function lockReviewButton() {
      const reviewBtn = document.querySelector('.hud-btn[onclick*="showReviewModal"]');
      if (reviewBtn) {
        reviewBtn.disabled = true;
        reviewBtn.style.background = '#555';
        reviewBtn.style.color = '#888';
        reviewBtn.style.cursor = 'not-allowed';
        reviewBtn.title = '遊戲進行中，無法複習單字';
      }
    }

    function unlockReviewButton() {
      const reviewBtn = document.querySelector('.hud-btn[onclick*="showReviewModal"]');
      if (reviewBtn) {
        reviewBtn.disabled = false;
        reviewBtn.style.background = '#ffd700';
        reviewBtn.style.color = '#000';
        reviewBtn.style.cursor = 'pointer';
        reviewBtn.title = '複習單字';
      }
    }

    // ===== 字庫統計功能 =====
    function showVocabStats() {
      const categoryStats = {};
      VOCAB_DATA.forEach(item => {
        categoryStats[item.category] = (categoryStats[item.category] || 0) + 1;
      });
      
      const statsModal = document.createElement('div');
      statsModal.className = 'modal';
      statsModal.style.display = 'flex';
      statsModal.innerHTML = `
        <div class="modal-content" style="max-width: 600px;">
          <div class="end-icon">📊</div>
          <h2>字庫統計</h2>
          <div style="text-align: left; margin: 20px 0;">
            <h3 style="color: #ffd700; margin-bottom: 15px;">📈 分類統計</h3>
            ${Object.entries(categoryStats).map(([category, count]) => `
              <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 0;
                border-bottom: 1px solid rgba(255, 215, 0, 0.3);
              ">
                <span style="color: #fff;">${category}</span>
                <span style="color: #0ff; font-weight: bold;">${count} 個單字</span>
              </div>
            `).join('')}
            <div style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 12px 0;
              border-top: 2px solid #ffd700;
              margin-top: 10px;
              font-weight: bold;
            ">
              <span style="color: #ffd700;">總計</span>
              <span style="color: #ffd700;">${VOCAB_DATA.length} 個單字</span>
            </div>
          </div>
          <div class="end-buttons">
            <button onclick="this.closest('.modal').remove()">關閉</button>
          </div>
        </div>
      `;
      
      statsModal.addEventListener('click', function(e) {
        if (e.target === statsModal) {
          statsModal.remove();
        }
      });
      
      document.body.appendChild(statsModal);
    }

    // ===== 字庫匯出功能 =====
    function exportVocabData() {
      const csvContent = [
        ['單字', '中文', '英文例句', '中文例句', '分類'],
        ...VOCAB_DATA.map(item => [
          item.word,
          item.zh,
          item.en_sentence,
          item.zh_sentence,
          item.category
        ])
      ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `${currentGod}_vocabulary_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showNotification('✅ 字庫已成功匯出！', 'success');
    }

    // ===== 通知功能 =====
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: ${type === 'success' ? '#4caf50' : '#2196f3'};
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        z-index: 10000;
        animation: slideDown 0.3s ease-out;
      `;
      notification.textContent = message;
      
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideDown {
          from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
          to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
        style.remove();
      }, 3000);
    }

    // ===== 初始化 =====
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = pickVoice;
      pickVoice();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const godName = getGodFromURL();
      
      if (!loadGodVocabulary(godName)) {
        return;
      }

      document.getElementById('errorScreen').style.display = 'none';
      document.getElementById('gameShell').style.display = 'block';

      GreekStageSystem.initLives();
      lives = GreekStageSystem.getLives();

      updateStarsDisplay();
      document.getElementById('sessionStarsDisplay').textContent = '本次已獲得 0 顆星星';
      updateLives();
      initData();
      gameState.currentIndex = 0;
      updateCounter();
      showQuestion();
      localStorage.removeItem('fillIndex');

      initBackgroundMusic();
      unlockReviewButton();

      if (window.GameDialogue) {
        window.GameDialogue.init();
        setTimeout(() => {
          window.GameDialogue.showGameStartDialogue();
        }, 2000);
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const reviewModal = document.getElementById('reviewModal');
      const gameEndModal = document.getElementById('gameEndModal');
      
      if(reviewModal){
        reviewModal.addEventListener('click', function(e){
          if(e.target === reviewModal){
            closeReviewModal();
          }
        });
      }
      
      if(gameEndModal){
        gameEndModal.addEventListener('click', function(e){
          if(e.target === gameEndModal){
            document.getElementById('gameEndModal').style.display = 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
