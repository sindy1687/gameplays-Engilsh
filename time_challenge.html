<!-- time_challenge.html − 時間挑戰頁面 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="js/stars.js"></script>
  <meta charset="UTF-8" />
  <title>星際英打冒險 − 時間挑戰</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="responsive_enhanced.css">
  <style>
    :root {
      --primary: #00ffff;
      --secondary: #a259ff;
      --accent: #ffd700;
      --success: #00ff88;
      --error: #ff4757;
      --warning: #ffa502;
      --bg-dark: #0a0e1a;
      --bg-card: rgba(10, 20, 40, 0.9);
      --border: rgba(0, 255, 255, 0.3);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Noto Sans TC', 'Noto Sans SC', 'Inter', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #020111 0%, #0a1628 45%, #000010 100%);
      background-attachment: fixed;
      color: #fff;
      overflow-x: hidden;
    }

    .time-challenge-page,
    .time-challenge-page * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(69, 162, 158, 0.6);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(69, 162, 158, 0.8);
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .time-challenge-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .challenge-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background: rgba(10, 20, 40, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 30px rgba(0, 255, 255, 0.15), 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .star-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .header-center {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px var(--primary), 0 0 40px var(--secondary);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
      animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 20px var(--primary), 0 0 40px var(--secondary); }
      50% { text-shadow: 0 0 30px var(--primary), 0 0 60px var(--secondary); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #0a0e1a;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
    }

    .header-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
    }

    .challenge-main {
      margin-top: 70px;
      flex: 1;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .challenge-status {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1100px;
    }

    .progress-track {
      width: 100%;
      max-width: 800px;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(10, 20, 40, 0.55);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .status-chip .value {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
    }

    .timer-chip {
      background: rgba(255, 215, 0, 0.12);
      border-color: rgba(255, 215, 0, 0.45);
    }

    .timer-chip .value {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
    }

    .timer-chip.warning {
      background: rgba(255, 165, 2, 0.15);
      border-color: rgba(255, 165, 2, 0.55);
    }

    .timer-chip.warning .value {
      color: var(--warning);
      animation: timerPulse 0.5s ease-in-out infinite;
    }

    .timer-chip.danger {
      background: rgba(255, 71, 87, 0.15);
      border-color: rgba(255, 71, 87, 0.55);
    }

    .timer-chip.danger .value {
      color: var(--error);
      animation: timerPulse 0.3s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .challenge-game-card {
      width: 100%;
      max-width: 800px;
      background: var(--bg-card);
      border-radius: 28px;
      border: 1px solid rgba(0, 255, 255, 0.25);
      padding: 40px 36px;
      box-shadow: 0 10px 60px rgba(0, 255, 255, 0.2), 0 0 100px rgba(162, 89, 255, 0.15) inset;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .challenge-game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: cardShine 6s linear infinite;
      opacity: 0.6;
    }

    @keyframes cardShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .question-number {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 3px;
      margin-bottom: 18px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
    }

    .question-area {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid rgba(0, 255, 255, 0.12);
    }

    .question-text {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 30px var(--primary), 0 0 60px var(--secondary);
      margin-bottom: 14px;
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      letter-spacing: 3px;
      word-break: break-word;
    }

    .pronounce-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .speak-btn {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #0a0e1a;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px rgba(0, 255, 255, 0.45);
    }

    .speak-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 10px 30px rgba(0, 255, 255, 0.65);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 26px;
    }

    .choice-btn {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.12), rgba(162, 89, 255, 0.12));
      border: 1px solid rgba(0, 255, 255, 0.3);
      color: #fff;
      border-radius: 20px;
      padding: 20px 22px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: break-word;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .choice-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transition: left 0.5s;
    }

    .choice-btn:hover:not(:disabled)::before {
      left: 100%;
    }

    .choice-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.25), rgba(162, 89, 255, 0.25));
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
      border-color: var(--primary);
    }

    .choice-btn:disabled {
      background: rgba(85, 85, 85, 0.25);
      border-color: rgba(85, 85, 85, 0.4);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .feedback {
      min-height: 60px;
      font-size: 1.25rem;
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      background: rgba(0, 255, 255, 0.08);
      border-radius: 16px;
      font-family: 'Noto Sans TC', sans-serif;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.12);
    }

    .feedback.correct {
      color: var(--success);
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    }

    .feedback.wrong {
      color: var(--error);
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.4);
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.2);
    }

    @media (max-width: 768px) {
      .challenge-header {
        height: 60px;
        padding: 0 12px;
      }

      .page-title {
        font-size: 1.1rem;
      }

      .header-btn {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }

      .star-display {
        font-size: 0.9rem;
      }

      .challenge-main {
        margin-top: 60px;
        padding: 16px 12px;
      }

      .challenge-status {
        gap: 10px;
      }

      .status-chip {
        font-size: 0.85rem;
        padding: 8px 12px;
      }

      .timer-chip .value {
        font-size: 1.2rem;
      }

      .challenge-game-card {
        padding: 24px 20px;
        border-radius: 18px;
      }

      .question-text {
        font-size: 1.8rem;
      }

      .speak-btn {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      .choices {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .choice-btn {
        min-height: 64px;
        font-size: 1rem;
        padding: 14px 16px;
      }

      .feedback {
        font-size: 1rem;
        min-height: 44px;
      }
    }

    @media (max-width: 480px) {
      .challenge-status {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .status-chip {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="time-challenge-page">
    <header class="challenge-header">
      <div class="header-left">
        <div class="star-display">
          <span>⭐</span>
          <span id="totalStarsCount">0</span>
        </div>
      </div>
      <div class="header-center">
        <h1 class="page-title">⏱ 限時計時挑戰</h1>
      </div>
      <div class="header-right">
        <a href="#" id="backToBook" class="header-btn" title="返回編輯單字本">🏠</a>
      </div>
    </header>

    <canvas id="stars"></canvas>

    <main class="challenge-main">
      <section class="challenge-status">
        <div class="status-chip">
          <span>⭐</span>
          <span class="value" id="scoreDisplay">0</span>
        </div>
        <div class="status-chip">
          <span>🔥</span>
          <span class="value" id="comboDisplay">×0</span>
        </div>
        <div class="status-chip">
          <span>📊</span>
          <span class="value" id="progressBar">0/0</span>
        </div>
        <div class="status-chip timer-chip" id="timerChip">
          <span>⏱</span>
          <span class="value" id="timer">10</span>
        </div>
      </section>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <section class="challenge-game-card">
        <div class="question-number" id="questionNumber">QUESTION 1 / 20</div>
        <div class="question-area">
          <div class="question-text" id="questionText">載入中…</div>
          <div class="pronounce-row" id="pronounceRow"></div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
      </section>
    </main>
  </div>
  <script src="js/sound.js"></script>
  <script src="js/starRewardSystem.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 初始化音效系統
      if (typeof SoundSystem !== 'undefined') {
        SoundSystem.speech.init();
      }
      
      // 讀取 URL 參數：book, mode (mode 不使用但保留以防呼叫方式一致)
      const params = new URLSearchParams(location.search);
      const bookName = params.get('book');
      if (!bookName) {
        alert('參數錯誤：缺少 book。');
        history.back();
      }
      document.getElementById('backToBook').href = `book_edit.html?book=${encodeURIComponent(bookName)}`;

      // ===== 星星計數 初始化 =====
      const starDom = document.getElementById('totalStarsCount');
      const raw = localStorage.getItem('totalStars');
      let totalStars = 0;
      if (raw !== null) {
        const parsed = parseInt(raw, 10);
        totalStars = isNaN(parsed) ? 0 : parsed;
      }
      starDom.textContent = totalStars;

      // ===== 讀取單字本 =====
      const vocab = JSON.parse(localStorage.getItem('book_' + bookName) || '[]');
      if (!Array.isArray(vocab) || vocab.length < 4) {
        alert('此單字本至少需要 4 筆以上單字才能進行限時答題。');
        history.back();
      }

      // 複製題庫並隨機排序
      let questionPool = [...vocab];
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }
      shuffle(questionPool);
      // 只取前20題
      if (questionPool.length > 20) {
        questionPool = questionPool.slice(0, 20);
      }

      let currentQuestion = null;
      let choicesArr = [];
      let timeLeft = 10;
      let timerId = null;
      let totalQuestions = questionPool.length;
      let currentIndex = 0;
      let isProcessingAnswer = false; // 防止重複點擊
      
      // ===== 新增：遊戲狀態追蹤 =====
      let gameStats = {
        correctCount: 0,
        totalAnswered: 0,
        consecutiveCorrect: 0, // 連續答對次數
        fastestAnswer: Infinity, // 最快答題時間
        slowestAnswer: 0, // 最慢答題時間
        totalTimeUsed: 0, // 總用時
        perfectAnswers: 0, // 完美答題次數（5秒內答對）
        streakBonus: 0 // 連擊獎勵累積
      };

      const timerEl = document.getElementById('timer');
      const timerChip = document.getElementById('timerChip');
      const questionTextEl = document.getElementById('questionText');
      const questionNumberEl = document.getElementById('questionNumber');
      const choicesEl = document.getElementById('choices');
      const feedbackEl = document.getElementById('feedback');
      const pronounceRow = document.getElementById('pronounceRow');
      const scoreDisplayEl = document.getElementById('scoreDisplay');
      const comboDisplayEl = document.getElementById('comboDisplay');

      // ===== 新增：星星獎勵計算函數 =====
      function calculateStarReward(isCorrect, answerTime, consecutiveCount, previousConsecutiveCount) {
        if (!isCorrect) return 0;
        
        let baseReward = 1; // 基礎獎勵
        
        // 時間獎勵：越快答對獎勵越多
        if (answerTime <= 3) {
          baseReward += 2; // 3秒內 +2星
        } else if (answerTime <= 5) {
          baseReward += 1; // 5秒內 +1星
        }
        
        // 連擊獎勵：只在達到新的連擊里程碑時給予獎勵
        let comboBonus = 0;
        if (consecutiveCount >= 5 && previousConsecutiveCount < 5) {
          comboBonus = 3; // 首次達到5連擊 +3星
        } else if (consecutiveCount >= 3 && previousConsecutiveCount < 3) {
          comboBonus = 2; // 首次達到3連擊 +2星
        } else if (consecutiveCount >= 2 && previousConsecutiveCount < 2) {
          comboBonus = 1; // 首次達到2連擊 +1星
        }
        
        // 單字難度獎勵：根據單字長度給予額外獎勵
        if (currentQuestion.word.length >= 8) {
          baseReward += 1; // 長單字額外獎勵
        }
        
        // 單字本類型獎勵
        if (bookName.includes('托福') || bookName.includes('TOEFL')) {
          baseReward += 1; // 托福單字額外獎勵
        } else if (bookName.includes('英檢') || bookName.includes('GEPT')) {
          baseReward += 1; // 英檢單字額外獎勵
        }
        
        return baseReward + comboBonus;
      }
      
      // ===== 新增：顯示獎勵動畫 =====
      function showRewardAnimation(starsEarned, reason = '') {
        const rewardDiv = document.createElement('div');
        rewardDiv.style.cssText = `
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: linear-gradient(135deg, rgba(255, 215, 0, 0.95), rgba(255, 170, 0, 0.95));
          color: #000;
          padding: 20px 30px;
          border-radius: 15px;
          font-size: 1.5rem;
          font-weight: bold;
          z-index: 1000;
          box-shadow: 0 0 30px #ffd700;
          animation: rewardPop 1.2s ease-out forwards;
          font-family: 'Orbitron', sans-serif;
          text-align: center;
          min-width: 300px;
        `;
        
        let reasonText = '';
        if (reason) {
          reasonText = `<div style="font-size: 1rem; margin-top: 8px; color: #666;">${reason}</div>`;
        }
        
        rewardDiv.innerHTML = `
          <div style="font-size: 3rem; margin-bottom: 10px;">⭐</div>
          <div style="font-size: 1.8rem; margin-bottom: 5px;">+${starsEarned} 星星</div>
          ${reasonText}
        `;
        
        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
          @keyframes rewardPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
          }
        `;
        document.head.appendChild(style);
        
        document.body.appendChild(rewardDiv);
        
        // 播放星星音效
        if (typeof StarRewardSystem !== 'undefined') {
          StarRewardSystem.playStarSound();
        }
        
        // 1.2秒後移除
        setTimeout(() => {
          if (document.body.contains(rewardDiv)) {
            document.body.removeChild(rewardDiv);
          }
          if (document.head.contains(style)) {
            document.head.removeChild(style);
          }
        }, 2500);
      }
      
      // ===== 新增：顯示連擊通知 =====
      function showComboNotification(comboCount) {
        if (comboCount < 2) return;
        
        const comboDiv = document.createElement('div');
        comboDiv.style.cssText = `
          position: fixed;
          top: 20%;
          left: 50%;
          transform: translateX(-50%);
          background: linear-gradient(135deg, rgba(255, 69, 0, 0.9), rgba(255, 140, 0, 0.9));
          color: #fff;
          padding: 15px 25px;
          border-radius: 25px;
          font-size: 1.2rem;
          font-weight: bold;
          z-index: 1000;
          box-shadow: 0 0 20px #ff4500;
          animation: comboSlide 0.8s ease-out forwards;
          font-family: 'Orbitron', sans-serif;
        `;
        
        let comboText = '';
        let comboIcon = '';
        
        if (comboCount >= 5) {
          comboText = `${comboCount} 連擊！🔥 無敵連擊！`;
          comboIcon = '🔥';
        } else if (comboCount >= 3) {
          comboText = `${comboCount} 連擊！⚡ 超強連擊！`;
          comboIcon = '⚡';
        } else {
          comboText = `${comboCount} 連擊！✨ 連擊開始！`;
          comboIcon = '✨';
        }
        
        comboDiv.innerHTML = `${comboIcon} ${comboText} ${comboIcon}`;
        
        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
          @keyframes comboSlide {
            0% { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            50% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(0); opacity: 0; }
          }
        `;
        document.head.appendChild(style);
        
        document.body.appendChild(comboDiv);
        
        // 播放連擊音效
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
          oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.1);
          oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.2);
          
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.3);
        } catch (e) {
          // 如果音效API不可用，靜默處理
        }
        
        // 2秒後移除
        setTimeout(() => {
          if (document.body.contains(comboDiv)) {
            document.body.removeChild(comboDiv);
          }
          if (document.head.contains(style)) {
            document.head.removeChild(style);
          }
        }, 2000);
      }

      function saveStars() {
        window.StarSystem.setTotalStars(totalStars);
      }

      function speak(text, lang = 'en-US') {
        if (!text) return;
        // 使用新的發音系統
        SoundSystem.speech.speakWord(text);
      }

      // 產生新題
      function loadQuestion() {
        if (questionPool.length < 1) {
          updateTimeChallengeAchievements();
          showGameSummary();
          setTimeout(() => {
            location.href = `book_edit.html?book=${encodeURIComponent(bookName)}`;
          }, 3000);
          return;
        }
        currentIndex = totalQuestions - questionPool.length + 1;
        document.getElementById('progressBar').textContent = `${currentIndex} / ${totalQuestions}`;
        document.getElementById('progressFill').style.width = `${(currentIndex / totalQuestions) * 100}%`;
        questionNumberEl.textContent = `QUESTION ${currentIndex} / ${totalQuestions}`;
        currentQuestion = questionPool.pop();
        questionTextEl.textContent = currentQuestion.word;
        
        pronounceRow.innerHTML = '';
        const btnEn = document.createElement('button');
        btnEn.innerHTML = '🔊';
        btnEn.className = 'speak-btn';
        btnEn.title = '重聽';
        btnEn.onclick = () => speak(currentQuestion.word, 'en-US');
        pronounceRow.appendChild(btnEn);
        speak(currentQuestion.word, 'en-US');
        
        const distractors = [];
        while (distractors.length < 3) {
          const r = vocab[Math.floor(Math.random() * vocab.length)];
          if (r.meaning === currentQuestion.meaning) continue;
          if (distractors.includes(r.meaning)) continue;
          distractors.push(r.meaning);
        }
        choicesArr = [currentQuestion.meaning, ...distractors];
        shuffle(choicesArr);

        choicesEl.innerHTML = '';
        choicesArr.forEach(text => {
          const btn = document.createElement('button');
          btn.textContent = text;
          btn.className = 'choice-btn';
          btn.disabled = false;
          btn.addEventListener('click', () => handleChoice(text));
          choicesEl.appendChild(btn);
        });

        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        timeLeft = 10;
        updateTimerDisplay();
        updateStatusDisplay();
        clearInterval(timerId);
        timerId = setInterval(countDown, 1000);
        
        gameStats.questionStartTime = Date.now();
      }

      function updateTimerDisplay() {
        timerEl.textContent = timeLeft;
        
        timerChip.classList.remove('warning', 'danger');
        if (timeLeft <= 5) {
          timerChip.classList.add('danger');
        } else if (timeLeft <= 10) {
          timerChip.classList.add('warning');
        }
      }

      function updateStatusDisplay() {
        scoreDisplayEl.textContent = gameStats.correctCount;
        comboDisplayEl.textContent = '×' + gameStats.consecutiveCorrect;
      }

      function countDown() {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          feedbackEl.textContent = `⏰ 時間到！正確答案：${currentQuestion.meaning}`;
          
          // ===== 新增：記錄答錯統計 =====
          gameStats.totalAnswered++;
          gameStats.consecutiveCorrect = 0; // 重置連擊
          
          // 延遲 1 秒進下一題
          setTimeout(() => {
            loadQuestion();
          }, 1000);
        } else {
          updateTimerDisplay();
        }
      }

      function handleChoice(selected) {
        if (isProcessingAnswer) {
          return;
        }
        
        isProcessingAnswer = true;
        clearInterval(timerId);
        
        const allButtons = choicesEl.querySelectorAll('.choice-btn');
        allButtons.forEach(btn => {
          btn.disabled = true;
        });
        
        const answerTime = (Date.now() - gameStats.questionStartTime) / 1000;
        gameStats.totalAnswered++;
        gameStats.totalTimeUsed += answerTime;
        
        if (selected === currentQuestion.meaning) {
          gameStats.correctCount++;
          const previousConsecutiveCount = gameStats.consecutiveCorrect;
          gameStats.consecutiveCorrect++;
          
          if (answerTime < gameStats.fastestAnswer) {
            gameStats.fastestAnswer = answerTime;
          }
          if (answerTime > gameStats.slowestAnswer) {
            gameStats.slowestAnswer = answerTime;
          }
          
          if (answerTime <= 5) {
            gameStats.perfectAnswers++;
          }
          
          const starsEarned = calculateStarReward(true, answerTime, gameStats.consecutiveCorrect, previousConsecutiveCount);
          
          if (typeof StarRewardSystem !== 'undefined') {
            StarRewardSystem.addStars(starsEarned);
          } else {
            totalStars += starsEarned;
            saveStars();
          }
          
          starDom.textContent = parseInt(localStorage.getItem('totalStars') || '0');
          
          let reasonText = '';
          if (answerTime <= 3) {
            reasonText = '⚡ 超快速答題！';
          } else if (answerTime <= 5) {
            reasonText = '🎯 快速答題！';
          }
          
          if (gameStats.consecutiveCorrect >= 5 && previousConsecutiveCount < 5) {
            reasonText += reasonText ? ' + 🔥 5連擊獎勵！' : '🔥 5連擊獎勵！';
          } else if (gameStats.consecutiveCorrect >= 3 && previousConsecutiveCount < 3) {
            reasonText += reasonText ? ' + ⚡ 3連擊獎勵！' : '⚡ 3連擊獎勵！';
          } else if (gameStats.consecutiveCorrect >= 2 && previousConsecutiveCount < 2) {
            reasonText += reasonText ? ' + ✨ 2連擊獎勵！' : '✨ 2連擊獎勵！';
          }
          
          showRewardAnimation(starsEarned, reasonText);
          showComboNotification(gameStats.consecutiveCorrect);
          
          feedbackEl.textContent = '✅ 答對了！';
          feedbackEl.className = 'feedback correct';
          updateStatusDisplay();
          
          if (typeof VocabularyAchievementSystem !== 'undefined') {
            VocabularyAchievementSystem.recordCorrectWord(currentQuestion.word, bookName);
          }
          
        } else {
          gameStats.consecutiveCorrect = 0;
          feedbackEl.textContent = `❌ 答錯了！正確：${currentQuestion.meaning}`;
          feedbackEl.className = 'feedback wrong';
          updateStatusDisplay();
        }
        
        setTimeout(() => {
          loadQuestion();
          isProcessingAnswer = false;
        }, 1000);
      }
      
      // ===== 新增：顯示遊戲總結 =====
      function showGameSummary() {
        const accuracy = (gameStats.correctCount / gameStats.totalAnswered * 100).toFixed(1);
        const avgTime = (gameStats.totalTimeUsed / gameStats.totalAnswered).toFixed(1);
        
        const summaryDiv = document.createElement('div');
        summaryDiv.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.9);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 10000;
          backdrop-filter: blur(10px);
        `;
        
        summaryDiv.innerHTML = `
          <div style="
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 40, 80, 0.95));
            border: 3px solid #00ffff;
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 50px #00ffff;
            animation: summaryPop 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
          ">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏆</div>
            <h2 style="color: #00ffff; margin-bottom: 30px; font-size: 2rem;">時間挑戰完成！</h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
              <div style="background: rgba(0,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid #00ffff;">
                <div style="font-size: 1.5rem; color: #00ffff;">${gameStats.correctCount}</div>
                <div style="font-size: 0.9rem; color: #ccc;">答對題數</div>
              </div>
              <div style="background: rgba(0,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid #00ffff;">
                <div style="font-size: 1.5rem; color: #00ffff;">${accuracy}%</div>
                <div style="font-size: 0.9rem; color: #ccc;">正確率</div>
              </div>
              <div style="background: rgba(0,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid #00ffff;">
                <div style="font-size: 1.5rem; color: #00ffff;">${avgTime}s</div>
                <div style="font-size: 0.9rem; color: #ccc;">平均答題時間</div>
              </div>
              <div style="background: rgba(0,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid #00ffff;">
                <div style="font-size: 1.5rem; color: #00ffff;">${gameStats.perfectAnswers}</div>
                <div style="font-size: 0.9rem; color: #ccc;">完美答題</div>
              </div>
            </div>
            
            <div style="
              background: linear-gradient(90deg, #ffd700, #ffaa00);
              border-radius: 15px;
              padding: 20px;
              margin: 20px 0;
              color: #000;
              font-weight: bold;
              font-size: 1.3rem;
            ">
              ⭐ 本次獲得星星：${parseInt(localStorage.getItem('totalStars') || '0') - (totalStars - gameStats.correctCount)} 顆 ⭐
            </div>
            
            <div style="color: #ccc; font-size: 0.9rem; margin-top: 20px;">
              3秒後返回單字本編輯頁面...
            </div>
          </div>
        `;
        
        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
          @keyframes summaryPop {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
          }
        `;
        document.head.appendChild(style);
        
        document.body.appendChild(summaryDiv);
        
        // 點擊背景關閉
        summaryDiv.onclick = function(e) {
          if (e.target === summaryDiv) {
            summaryDiv.remove();
            style.remove();
          }
        };
      }

      // ====== 新增：成就系統函數 ======
      function updateTimeChallengeAchievements() {
        // 更新時間挑戰遊戲完成次數
        const timeChallengeGames = parseInt(localStorage.getItem('timeChallengeGamesCompleted') || '0');
        localStorage.setItem('timeChallengeGamesCompleted', timeChallengeGames + 1);
        
        // 更新遊戲表現統計
        const accuracy = (gameStats.correctCount / gameStats.totalAnswered * 100).toFixed(1);
        const avgTime = (gameStats.totalTimeUsed / gameStats.totalAnswered).toFixed(1);
        
        // 記錄最佳表現
        const bestAccuracy = parseFloat(localStorage.getItem('timeChallengeBestAccuracy') || '0');
        const bestAvgTime = parseFloat(localStorage.getItem('timeChallengeBestAvgTime') || '999');
        
        if (parseFloat(accuracy) > bestAccuracy) {
          localStorage.setItem('timeChallengeBestAccuracy', accuracy);
        }
        if (parseFloat(avgTime) < bestAvgTime) {
          localStorage.setItem('timeChallengeBestAvgTime', avgTime);
        }
        
        // 檢查並更新相關成就
        checkAndUpdateTimeChallengeAchievements();
      }
      
      function checkAndUpdateTimeChallengeAchievements() {
        // 檢查是否有新成就達成
        const achievements = [
          { id: 'speed_learner', name: '快速學習者', requirement: 10 },
          { id: 'accuracy_master', name: '準確大師', requirement: 20 },
          { id: 'combo_king', name: '連擊之王', requirement: 15 }
        ];
        
        const claimed = JSON.parse(localStorage.getItem('claimedAchievements') || '[]');
        
        achievements.forEach(ach => {
          if (claimed.includes(ach.id)) return; // 已經領取過了
          
          // 計算通過的關卡數量
          const fillGames = parseInt(localStorage.getItem('fillGamesCompleted') || '0');
          const cardGames = parseInt(localStorage.getItem('cardGamesCompleted') || '0');
          const quizGames = parseInt(localStorage.getItem('quizGamesCompleted') || '0');
          const spellingGames = parseInt(localStorage.getItem('spellingGamesCompleted') || '0');
          const matchingGames = parseInt(localStorage.getItem('matchingGamesCompleted') || '0');
          const timeChallengeGames = parseInt(localStorage.getItem('timeChallengeGamesCompleted') || '0');
          const totalGames = fillGames + cardGames + quizGames + spellingGames + matchingGames + timeChallengeGames;
          
          if (totalGames >= ach.requirement) {
            // 顯示成就達成通知
            showAchievementNotification(ach.name, ach.id);
          }
        });
      }
      
      function showAchievementNotification(achievementName, achievementId) {
        // 創建成就通知
        const notification = document.createElement('div');
        notification.style.cssText = `
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: linear-gradient(135deg, #ffd700, #ffed4e);
          color: #000;
          padding: 20px 30px;
          border-radius: 15px;
          font-weight: bold;
          font-size: 1.2rem;
          z-index: 10000;
          box-shadow: 0 0 30px #ffd700;
          animation: achievementPop 0.8s cubic-bezier(.68, -0.55, .27, 1.55);
          text-align: center;
          min-width: 300px;
        `;
        
        notification.innerHTML = `
          <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
          <div style="margin-bottom: 5px;">🎉 成就達成！</div>
          <div style="font-size: 1.1rem;">${achievementName}</div>
          <div style="font-size: 0.9rem; margin-top: 10px; color: #666;">
            前往成就頁面領取獎勵
          </div>
        `;
        
        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
          @keyframes achievementPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
          }
        `;
        document.head.appendChild(style);
        
        document.body.appendChild(notification);
        
        // 3秒後自動移除
        setTimeout(() => {
          notification.remove();
          style.remove();
        }, 3000);
      }

      loadQuestion();

      // ===== 星空背景動畫 =====
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      const numStars = 200;
      const starsArr = [];

      function Star() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 1.5;
        this.speed = Math.random() * 0.5 + 0.2;
      }
      Star.prototype.update = function() {
        this.x -= this.speed;
        if (this.x < 0) {
          this.x = w;
          this.y = Math.random() * h;
        }
      }
      Star.prototype.draw = function() {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < numStars; i++) {
        starsArr.push(new Star());
      }
      function animate() {
        ctx.clearRect(0, 0, w, h);
        starsArr.forEach(s => {
          s.update();
          s.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });
    });
  </script>
</body>
