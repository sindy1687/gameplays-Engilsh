<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="js/stars.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>翻牌單字練習</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="responsive_enhanced.css">
    <style>
        /* 防止水平滾動 */
        html {
            overflow-x: hidden;
        }
        
        /* 確保所有元素都在視窗範圍內 */
        * {
            box-sizing: border-box;
            max-width: 100%;
        }
        
        body { 
            font-family: 'Orbitron', sans-serif; 
            background: #f0f0f0; 
            text-align: center;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .container {
            font-family: 'Orbitron', sans-serif;
            max-width: 1200px;
            width: 95%;
            margin: 40px auto;
            padding: 30px;
            background: rgba(10, 20, 40, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 32px #00ffff44, 0 0 80px #a259ff22 inset;
            border: 2px solid #00ffff;
            backdrop-filter: blur(8px);
            text-align: center;
        }
        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 180px;
            perspective: 1000px;
            margin: 30px auto;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            color: #333;
        }
        button {
            padding: 10px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: #fff;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active { background: #357ab8; }
        #levelSelectArea {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .level-card {
            width: 120px;
            height: 180px;
            background: #181a22;
            border-radius: 20px;
            box-shadow: 0 0 28px #00ffffcc, 0 0 60px #a259ff44 inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            position: relative;
            color: #00ffff;
            margin: 0;
            border: 2px solid #00ffff;
            overflow: hidden;
            padding: 0 6px;
        }
        .level-card .level-en {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2em;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff, 0 0 18px #00ffff99;
            letter-spacing: 1px;
            margin-top: 18px;
            margin-bottom: 0.3em;
            text-align: center;
            text-transform: uppercase;
        }
        .level-card .level-desc {
            font-size: 0.85em;
            color: #b6aaff;
            font-family: 'Microsoft JhengHei', 'Noto Sans TC', 'PingFang TC', 'Heiti TC', sans-serif;
            font-weight: 500;
            margin: 0.3em 0 0.3em 0;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.4;
            min-height: 2.2em;
        }
        .level-card .level-status {
            font-size: 0.9em;
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            margin-top: 0.7em;
            margin-bottom: 0.2em;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 6px #ffd700, 0 0 12px #fff2;
        }
        .level-card.completed {
            background: linear-gradient(135deg, #181a22 60%, #e0e7ef 100%);
            box-shadow: 0 0 36px #00ffff, 0 0 80px #a259ff99 inset, 0 0 24px #fff8;
            border: 2px solid #a259ff;
            animation: cardGlow 1.2s infinite alternate;
        }
        .level-card.completed::after {
            content: '\2714';
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 1.5em;
            color: #a259ff;
            text-shadow: 0 0 8px #fff, 0 0 16px #a259ff99;
            z-index: 2;
        }
        .level-card .level-progress-bar, .level-card .level-progress-label, .level-card .level-progress-zh {
            display: none !important;
        }
        @keyframes cardGlow {
            0% { box-shadow: 0 0 36px #00ffff, 0 0 80px #a259ff99 inset, 0 0 24px #fff8; }
            100% { box-shadow: 0 0 48px #00ffffcc, 0 0 120px #a259ffcc inset, 0 0 36px #fff; }
        }
        .level-card:hover {
            transform: scale(1.07);
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            background: #e6f0fa;
        }
        .match-card-front {
            background: url('https://th.bing.com/th/id/OIP.aQ__NwCVOOJiBqSM_FonkAHaKC?r=0&rs=1&pid=ImgDetMain&cb=idpwebpc2') center/cover no-repeat, rgba(10, 20, 40, 0.9);
            color: #00ffff;
            border: 2px solid #00ffff;
            box-shadow: 0 0 16px #00ffff44, 0 0 32px #a259ff22 inset;
            font-size: 2.2em;
            font-weight: bold;
            text-shadow: 0 0 8px #000, 0 0 16px #00ffff;
        }
        .back-home-btn {
            font-family: 'Orbitron', sans-serif;
            position: absolute;
            top: 24px;
            right: 32px;
            background: linear-gradient(90deg, #00ffff 0%, #a259ff 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 0 16px #00ffff, 0 0 24px #a259ff99;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }
        .back-home-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 32px #00ffff, 0 0 48px #a259ffcc;
        }

        /* Game HUD */
        .game-hud {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .hud-item {
            background: rgba(10, 20, 40, 0.8);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Progress Bar */
        .progress-bar {
            margin-bottom: 20px;
            text-align: center;
        }

        .progress-text {
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            max-width: 400px;
            margin: 0 auto;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00ffff, #a259ff);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Combo Display */
        #combo-display {
            color: #ff6b35;
            text-shadow: 0 0 8px #ff6b35;
            animation: combo-pop 0.3s ease-out;
        }

        @keyframes combo-pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Match Feedback */
        .match-feedback {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 15px;
            min-height: 30px;
            text-shadow: 0 0 10px #00ffff;
        }

        @keyframes feedback-pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Golden Card */
        .golden-card {
            border: 3px solid #ffd700 !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5) !important;
        }

        .golden-card .match-card-back {
            background: linear-gradient(135deg, #fff8dc, #ffd700) !important;
            color: #000 !important;
        }

        /* Boss Battle UI */
        .boss-battle-container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 20px;
            border: 2px solid rgba(255, 0, 0, 0.5);
            animation: boss-pulse 1s ease-in-out infinite;
        }

        .boss-header {
            font-size: 2rem;
            font-weight: 900;
            color: #ff4444;
            text-shadow: 0 0 12px #ff0000;
            margin-bottom: 15px;
        }

        .boss-hp {
            font-size: 2.5rem;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        .boss-question {
            margin: 20px 0;
        }

        .boss-question-text {
            font-size: 1.2rem;
            color: #ff9999;
            margin-bottom: 10px;
        }

        .boss-question-word {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
        }

        .boss-input {
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 2px solid #ff4444;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: center;
            margin-bottom: 15px;
        }

        .boss-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .boss-option-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: 2px solid #ff4444;
            border-radius: 10px;
            background: rgba(255, 68, 68, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .boss-option-btn:hover {
            background: rgba(255, 68, 68, 0.4);
            transform: scale(1.05);
        }

        .boss-feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }

        .boss-feedback.correct {
            color: #4caf50;
        }

        .boss-feedback.wrong {
            color: #f44336;
        }

        .boss-result {
            text-align: center;
            padding: 40px;
        }

        .boss-result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .boss-result-title {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .boss-result-reward {
            font-size: 1.5rem;
            color: #00ffff;
            margin-bottom: 20px;
        }

        .boss-result-desc {
            font-size: 1.2rem;
            color: #ff9999;
            margin-bottom: 20px;
        }

        @keyframes boss-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.6); }
        }

        /* Difficulty Selection */
        .difficulty-selection {
            margin: 20px 0;
            text-align: center;
        }

        .difficulty-selection h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .difficulty-btn {
            padding: 12px 24px;
            margin: 0 8px;
            font-size: 1.1rem;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #00ffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .difficulty-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .difficulty-btn.selected {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* Memory Timer HUD */
    .memory-timer {
      position: sticky;
      top: 14px;
      margin: 14px auto 22px;
      width: fit-content;
      min-width: 260px;
      padding: 12px 22px;
      border-radius: 18px;
      background: rgba(9,17,35,.94);
      border: 1px solid rgba(0,230,255,.28);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-size: 1.35rem;
      font-weight: 900;
      z-index: 20;
      text-align: center;
    }

    .memory-timer .timer-number {
      color: #00eaff;
      font-size: 1.8rem;
      margin: 0 8px;
    }

    .memory-tip {
      color: rgba(255,255,255,.72);
      font-size: .9rem;
      margin-top: 8px;
    }

    /* START Banner */
    .start-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: 900;
      color: #00eaff;
      text-shadow: 0 0 20px #00eaff, 0 0 40px #a259ff;
      pointer-events: none;
      z-index: 1000;
      animation: start-pop 0.6s ease-out;
    }

    @keyframes start-pop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes timer-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* Hint Button */
        .hint-btn {
            margin: 0 auto 20px auto;
            display: block;
        }

        /* 響應式設計 */
        /* 大螢幕優化 */
        @media (min-width: 1200px) {
            .container {
                max-width: 1400px;
                padding: 40px;
            }
            
            #levelSelectArea {
                gap: 30px;
            }
            
            .level-card {
                width: 140px;
                height: 200px;
            }
        }

        /* 平板適配 */
        @media (max-width: 1024px) {
            .container {
                width: 98%;
                padding: 25px;
                margin: 30px auto;
            }
            
            #levelSelectArea {
                gap: 18px;
            }
            
            .level-card {
                width: 110px;
                height: 170px;
                padding: 10px;
            }
            
            .level-card .level-en {
                font-size: 1.1rem;
            }
            
            .level-card .level-desc {
                font-size: 0.8rem;
            }
            
            .back-home-btn {
                top: 20px;
                right: 25px;
                padding: 8px 18px;
                font-size: 1rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 20px;
                margin: 20px auto;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            
            #levelSelectArea {
                gap: 15px;
                margin: 25px 0;
            }
            
            .level-card {
                width: 100px;
                height: 150px;
                padding: 8px;
            }
            
            .level-card .level-en {
                font-size: 1rem;
                margin-top: 12px;
            }
            
            .level-card .level-desc {
                font-size: 0.75rem;
                line-height: 1.3;
            }
            
            .level-card .level-status {
                font-size: 0.8rem;
                margin-top: 0.5em;
            }
            
            .flip-card {
                width: 250px;
                height: 150px;
                margin: 25px auto;
            }
            
            .flip-card-front, .flip-card-back {
                font-size: 1.6em;
            }
            
            button {
                padding: 8px 24px;
                font-size: 1.1em;
            }
            
            .back-home-btn {
                top: 15px;
                right: 20px;
                padding: 6px 15px;
                font-size: 0.9rem;
            }
        }

        /* 手機適配 */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
                margin: 15px auto;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            #levelSelectArea {
                gap: 12px;
                margin: 20px 0;
            }
            
            .level-card {
                width: 90px;
                height: 135px;
                padding: 6px;
            }
            
            .level-card .level-en {
                font-size: 0.9rem;
                margin-top: 10px;
            }
            
            .level-card .level-desc {
                font-size: 0.7rem;
                line-height: 1.2;
                min-height: 2em;
            }
            
            .level-card .level-status {
                font-size: 0.75rem;
            }
            
            .flip-card {
                width: 200px;
                height: 120px;
                margin: 20px auto;
            }
            
            .flip-card-front, .flip-card-back {
                font-size: 1.3em;
            }
            
            button {
                padding: 6px 20px;
                font-size: 1rem;
            }
            
            .back-home-btn {
                top: 12px;
                right: 15px;
                padding: 5px 12px;
                font-size: 0.8rem;
            }
        }

        /* 小螢幕手機 */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
                margin: 10px auto;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            #levelSelectArea {
                gap: 10px;
                margin: 18px 0;
            }
            
            .level-card {
                width: 80px;
                height: 120px;
                padding: 5px;
            }
            
            .level-card .level-en {
                font-size: 0.8rem;
                margin-top: 8px;
            }
            
            .level-card .level-desc {
                font-size: 0.65rem;
                line-height: 1.1;
                min-height: 1.8em;
            }
            
            .level-card .level-status {
                font-size: 0.7rem;
                margin-top: 0.3em;
            }
            
            .flip-card {
                width: 180px;
                height: 110px;
                margin: 15px auto;
            }
            
            .flip-card-front, .flip-card-back {
                font-size: 1.1em;
            }
            
            button {
                padding: 5px 16px;
                font-size: 0.9rem;
            }
            
            .back-home-btn {
                top: 10px;
                right: 12px;
                padding: 4px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-home-btn" onclick="location.href='atlas.html'">← 返回首頁</button>
        <h1>🌌 單字配對記憶遊戲</h1>
        <div id="levelSelectArea"></div>
        <div id="reviewArea" style="display:none;">
            <h2>本關單字複習</h2>
            <div id="reviewWordList" style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px 32px;margin:24px 0 18px 0;" class="review-word-list"></div>
            <div class="difficulty-selection">
                <h3>選擇難度</h3>
                <button class="difficulty-btn" data-difficulty="practice">🌱 練習</button>
                <button class="difficulty-btn" data-difficulty="normal">⚔️ 標準</button>
                <button class="difficulty-btn" data-difficulty="hard">🔥 挑戰</button>
            </div>
            <button class="btn" id="startGameBtn">開始遊戲</button>
            <button class="btn" id="skipLevelBtn1">⚡ 快速挑戰</button>
        </div>
        <div id="matchGameArea" style="display:none;">
            <div class="game-hud">
                <div class="hud-item">⏱ <span id="gameTimer">60</span></div>
                <div class="hud-item">⭐ <span id="gameStars">0</span></div>
                <div class="hud-item" id="combo-display" style="display:none;"></div>
                <div class="hud-item">👣 <span id="gameMoves">0</span></div>
                <div class="hud-item">❌ <span id="gameErrors">0</span></div>
            </div>
            <div class="progress-bar">
                <div class="progress-text">已完成：<span id="matchProgress">0</span> / <span id="totalPairs">0</span></div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div id="match-feedback" class="match-feedback"></div>
            <button class="btn hint-btn" id="hintBtn">💡 提示</button>
            <div class="grid" id="matchGridWrap">
                <div id="matchGrid"></div>
            </div>
            <button class="btn" id="backToMenuBtn" style="display:none;">返回選單</button>
            <button class="btn" id="skipLevelBtn2">⚡ 快速挑戰</button>
        </div>
    </div>
    <audio id="successSound" src="sound/correct.mp3" preload="auto"></audio>
    <audio id="failSound" src="sound/wrong.mp3" preload="auto"></audio>
    <script src="js/sound.js"></script>
    <script src="js/vocabData.js"></script>
    <script src="js/stageProgress.js"></script>
    <script>
    // ===== 翻牌遊戲配置 =====
    const FLIPCARD_GAME_CONFIG = {
      practice: {
        previewSeconds: 8,
        timeLimit: 0,
        hintCost: 0
      },
      normal: {
        previewSeconds: 5,
        timeLimit: 60,
        hintCost: 10
      },
      hard: {
        previewSeconds: 3,
        timeLimit: 45,
        hintCost: 15,
        starMultiplier: 1.5
      },
      bossQuestions: 3,
      bossWrongLimit: 3,
      goldenPairChance: 0.12,
      eventEveryMatches: 3,
      comboMultiplier: {
        2: 1.4,
        3: 2.0,
        5: 3.0
      }
    };

    // ===== 翻牌遊戲狀態 =====
    const matchGameState = {
      difficulty: 'normal',
      round: 1,
      totalRounds: 1,
      combo: 0,
      maxCombo: 0,
      moves: 0,
      wrongAttempts: 0,
      sessionStars: 0,
      hintsUsed: 0,
      reviveUsed: false,
      currentEvent: null,
      bossActive: false,
      bossHp: 3,
      bossWrongCount: 0,
      goldenPairId: null,
      timeLeft: 0,
      timerInterval: null
    };

    let vocabList = [];
    let currentGroup = '';

        if (Array.isArray(arr) && arr.length > 0) {
          customBookVocab = arr

            .map(v => ({ en: v.word, zh: v.meaning }));
        }

    }

    // 新增：更穩定可靠的語音初始化函數
    function initializeSpeechSynthesis() {
      // 確保 SoundSystem 初始化，並選擇最佳語音
      if (typeof SoundSystem !== 'undefined' && !SoundSystem.speech.isInitialized) {
        SoundSystem.speech.init();
      }
      
      // 如果語音已經載入，就直接使用
      if (speechSynthesis.getVoices().length > 0) {
        if (typeof SoundSystem !== 'undefined') {
            SoundSystem.speech.selectBestVoice();
        }
        voicesLoaded = true;
      } else {
        // 否則，設定事件監聽器，並在1秒後再次檢查以防萬一
        speechSynthesis.onvoiceschanged = () => {
          if (typeof SoundSystem !== 'undefined') {
            SoundSystem.speech.selectBestVoice();
          }
          voicesLoaded = true;
        };
        setTimeout(() => {
            if (speechSynthesis.getVoices().length > 0 && !voicesLoaded) {
                speechSynthesis.onvoiceschanged();
            }
        }, 1000);
      }
    }

    function showLevelSelect() {
        // 如果有自訂單字本，直接進入練習，不顯示群組選單
        if (customBookVocab) {
            // 直接分 4 關，每關 5 個單字
            let allWords = customBookVocab.slice();
            shuffleArray(allWords);
            allLevelWords = allWords.slice(0, Math.min(LEVELS_PER_GROUP * WORDS_PER_LEVEL, allWords.length));
            levelWordSets = [];
            for (let i = 0; i < LEVELS_PER_GROUP; i++) {
                levelWordSets.push(allLevelWords.slice(i*WORDS_PER_LEVEL, (i+1)*WORDS_PER_LEVEL));
            }
            currentLevel = 0;
            showReviewArea();
            // 隱藏群組選單
            document.getElementById('levelSelectArea').style.display = 'none';
            return;
        }
        // 否則顯示原本的群組選單
        const area = document.getElementById('levelSelectArea');
        area.innerHTML = '';
        getGroupNames().forEach(group => {
            let key = group + '_ALL';
            let completed = completedGroups[key];
            if (completed) {
              let passed = JSON.parse(localStorage.getItem('passed_flipcard')||'[]');
              if (!passed.includes(group)) {
                passed.push(group);
                localStorage.setItem('passed_flipcard', JSON.stringify(passed));
              }
            }
            const card = document.createElement('div');
            card.className = 'level-card' + (completed ? ' completed' : '');
            const en = group.toUpperCase();
            const desc = groupDescMap[group] || '';
            let status = completed ? '已解鎖' : '';
            card.innerHTML = `
                <div class="level-en">${en}</div>
                <div class="level-desc">${desc}</div>
                <div class="level-status">${status}</div>
            `;
            card.onclick = function() {
                currentGroup = group;
                // 取出全部單字，隨機分4關
                let allWords = (vocabData[group] || []).slice();
                shuffleArray(allWords);
                allLevelWords = allWords.slice(0, Math.min(LEVELS_PER_GROUP * WORDS_PER_LEVEL, allWords.length));
                levelWordSets = [];
                for (let i = 0; i < LEVELS_PER_GROUP; i++) {
                    levelWordSets.push(allLevelWords.slice(i*WORDS_PER_LEVEL, (i+1)*WORDS_PER_LEVEL));
                }
                currentLevel = 0;
                showReviewArea(); // 先顯示複習區
            };
            area.appendChild(card);
        });
        area.style.display = '';
        document.getElementById('matchGameArea').style.display = 'none';
        document.getElementById('reviewArea').style.display = 'none';
    }

    function showReviewArea() {

            item.style.padding = '12px 18px';

        document.getElementById('matchGameArea').style.display = 'none';

    function startMatchGame() {
        // 取本關單字
        let pairs = (levelWordSets && levelWordSets[currentLevel]) ? levelWordSets[currentLevel].slice() : [];
        matchPairs = pairs;
        setupMatchGrid();
        document.getElementById('levelSelectArea').style.display = 'none';
        document.getElementById('matchGameArea').style.display = '';
        document.getElementById('backToMenuBtn').style.display = 'none';
        showLevelProgress();
        
        // 根據難度設定預覽時間
        const config = FLIPCARD_GAME_CONFIG[matchGameState.difficulty];
        let previewSec = config.previewSeconds;
        
        // 設定遊戲時間限制
        matchGameState.timeLeft = config.timeLimit;
        updateGameHUD();
        
        // 如果有時間限制，啟動計時器
        if (config.timeLimit > 0) {
            startGameTimer();
        }
        
        // 進入時全部翻開，並顯示倒數
        showPreviewCountdown(previewSec);
        
        // 記憶期間禁止點擊
        document.querySelectorAll('.match-card').forEach(card => {
            card.classList.add('locked');
        });
        
        setTimeout(() => {
            document.querySelectorAll('.match-card').forEach(card => card.classList.add('flipped'));
            lockBoard = true;
            let left = previewSec;
            let timer = setInterval(() => {
                left--;
                showPreviewCountdown(left);
                if (left <= 0) {
                    clearInterval(timer);
                    // 顯示 START Banner
                    showStartBanner();
                    
                    setTimeout(() => {
                        // 全部蓋牌
                        document.querySelectorAll('.match-card').forEach(card => {
                            card.classList.remove('flipped');
                            card.classList.remove('locked');
                        });
                        lockBoard = false;
                        showPreviewCountdown(0, true);
                    }, 600);
                }
            }, 1000);
        }, 100);
    }

    // ===== 自動 Grid 欄數計算 =====
    function getMatchGridColumns(cardCount) {
        if (cardCount <= 4) return 2;
        if (cardCount <= 6) return 3;
        if (cardCount <= 8) return 4;
        if (cardCount <= 10) return 5;
        if (cardCount <= 12) return 4;
        if (cardCount <= 15) return 5;
        return 4;
    }

    function setupMatchGrid() {
        const grid = document.getElementById('matchGrid');
        grid.innerHTML = '';
        firstCard = null;
        lockBoard = false;
        matchedCount = 0;
        
        // 重置遊戲狀態
        matchGameState.combo = 0;
        matchGameState.maxCombo = 0;
        matchGameState.moves = 0;
        matchGameState.wrongAttempts = 0;
        matchGameState.sessionStars = 0;
        matchGameState.hintsUsed = 0;
        matchGameState.bossActive = false;
        matchGameState.bossHp = 3;
        matchGameState.bossWrongCount = 0;
        
        // 隨機選擇黃金卡（但不顯示）
        if (matchPairs.length > 0) {
            const goldenIndex = Math.floor(Math.random() * matchPairs.length);
            matchGameState.goldenPairId = goldenIndex;
        }
        
        // 產生英文卡片與中文卡片
        let cards = [];
        matchPairs.forEach((pair, idx) => {
            cards.push({ type: 'en', value: pair.en, pairId: idx });
            cards.push({ type: 'zh', value: pair.zh, pairId: idx });
        });
        shuffleArray(cards);
        matchCards = cards;
        
        // 設定 Grid 欄數
        const columns = getMatchGridColumns(cards.length);
        grid.style.setProperty('--grid-columns', columns);
        
        // 建立卡片元素
        cards.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = 'match-card';
            // 不在記憶階段顯示黃金卡
            div.dataset.type = card.type;
            div.dataset.value = card.value;
            div.dataset.pairId = card.pairId;
            // 3D翻牌結構
            const inner = document.createElement('div');
            inner.className = 'match-card-inner';
            const front = document.createElement('div');
            front.className = 'match-card-front';
            front.innerHTML = '<span>?</span>';
            const back = document.createElement('div');
            back.className = 'match-card-back';
            const len = (card.value || '').length;
            back.innerHTML = `<span style="--len:${len}">${card.value}</span>`;
            inner.appendChild(front);
            inner.appendChild(back);
            div.appendChild(inner);
            div.onclick = function() { onCardClick(div, card); };
            grid.appendChild(div);
        });
        // 動態調整字體大小，確保內容不超出卡片
        setTimeout(() => {
            grid.querySelectorAll('.match-card-back span').forEach(span => {
                fitTextToCardOneLine(span, span.parentElement);
            });
        }, 0);
    }

    function onCardClick(div, card) {
        if (lockBoard || div.classList.contains('matched')) return;
        // 點擊英文卡牌時發音（不論是否已翻開）
        if (card.type === 'en') {
            speakWord(card.value);
        }
        if (div.classList.contains('flipped')) return;
        div.classList.add('flipped');
        if (!firstCard) {
            firstCard = { div, card };
        } else {
            matchGameState.moves++; // 增加步數
            lockBoard = true;
            setTimeout(() => {
                if (firstCard.card.pairId === card.pairId && firstCard.card.type !== card.type) {
                    // 配對成功
                    document.getElementById('successSound').currentTime = 0;
                    document.getElementById('successSound').play();
                    div.classList.add('matched');
                    firstCard.div.classList.add('matched');
                    matchedCount++;
                    
                    // 增加 Combo
                    matchGameState.combo++;
                    if (matchGameState.combo > matchGameState.maxCombo) {
                        matchGameState.maxCombo = matchGameState.combo;
                    }
                    
                    // 計算星星
                    let stars = 5;
                    const comboMultiplier = FLIPCARD_GAME_CONFIG.comboMultiplier[matchGameState.combo] || 1;
                    stars = Math.floor(stars * comboMultiplier);
                    
                    // 黃金卡獎勵
                    if (card.pairId === matchGameState.goldenPairId) {
                        stars += 20;
                        // 顯示黃金卡效果
                        div.classList.add('golden-reveal');
                        firstCard.div.classList.add('golden-reveal');
                    }
                    
                    matchGameState.sessionStars += stars;
                    
                    // 顯示 Combo 和星星
                    showComboDisplay();
                    showMatchFeedback(stars, card.pairId === matchGameState.goldenPairId);
                    updateGameHUD();
                    updateProgress();
                    
                    if (matchedCount === matchPairs.length) {
                        // 全部配對完成，進入 Boss
                        setTimeout(() => {
                            startBossBattle();
                        }, 1000);
                    }
                } else {
                    // 配對失敗
                    document.getElementById('failSound').currentTime = 0;
                    document.getElementById('failSound').play();
                    matchGameState.combo = 0; // 重置 Combo
                    matchGameState.wrongAttempts++; // 增加錯誤次數
                    showComboDisplay();
                    updateGameHUD();
                    div.classList.remove('flipped');
                    firstCard.div.classList.remove('flipped');
                }
                firstCard = null;
                lockBoard = false;
            }, 800);
        }
    }

    // ===== Combo 顯示 =====
    function showComboDisplay() {
        const comboEl = document.getElementById('combo-display');
        if (!comboEl) return;
        
        if (matchGameState.combo >= 2) {
            let comboText = `COMBO ×${matchGameState.combo}`;
            if (matchGameState.combo >= 5) {
                comboText = '🔥 MEMORY STREAK';
            }
            comboEl.textContent = comboText;
            comboEl.style.display = 'block';
            comboEl.style.animation = 'none';
            setTimeout(() => {
                comboEl.style.animation = 'combo-pop 0.3s ease-out';
            }, 10);
        } else {
            comboEl.style.display = 'none';
        }
    }

    // ===== 更新遊戲 HUD =====
    function updateGameHUD() {
        const timerEl = document.getElementById('gameTimer');
        const starsEl = document.getElementById('gameStars');
        const movesEl = document.getElementById('gameMoves');
        const errorsEl = document.getElementById('gameErrors');
        
        if (timerEl) timerEl.textContent = matchGameState.timeLeft;
        if (starsEl) starsEl.textContent = matchGameState.sessionStars;
        if (movesEl) movesEl.textContent = matchGameState.moves;
        if (errorsEl) errorsEl.textContent = matchGameState.wrongAttempts;
    }

    // ===== 更新進度 =====
    function updateProgress() {
        const progressEl = document.getElementById('matchProgress');
        const totalEl = document.getElementById('totalPairs');
        const fillEl = document.getElementById('progressFill');
        
        if (progressEl) progressEl.textContent = matchedCount;
        if (totalEl) totalEl.textContent = matchPairs.length;
        if (fillEl) {
            const percent = (matchedCount / matchPairs.length) * 100;
            fillEl.style.width = percent + '%';
        }
    }

    // ===== 配對回饋顯示 =====
    function showMatchFeedback(stars, isGolden) {
        const feedbackEl = document.getElementById('match-feedback');
        if (!feedbackEl) return;
        
        let feedbackText = `MATCH! +${stars}⭐`;
        if (isGolden) {
            feedbackText = '⭐ GOLDEN MATCH! +' + stars + '⭐';
        }
        
        feedbackEl.textContent = feedbackText;
        feedbackEl.style.display = 'block';
        feedbackEl.style.animation = 'feedback-pop 0.5s ease-out';
        
        setTimeout(() => {
            feedbackEl.style.display = 'none';
        }, 1000);
    }

    // ===== Boss 戰系統 =====
    function startBossBattle() {
        matchGameState.bossActive = true;
        matchGameState.bossHp = FLIPCARD_GAME_CONFIG.bossQuestions;
        matchGameState.bossWrongCount = 0;
        
        // 顯示 Boss UI
        showBossUI();
    }

    function showBossUI() {
        const gameArea = document.getElementById('matchGameArea');
        if (!gameArea) return;
        
        gameArea.innerHTML = `
            <div class="boss-battle-container">
                <div class="boss-header">👑 BOSS BATTLE</div>
                <div class="boss-hp">${'❤️'.repeat(matchGameState.bossHp)}</div>
                <div class="boss-question" id="bossQuestion"></div>
                <div class="boss-options" id="bossOptions"></div>
                <div class="boss-feedback" id="bossFeedback"></div>
            </div>
        `;
        
        loadBossQuestion();
    }

    function loadBossQuestion() {
        // 從本關單字隨機選一題
        const randomIndex = Math.floor(Math.random() * matchPairs.length);
        const pair = matchPairs[randomIndex];
        
        const questionEl = document.getElementById('bossQuestion');
        const optionsEl = document.getElementById('bossOptions');
        
        if (!questionEl || !optionsEl) return;
        
        // 隨機選擇題型
        const questionType = Math.floor(Math.random() * 3);
        
        if (questionType === 0) {
            // 中文 -> 英文輸入
            questionEl.innerHTML = `
                <div class="boss-question-text">請輸入英文：</div>
                <div class="boss-question-word">${pair.zh}</div>
                <input type="text" id="bossAnswerInput" class="boss-input" placeholder="輸入英文" />
                <button id="bossSubmitBtn" class="btn">送出</button>
            `;
            
            const input = document.getElementById('bossAnswerInput');
            const submitBtn = document.getElementById('bossSubmitBtn');
            
            if (input) {
                input.focus();
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        checkBossAnswer(input.value.trim(), pair.en);
                    }
                };
            }
            
            if (submitBtn) {
                submitBtn.onclick = () => {
                    const input = document.getElementById('bossAnswerInput');
                    if (input) {
                        checkBossAnswer(input.value.trim(), pair.en);
                    }
                };
            }
        } else if (questionType === 1) {
            // 英文 -> 中文選擇
            questionEl.innerHTML = `
                <div class="boss-question-text">請選擇中文：</div>
                <div class="boss-question-word">${pair.en}</div>
            `;
            
            // 生成選項
            const options = [pair.zh];
            while (options.length < 3) {
                const randomPair = matchPairs[Math.floor(Math.random() * matchPairs.length)];
                if (!options.includes(randomPair.zh)) {
                    options.push(randomPair.zh);
                }
            }
            shuffleArray(options);
            
            optionsEl.innerHTML = options.map(opt => 
                `<button class="boss-option-btn" onclick="checkBossAnswer('${opt}', '${pair.zh}')">${opt}</button>`
            ).join('');
        } else {
            // 聽力 -> 中文選擇
            questionEl.innerHTML = `
                <div class="boss-question-text">請選擇聽到的單字中文：</div>
                <button class="btn" onclick="speakWord('${pair.en}')">🔊 播放</button>
            `;
            
            // 生成選項
            const options = [pair.zh];
            while (options.length < 3) {
                const randomPair = matchPairs[Math.floor(Math.random() * matchPairs.length)];
                if (!options.includes(randomPair.zh)) {
                    options.push(randomPair.zh);
                }
            }
            shuffleArray(options);
            
            optionsEl.innerHTML = options.map(opt => 
                `<button class="boss-option-btn" onclick="checkBossAnswer('${opt}', '${pair.zh}')">${opt}</button>`
            ).join('');
            
            // 自動播放
            setTimeout(() => speakWord(pair.en), 500);
        }
    }

    function checkBossAnswer(userAnswer, correctAnswer) {
        const feedbackEl = document.getElementById('bossFeedback');
        if (!feedbackEl) return;
        
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
            // 答對
            matchGameState.bossHp--;
            feedbackEl.textContent = '✅ 正確！';
            feedbackEl.className = 'boss-feedback correct';
            
            if (matchGameState.bossHp <= 0) {
                // Boss 擊敗
                setTimeout(() => {
                    showBossDefeat();
                }, 1000);
            } else {
                // 下一題
                setTimeout(() => {
                    updateBossHP();
                    loadBossQuestion();
                }, 1000);
            }
        } else {
            // 答錯
            matchGameState.bossWrongCount++;
            feedbackEl.textContent = '❌ 錯誤！';
            feedbackEl.className = 'boss-feedback wrong';
            
            if (matchGameState.bossWrongCount >= FLIPCARD_GAME_CONFIG.bossWrongLimit) {
                // Boss 逃走
                setTimeout(() => {
                    showBossEscape();
                }, 1000);
            } else {
                // 重新出題
                setTimeout(() => {
                    loadBossQuestion();
                }, 1000);
            }
        }
    }

    function updateBossHP() {
        const hpEl = document.querySelector('.boss-hp');
        if (hpEl) {
            hpEl.textContent = '❤️'.repeat(matchGameState.bossHp);
        }
    }

    function showBossDefeat() {
        matchGameState.sessionStars += 50; // Boss 擊敗獎勵
        
        const gameArea = document.getElementById('matchGameArea');
        if (!gameArea) return;
        
        gameArea.innerHTML = `

    function rebuildMatchGrid() {
        const grid = document.getElementById('matchGrid');
        if (!grid) return;
        
        grid.innerHTML = '';
        
        matchCards.forEach((card, i) => {
            const div = document.createElement('div');
            div.className = 'match-card';
            if (card.pairId === matchGameState.goldenPairId) {
                div.classList.add('golden-card');
            }
            div.dataset.type = card.type;
            div.dataset.value = card.value;
            div.dataset.pairId = card.pairId;
            
            // 檢查是否已配對
            const isMatched = card.pairId < matchedCount;
            if (isMatched) {
                div.classList.add('matched');
            }
            
            // 3D翻牌結構
            const inner = document.createElement('div');
            inner.className = 'match-card-inner';
            const front = document.createElement('div');
            front.className = 'match-card-front';
            front.innerHTML = '<span>?</span>';
            const back = document.createElement('div');
            back.className = 'match-card-back';
            const len = (card.value || '').length;
            back.innerHTML = `<span style="--len:${len}">${card.value}</span>`;
            inner.appendChild(front);
            inner.appendChild(back);
            div.appendChild(inner);
            div.onclick = function() { onCardClick(div, card); };
            grid.appendChild(div);
        });
        
        // 動態調整字體大小
        setTimeout(() => {
            grid.querySelectorAll('.match-card-back span').forEach(span => {
                fitTextToCardOneLine(span, span.parentElement);

    // ===== 計算評價 =====
    function calculateGrade() {
        const bossDefeated = matchGameState.bossHp <= 0;
        const wrongAttempts = matchGameState.wrongAttempts;
        const maxCombo = matchGameState.maxCombo;
        
        if (bossDefeated && wrongAttempts <= 2 && maxCombo >= 5) {
            return 'S';
        } else if (bossDefeated) {
            return 'A';
        } else if (wrongAttempts <= 3) {
            return 'B';
        } else {
            return 'C';
        }
    }

    // ===== 儲存最佳紀錄 =====
    function saveBestRecords(grade) {
        const levelKey = currentGroup + '_level_' + currentLevel;
        const stats = JSON.parse(localStorage.getItem('flipcardPracticeStats') || '{}');
        
        if (!stats[levelKey]) {
            stats[levelKey] = {
                bestTime: matchGameState.timeLeft,
                bestMoves: matchGameState.moves,
                bestCombo: matchGameState.maxCombo,
                bestRank: grade
            };
        } else {
            const current = stats[levelKey];
            if (matchGameState.timeLeft > current.bestTime) {
                current.bestTime = matchGameState.timeLeft;
            }
            if (matchGameState.moves < current.bestMoves) {
                current.bestMoves = matchGameState.moves;
            }
            if (matchGameState.maxCombo > current.bestCombo) {
                current.bestCombo = matchGameState.maxCombo;
            }
            // 評價比較：S > A > B > C
            const rankOrder = { 'S': 4, 'A': 3, 'B': 2, 'C': 1 };
            if (rankOrder[grade] > rankOrder[current.bestRank]) {
                current.bestRank = grade;
            }
        }
        
        localStorage.setItem('flipcardPracticeStats', JSON.stringify(stats));
    }

    // ===== 提示系統 =====
    function setupHintButton() {
        const hintBtn = document.getElementById('hintBtn');
        if (!hintBtn) return;
        
        hintBtn.onclick = () => {
            const config = FLIPCARD_GAME_CONFIG[matchGameState.difficulty];
            const cost = config.hintCost;
            
            // 檢查星星是否足夠
            if (matchGameState.sessionStars < cost) {
                alert('星星不足！');
                return;
            }
            
            // 找到一組尚未完成的配對
            const unmatchedPairs = matchPairs.filter((pair, idx) => {
                const card1 = matchCards.find(c => c.pairId === idx);
                const card2 = matchCards.find(c => c.pairId === idx && c !== card1);
                const el1 = document.querySelector(`[data-pair-id="${idx}"]`);
                const el2 = document.querySelector(`[data-pair-id="${idx}"]:not([data-pair-id="${idx}"])`);
                return el1 && !el1.classList.contains('matched');
            });
            
            if (unmatchedPairs.length === 0) {
                alert('沒有需要提示的配對！');
                return;
            }
            
            // 隨機選一組
            const randomPair = unmatchedPairs[Math.floor(Math.random() * unmatchedPairs.length)];
            const pairId = matchPairs.indexOf(randomPair);
            
            // 找到這組的兩張卡片
            const cards = document.querySelectorAll(`[data-pair-id="${pairId}"]`);
            
            // 扣除星星
            matchGameState.sessionStars -= cost;
            matchGameState.hintsUsed++;
            updateGameHUD();
            
            // 短暫翻開
            cards.forEach(card => {
                card.classList.add('flipped');
            });
            
            // 1秒後蓋回去
            setTimeout(() => {
                cards.forEach(card => {
                    if (!card.classList.contains('matched')) {
                        card.classList.remove('flipped');
                    }
                });
            }, 1000);
        };
    }

    function setupDifficultySelection() {

        difficultyBtns.forEach(btn => {

    function speakWord(word) {
        if (!window.speechSynthesis) return;
        // 使用新的發音系統
        if (typeof SoundSystem !== 'undefined' && SoundSystem.speech) {
            SoundSystem.speech.speakWord(word);
        } else {
            // 備用方案：如果 SoundSystem 不存在，直接使用瀏覽器 API
            const utter = new SpeechSynthesisUtterance(word);
            utter.lang = 'en-US';
            window.speechSynthesis.speak(utter);
        }
    }

    function shuffleArray(array) {

    // 動態調整字體大小直到內容不超出卡片
    function fitTextToCard(span, cardDiv) {
        let maxFont = 2.2;
        let minFont = 0.7;
        let font = maxFont;
        span.style.fontSize = font + 'em';
        const maxHeight = cardDiv.clientHeight - 16;
        const maxWidth = cardDiv.clientWidth - 16;
        while ((span.scrollHeight > maxHeight || span.scrollWidth > maxWidth) && font > minFont) {
            font -= 0.08;
            span.style.fontSize = font + 'em';
        }
    }

    // 英文單字：動態縮小字體直到單行內不超出卡片寬度
    function fitTextToCardOneLine(span, cardDiv) {
        let maxFont = 1.1;
        let minFont = 0.5;
        let font = maxFont;
        span.style.fontSize = font + 'em';
        span.style.whiteSpace = 'nowrap';
        const maxWidth = cardDiv.clientWidth - 16;
        while ((span.scrollWidth > maxWidth) && font > minFont) {
            font -= 0.04;
            span.style.fontSize = font + 'em';
        }
    }

      box-shadow: 0 0 12px rgba(0,230,255,.45), 0 0 24px #a259ff22 inset, 0 8px 24px #0008;
      color: #00ffff;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.25,.8,.25,1), box-shadow 0.3s, background 0.2s;
      user-select: none;
      position: relative;
      perspective: 600px;
      margin: 0;
    }
    .match-card:hover {
      transform: translateY(-8px) scale(1.04) rotateZ(-2deg);
      box-shadow: 0 0 20px rgba(0,230,255,.65), 0 0 48px #a259ff99, 0 8px 32px #000b;
    }
    .match-card.locked {
      cursor: default;
    }
    .match-card.locked:hover {
      transform: none;
      box-shadow: 0 0 12px rgba(0,230,255,.45), 0 0 24px #a259ff22 inset, 0 8px 24px #0008;
    }
    #matchGrid {
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), minmax(110px, 150px));
      justify-content: center;
      align-items: center;
      gap: 22px 28px;
      width: 100%;
      margin: 0 auto;
    }
    .match-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4,0.2,0.2,1);
    }
    .match-card.flipped .match-card-inner {
      transform: rotateY(180deg);
    }
    .match-card-front, .match-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      backface-visibility: hidden;
      font-size: 1.2em;
      font-family: 'Orbitron', sans-serif;
      padding: 8px;
      word-break: normal;
      white-space: nowrap;
      text-align: center;
      overflow-wrap: normal;
      overflow: hidden;
      line-height: 1.2;
      max-width: 100%;
      max-height: 100%;
    }
    .match-card-front span, .match-card-back span {
      display: block;
      width: 100%;
      word-break: normal;
      white-space: nowrap;
      text-align: center;
      overflow-wrap: normal;
      overflow: hidden;
      font-size: 1em;
      line-height: 1.2;
      hyphens: none;
      letter-spacing: 0.02em;
    }
    .match-card-front {
      background: url('https://th.bing.com/th/id/OIP.aQ__NwCVOOJiBqSM_FonkAHaKC?r=0&rs=1&pid=ImgDetMain&cb=idpwebpc2') center/cover no-repeat, rgba(10, 20, 40, 0.9);
      color: #00ffff;
      border: 2px solid #00ffff;
      box-shadow: 0 0 16px #00ffff44, 0 0 32px #a259ff22 inset;
      font-size: 2.2em;
      font-weight: bold;
      text-shadow: 0 0 8px #000, 0 0 16px #00ffff;
    }
    .match-card-back {
      background: linear-gradient(145deg, #e0f7fa, #80deea);
      color: #1a237e;
      border: 2px solid #a259ff;
      box-shadow: 0 0 20px rgba(0,230,255,.45), 0 0 30px rgba(162,89,255,.3);
      transform: rotateY(180deg);
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(255,255,255,0.7);
      padding: 12px;
    }
    .match-card-back span {
      font-family: 'Orbitron', 'Roboto Mono', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      letter-spacing: 0.5px;
      line-height: 1.25;
    }
    .match-card[data-type="zh"] .match-card-back span {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      letter-spacing: 0;
    }
    .match-card.matched {
      opacity: 0.3;
      pointer-events: none;
    }
    .match-card.golden-reveal {
      border: 3px solid #ffd700 !important;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5) !important;
    }
    .match-card.golden-reveal .match-card-back {
      background: linear-gradient(135deg, #fff8dc, #ffd700) !important;
      color: #000 !important;
    }
    .btn {
      font-family: 'Orbitron', sans-serif;
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      font-size: 1.1rem;
      color: #000;
      background: linear-gradient(90deg, #00ffff 0%, #a259ff 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
      box-shadow: 0 0 16px #00ffff, 0 0 24px #a259ff99;
    }
    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 32px #00ffff, 0 0 48px #a259ffcc;
    }
    /* 平板尺寸 */
    @media (max-width: 768px) {
      .container { 
        padding: 20px; 
        margin: 20px auto;
      }
      h1 { font-size: 2rem; }
      #levelSelectArea { 
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
        gap: 15px; 
      }
      .level-card { 
        width: 100px; 
        height: 150px; 
        font-size: 0.95em; 
      }
      .grid#matchGridWrap { 
        padding: 20px 10px 15px 10px; 
        border-radius: 16px; 
      }
      .match-card { 
        width: 90px; 
        height: 130px; 
        font-size: 1em; 
        border-radius: 12px; 
      }
      #matchGrid { 
        gap: 15px; 
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
      }
    }
    
    /* 手機尺寸 */
    @media (max-width: 480px) {
      .container { 
        padding: 15px; 
        margin: 10px auto;
        width: 98%;
      }
      h1 { font-size: 1.6rem; }
      #levelSelectArea { 
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); 
        gap: 10px; 
      }
      .level-card { 
        width: 80px; 
        height: 120px; 
        font-size: 0.85em; 
      }
      .grid#matchGridWrap { 
        padding: 15px 5px 10px 5px; 
        border-radius: 12px; 
      }
      .match-card { 
        width: 70px; 
        height: 100px; 
        font-size: 0.9em; 
        border-radius: 10px; 
      }
      .back-home-btn {
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        font-size: 0.9em;
      }
      #matchGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .memory-timer {
        min-width: 200px;
        font-size: 1.1rem;
        padding: 10px 16px;
      }
      .memory-timer .timer-number {
        font-size: 1.5rem;
      }
    }
    
    /* 小手機尺寸 */
    @media (max-width: 360px) {
      .container { 
        padding: 10px; 
        margin: 5px auto;
      }
      h1 { font-size: 1.4rem; }
      #levelSelectArea { 
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); 
        gap: 8px; 
      }
      .level-card { 
        width: 70px; 
        height: 105px; 
        font-size: 0.8em; 
      }
      .grid#matchGridWrap { 
        padding: 10px 3px 8px 3px; 
        border-radius: 10px; 
      }
      .match-card { 
        width: 60px; 
        height: 85px; 
        font-size: 0.8em; 
        border-radius: 8px; 
      }
      #matchGrid { 
        gap: 8px; 
        grid-template-columns: repeat(2, minmax(0, 1fr)); 
      }
      .back-home-btn {
        top: 8px;
        right: 8px;
        padding: 6px 12px;
        font-size: 0.8em;
      }
      .btn {
        padding: 10px 18px;
        font-size: 0.95rem;
      }
      .review-word-list {
        gap: 8px 16px !important;
      }
    }
    
    /* 手機版優化 */
    @media (max-width: 600px) {
      #matchGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .match-card {
        width: 100%;
        height: 150px;
      }
    }
    
    /* 複習區域響應式設計 */
    .review-word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 32px;
      margin: 24px 0 18px 0;
    }
    
    @media (max-width: 768px) {
      .review-word-list {
        gap: 12px 24px !important;
      }
    }
    
    @media (max-width: 480px) {
      .review-word-list {
        gap: 10px 16px !important;
      }
    }
    .level-progress-bar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg,#181818,#0a0a0a);
      border-radius: 16px;
      box-shadow: 0 0 16px #00ffff44, 0 0 32px #a259ff22 inset;
      border: 2px solid #00ffff;
      position: relative;
    }
    .level-progress-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 16px;
      background: radial-gradient(circle at 60% 30%, #00ffff33 0%, #000 100%);
      z-index: 0;
    }
    .level-progress-label {
      position: relative;
      z-index: 1;
      color: #00ffff;
      font-size: 1.2em;
      font-weight: bold;
      text-shadow: 0 0 8px #00ffff, 0 0 16px #a259ff;
      letter-spacing: 2px;
      margin-top: 12px;
    }
    .level-progress-zh {
      position: relative;
      z-index: 1;
      color: #ffd700;
      font-size: 1.1em;
      font-family: 'Microsoft JhengHei', 'Noto Sans TC', 'PingFang TC', 'Heiti TC', sans-serif;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #ffd700, 0 0 16px #fff2;
    }

    /* 標題與文字版面美化 */
    h1, h2, h3 {
      font-family: 'Orbitron', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      margin: 0 auto 20px;
      line-height: 1.3;
    }
    h1 {
      font-size: 2.6rem;
      color: #fff;
      text-shadow: 0 0 12px #00ffff, 0 0 24px #a259ff, 0 0 36px #00ffff44;
    }
    h2 {
      font-size: 1.9rem;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700, 0 0 20px #fff2;
      margin-top: 28px;
    }
    h3 {
      font-size: 1.5rem;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 16px #a259ff;
      margin-top: 18px;
    }
    `;
    document.head.appendChild(style);

    // 初始化新功能
    setupDifficultySelection();
    setupHintButton();

    showLevelSelect();
    // 延遲一點時間再初始化語音，確保 SoundSystem 已載入
    setTimeout(initializeSpeechSynthesis, 100);
