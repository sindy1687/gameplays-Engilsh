<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="js/stars.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 拉霸機遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .slot-machine-container {
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #ffd700;
            position: relative;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .slot-machine-container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            border-radius: 25px;
            z-index: -1;
            animation: borderGlow 2s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .machine-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .machine-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .machine-subtitle {
            font-size: 1.2em;
            color: #ccc;
            opacity: 0.8;
        }

        .slot-display {
            background: #000;
            border: 5px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .slot-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: slotShine 3s ease-in-out infinite;
        }

        @keyframes slotShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .slot-reels {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            height: 200px;
        }

        .slot-reel {
            flex: 1;
            background: linear-gradient(180deg, #333, #000);
            border: 3px solid #555;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease-out;
            position: relative;
        }

        .reel-item {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .reel-item img {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .reel-item.symbol {
            font-size: 3em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .controls {
            text-align: center;
            margin: 30px 0;
        }

        .spin-button {
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            font-weight: bold;
            color: #000;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .bet-multipliers {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bet-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .bet-btn:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .all-in-button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #ff4757, #ff3742);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }

        .all-in-button:hover {
            background: linear-gradient(135deg, #ff3742, #ff4757);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
        }

        .normal-spin-button {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .normal-spin-button:hover {
            background: linear-gradient(135deg, #1e90ff, #2ed573);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
        }

        /* 大獎彈窗樣式 - 美化版 */
        .jackpot-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.9), rgba(255, 237, 78, 0.9));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(15px);
            animation: modalFadeIn 0.6s ease-out;
        }

        .jackpot-content {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border: 4px solid #ffd700;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 
                0 25px 80px rgba(255, 215, 0, 0.4),
                0 0 0 20px rgba(255, 215, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            animation: jackpotBounce 1.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        .jackpot-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        .jackpot-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b35, #f7931e, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
        }

        .jackpot-amount {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4757, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 25px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .jackpot-symbol {
            font-size: 5rem;
            margin: 25px 0;
            animation: symbolGlow 1.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            position: relative;
            z-index: 2;
        }

        .jackpot-message {
            font-size: 1.3rem;
            color: #2f3542;
            margin: 25px 0;
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }

        .jackpot-close {
            background: linear-gradient(135deg, #ff6b35, #ff4757);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .jackpot-close:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 107, 53, 0.5);
        }

        .jackpot-close:active {
            transform: translateY(-1px);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes jackpotBounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes symbolGlow {
            0% { 
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.5);
                transform: scale(1.1);
            }
            100% { 
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .spin-button:hover::before {
            left: 100%;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }

        .spin-button:active {
            transform: translateY(0);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-label {
            font-size: 0.9em;
            color: #ccc;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
        }

        .result-display {
            text-align: center;
            margin: 15px 0;
            min-height: 50px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .result-text {
            font-size: 1.1em;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            animation: resultPulse 0.5s ease-in-out;
            margin: 0;
        }

        .result-text.win {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .result-text.lose {
            background: linear-gradient(145deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);
        }

        @keyframes resultPulse {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .jackpot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: jackpotGlow 0.5s ease-in-out infinite alternate;
            z-index: 100;
        }

        @keyframes jackpotGlow {
            0% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { text-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 0 70px rgba(255, 215, 0, 0.5); }
        }

        .coin-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #ffd700;
        }

        .coin-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .star-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #ffd700;
        }

        .star-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .exchange-button {
            background: linear-gradient(145deg, #a259ff, #7c3aed);
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(162, 89, 255, 0.3);
        }

        .exchange-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(162, 89, 255, 0.4);
        }

        @media (max-width: 768px) {
            .slot-machine-container {
                margin: 20px;
                padding: 20px;
            }

            .machine-title {
                font-size: 2em;
            }

            .slot-reels {
                height: 150px;
            }

            .reel-item {
                height: 150px;
            }

            .spin-button {
                padding: 12px 30px;
                font-size: 1.2em;
            }
        }

        .win-animation {
            animation: winShake 0.5s ease-in-out;
        }

        @keyframes winShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 兌換商城樣式 - 手機銀行風格 */
        .exchange-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        .exchange-content {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border-radius: 25px;
            padding: 0;
            max-width: 450px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 2px solid #ffd700;
        }

        .bank-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 30px 20px;
            border-radius: 25px 25px 0 0;
            text-align: center;
            position: relative;
            border-bottom: 3px solid #ffd700;
        }

        .bank-header::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            background: rgba(255, 215, 0, 0.5);
            border-radius: 2px;
        }

        .exchange-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 0;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .bank-balance {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .balance-title {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
            font-family: 'Arial', monospace;
        }

        .balance-label {
            font-size: 0.85rem;
            color: #6c757d;
            text-align: center;
            font-weight: 500;
        }

        .bank-section {
            padding: 0 20px 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .bank-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .bank-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 18px 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            position: relative;
            overflow: hidden;
        }

        .bank-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .bank-btn:hover::before {
            left: 100%;
        }

        .bank-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }

        .bank-btn:active {
            transform: translateY(0);
        }

        .bank-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .bank-close {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px;
            width: calc(100% - 40px);
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .bank-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
        }

        .bank-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #dee2e6, transparent);
            margin: 20px 0;
        }

        .no-coins-hint {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .symbol-guide {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        .symbol-guide h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .symbol-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .symbol-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .symbol-item:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .symbol-item .symbol {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .symbol-item .reward {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .symbol-item .description {
            color: #cccccc;
            font-size: 0.9rem;
            text-align: right;
        }

        .help-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .help-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .help-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        .help-content {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border: 3px solid #667eea;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;

            height: 8px;

            appearance: none;
            cursor: pointer;

            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;

        }

            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: 2px solid #fff;

        }

            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);

                return this.coins;
            }

            addCoins(amount) {
                this.coins += amount;
                this.saveCoins();
                this.updateDisplay();
            }

            useCoins(amount) {

            const strips = ['strip1', 'strip2', 'strip3'];
            
            console.log('🎰 開始生成轉輪條...');
            
            strips.forEach((stripId, reelIndex) => {
                const strip = document.getElementById(stripId);
                if (!strip) {
                    console.error(`❌ 找不到轉輪元素: ${stripId}`);
                    return;
                }
                
                strip.innerHTML = '';
                console.log(`🎰 生成轉輪 ${reelIndex + 1} (${stripId})`);
                
                // 為每個轉輪生成20個符號，確保包含所有可能的符號
                const allSymbols = Object.keys(symbolWeights);
                const symbolsForReel = [];
                
                // 確保每個轉輪都包含所有符號
                for (let i = 0; i < 20; i++) {
                    if (i < allSymbols.length) {
                        // 前幾個位置放置所有不同的符號
                        symbolsForReel.push(allSymbols[i]);
                    } else {
                        // 其餘位置隨機選擇
                        symbolsForReel.push(getRandomSymbol());
                    }
                }
                
                // 打亂符號順序
                for (let i = symbolsForReel.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [symbolsForReel[i], symbolsForReel[j]] = [symbolsForReel[j], symbolsForReel[i]];
                }
                
                // 創建轉輪項目
                symbolsForReel.forEach((symbol, index) => {
                    const item = document.createElement('div');
                    item.className = 'reel-item symbol';
                    
                    // 檢查是否有對應的圖片
                    if (symbolImages[symbol] && symbolImages[symbol].startsWith('http')) {
                        // 使用圖片
                        const img = document.createElement('img');
                        img.src = symbolImages[symbol];
                        img.alt = symbol;
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '8px';
                        item.appendChild(img);
                    } else {
                        // 使用 emoji（備用方案）
                        item.textContent = symbol;
                    }
                    
                    strip.appendChild(item);
                });
                
                console.log(`✅ 轉輪 ${reelIndex + 1} 生成完成，共 ${strip.children.length} 個項目`);
                console.log(`📊 轉輪 ${reelIndex + 1} 符號分布:`, symbolsForReel);
            });
            
            console.log('🎰 所有轉輪條生成完成');
        }

        // 取得隨機符號
        function getRandomSymbol() {
            const totalWeight = Object.values(symbolWeights).reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            
            for (const [symbol, weight] of Object.entries(symbolWeights)) {
                random -= weight;
                if (random <= 0) {
                    return symbol;
                }
            }
            
            return symbols[0]; // 預設值
        }

                soundSystem.playWinSound();

                const baseMultiplier = rewards[symbol] || 2;
                // 獎勵基於實際下注的金幣數量，並應用獎勵倍數
                const betAmount = gameState.currentBet;
                let winAmount;
                
                if (gameState.isNormalBet) {
                    // 一般下注：獎勵 = 下注金額 × 符號倍數
                    winAmount = betAmount * baseMultiplier;

                    // 賭上所有金幣：獎勵 = 下注金額 × 符號倍數
                    winAmount = betAmount * baseMultiplier;

                coinSystem.addCoins(winAmount);
                gameState.streak++;
                gameState.totalWins++;

                if (gameState.streak > gameState.maxStreak) {
                    gameState.maxStreak = gameState.streak;

            // 統一兌換處理函式
            function handleBankExchange(productId) {
                // 防止重複提交
                if (isExchangeProcessing) {
                    alert('正在處理兌換中，請稍候...');
                    return;
                }
                
                // 取得商品資料
                const product = EXCHANGE_PRODUCTS[productId];
                if (!product) {
                    alert('商品資料錯誤');
                    return;
                }
                
                // 重新讀取最新餘額
                const currentStars = starSystem ? starSystem.getStars() : 0;
                const currentCoins = coinSystem ? coinSystem.getCoins() : 0;
                
                // 驗證餘額
                if (product.currency === 'stars' && currentStars < product.cost) {
                    const missingStars = product.cost - currentStars;
                    alert(`星星不足！還需要 ${missingStars} 顆星星才能兌換。`);
                    return;
                }
                
                if (product.currency === 'coins' && currentCoins < product.cost) {
                    const missingCoins = product.cost - currentCoins;
                    alert(`金幣不足！還需要 ${missingCoins.toLocaleString()} 金幣才能兌換。`);
                    return;
                }
                
                // 顯示確認視窗
                const confirmed = confirm(
                    `兌換確認\n\n` +
                    `商品：${product.name}\n` +
                    `支付：${product.currency === 'stars' ? '⭐' + product.cost : '🪙' + product.cost.toLocaleString()}\n` +
                    `獲得：${product.rewardCurrency === 'stars' ? '⭐' : '🪙'}${product.reward.toLocaleString()}\n\n` +
                    `目前餘額：\n` +
                    `⭐ ${currentStars.toLocaleString()}\n` +
                    `🪙 ${currentCoins.toLocaleString()}\n\n` +
                    `確定要兌換嗎？`
                );
                
                if (!confirmed) {
                    return;
                }
                
                // 鎖定處理
                isExchangeProcessing = true;
                
                try {
                    // 再次讀取最新餘額
                    const latestStars = starSystem ? starSystem.getStars() : 0;
                    const latestCoins = coinSystem ? coinSystem.getCoins() : 0;
                    
                    // 再次驗證餘額
                    if (product.currency === 'stars' && latestStars < product.cost) {
                        alert('星星不足，兌換取消');
                        return;
                    }
                    
                    if (product.currency === 'coins' && latestCoins < product.cost) {
                        alert('金幣不足，兌換取消');
                        return;
                    }
                    
                    // 執行兌換
                    if (product.type === 'star-to-coin') {
                        // 扣除星星
                        const deductSuccess = starSystem.useStars(product.cost);
                        if (!deductSuccess) {
                            throw new Error('扣除星星失敗');
                        }
                        
                        // 增加金幣
                        coinSystem.addCoins(product.reward);
                        
                    } else if (product.type === 'coin-to-star') {
                        // 扣除金幣
                        const deductSuccess = coinSystem.useCoins(product.cost);
                        if (!deductSuccess) {
                            throw new Error('扣除金幣失敗');
                        }
                        
                        // 增加星星
                        starSystem.addStars(product.reward);
                    }
                    
                    // 記錄交易
                    recordTransaction(product);
                    
                    // 顯示成功訊息
                    showExchangeNotification(product.reward, product.type === 'coin-to-star');
                    
                    // 更新銀行顯示
                    updateBankDisplay();
                    
                } catch (error) {
                    console.error('兌換失敗:', error);
                    alert('兌換失敗，請稍後再試');
                } finally {
                    // 解除鎖定
                    isExchangeProcessing = false;
                }
            }
            
            // 更新銀行顯示
            function updateBankDisplay() {
                if (starSystem) {
                    starSystem.loadTotalStars();
                }
                
                const starsDisplay = modal.querySelector('#bankStars');
                const coinsDisplay = modal.querySelector('#bankCoins');
                
                if (starsDisplay) {
                    starsDisplay.textContent = starSystem.getStars().toLocaleString();

                if (coinsDisplay) {
                    coinsDisplay.textContent = coinSystem.getCoins().toLocaleString();
                }
                
                console.log('⭐ 銀行顯示已更新');
            }
            
            // 記錄交易
            function recordTransaction(product) {
                try {
                    const transactions = JSON.parse(localStorage.getItem('wordSpinBankTransactions') || '[]');
                    const transaction = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 9),
                        productName: product.name,
                        type: product.type,
                        cost: product.cost,
                        reward: product.reward,
                        timestamp: new Date().toISOString(),
                        starsAfter: starSystem.getStars(),
                        coinsAfter: coinSystem.getCoins()
                    };
                    
                    transactions.unshift(transaction);
                    
                    // 只保留最近20筆
                    if (transactions.length > 20) {
                        transactions.pop();
                    }
                    
                    localStorage.setItem('wordSpinBankTransactions', JSON.stringify(transactions));
                    console.log('💳 交易已記錄:', transaction);
                } catch (error) {
                    console.error('記錄交易失敗:', error);
                }
            }

                }

        // 自動轉動功能
        function startAutoSpin() {
            const spinCount = parseInt(document.getElementById('autoSpinCountSlider').value);
            const spinInterval = parseFloat(document.getElementById('autoSpinIntervalSlider').value);
            
            if (spinCount < 1 || spinCount > 100) {
                alert('轉動次數必須在1-100之間！');
                return;
            }
            
            if (spinInterval < 10 || spinInterval > 60) {
                alert('間隔時間必須在10-60秒之間！');
                return;
            }
            
            // 檢查金幣是否足夠
            const betCost = 5000 * gameState.betMultiplier;
            const totalCost = betCost * spinCount;
            const currentCoins = coinSystem.getCoins();
            
            if (currentCoins < totalCost) {
                alert(`金幣不足！需要${totalCost.toLocaleString()}🪙，當前只有${currentCoins.toLocaleString()}🪙`);
                return;
            }
            
            // 開始自動轉動
            gameState.autoSpin.isActive = true;
            gameState.autoSpin.count = 0;
            gameState.autoSpin.totalCount = spinCount;
            gameState.autoSpin.wins = 0;
            gameState.autoSpin.losses = 0;
            
            // 更新UI
            document.getElementById('startAutoSpinBtn').style.display = 'none';
            document.getElementById('stopAutoSpinBtn').style.display = 'inline-block';
            document.getElementById('autoSpinStatus').classList.add('running');
            
            // 禁用手動按鈕
            document.getElementById('allInButton').disabled = true;
            document.getElementById('normalSpinButton').disabled = true;
            
            // 開始第一次轉動
            performAutoSpin();
            
            // 設定間隔
            gameState.autoSpin.interval = setInterval(() => {
                if (gameState.autoSpin.isActive && gameState.autoSpin.count < gameState.autoSpin.totalCount && !gameState.autoSpin.isPaused) {
                    performAutoSpin();
                } else if (gameState.autoSpin.count >= gameState.autoSpin.totalCount) {
                    stopAutoSpin();
                }
            }, spinInterval * 1000);
            
            console.log(`🤖 開始自動轉動：${spinCount}次，間隔${spinInterval}秒`);
        }
        
        function stopAutoSpin() {
            if (gameState.autoSpin.interval) {
                clearInterval(gameState.autoSpin.interval);
                gameState.autoSpin.interval = null;
            }
            
            gameState.autoSpin.isActive = false;
            
            // 更新UI
            document.getElementById('startAutoSpinBtn').style.display = 'inline-block';
            document.getElementById('stopAutoSpinBtn').style.display = 'none';
            document.getElementById('autoSpinStatus').classList.remove('running');
            
            // 啟用手動按鈕
            document.getElementById('allInButton').disabled = false;
            document.getElementById('normalSpinButton').disabled = false;
            
            // 顯示結果
            const winRate = gameState.autoSpin.totalCount > 0 ? 
                Math.round((gameState.autoSpin.wins / gameState.autoSpin.totalCount) * 100) : 0;
            
            showResult(`🤖 自動轉動完成！獲勝：${gameState.autoSpin.wins}次，失敗：${gameState.autoSpin.losses}次，獲勝率：${winRate}%`, 'win');
            
            console.log(`🤖 自動轉動停止：完成${gameState.autoSpin.count}次，獲勝${gameState.autoSpin.wins}次`);
        }
        
        function performAutoSpin() {
            if (!gameState.autoSpin.isActive || gameState.isSpinning || gameState.autoSpin.isPaused) {
                return;
            }
            
            gameState.autoSpin.count++;
            
            // 更新進度顯示
            const progress = document.getElementById('autoSpinProgress');
            const winRate = gameState.autoSpin.count > 0 ? 
                Math.round((gameState.autoSpin.wins / gameState.autoSpin.count) * 100) : 0;
            progress.textContent = `進行中 ${gameState.autoSpin.count}/${gameState.autoSpin.totalCount} (獲勝率: ${winRate}%)`;
            
            // 播放轉動音效（如果啟用）
            const soundEnabled = document.getElementById('autoSpinSound').checked;
            if (soundEnabled) {
                soundSystem.playSpinSound();
            }
            
            // 執行轉動
            const betCost = 5000 * gameState.betMultiplier;
            
            if (!coinSystem.useCoins(betCost)) {
                stopAutoSpin();
                showResult('🤖 自動轉動停止：金幣不足！', 'lose');
                return;
            }
            
            gameState.isSpinning = true;
            gameState.totalGames++;
            gameState.currentBet = betCost;
            gameState.isNormalBet = true;
            
            // 重新生成轉輪條
            regenerateReelStrips();
            
            // 計算獲勝機率（自動轉動降低機率）
            let winChance = 0.30; // 基礎機率30%
            
            // 連續獲勝加成（降低加成）
            if (gameState.streak >= 1) winChance += 0.02; // 從3%降低到2%
            if (gameState.streak >= 2) winChance += 0.03; // 從5%降低到3%
            if (gameState.streak >= 3) winChance += 0.05; // 從7%降低到5%
            if (gameState.streak >= 5) winChance += 0.07; // 從10%降低到7%
            
            // 倍數調整（更嚴格的調整）
            if (gameState.betMultiplier >= 10) {
                winChance = Math.max(0.15, winChance - 0.20); // 最低15%
            } else if (gameState.betMultiplier >= 6) {
                winChance = Math.max(0.20, winChance - 0.15); // 最低20%
            } else if (gameState.betMultiplier >= 4) {
                winChance = Math.max(0.25, winChance - 0.10); // 最低25%
            } else if (gameState.betMultiplier >= 2) {
                winChance = Math.max(0.30, winChance - 0.05); // 最低30%
            }
            
            const shouldWin = Math.random() < winChance;
            let resultSymbols = [];
            
            if (shouldWin) {
                const winningSymbol = getRandomSymbol();
                resultSymbols = [winningSymbol, winningSymbol, winningSymbol];
            } else {
                const symbols = Object.keys(symbolWeights);
                resultSymbols = [
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)]
                ];
                
                while (resultSymbols[0] === resultSymbols[1] && resultSymbols[1] === resultSymbols[2]) {
                    resultSymbols[2] = symbols[Math.floor(Math.random() * symbols.length)];
                }
            }
            
            // 執行動畫
            setTimeout(() => {
                animateSpin(resultSymbols);
                
                // 動畫完成後檢查結果
                setTimeout(() => {
                    checkAutoSpinResult(resultSymbols);
                }, 2000 + 400);
            }, 100);
        }
        
        function checkAutoSpinResult(symbols) {
            const isWin = symbols[0] === symbols[1] && symbols[1] === symbols[2];
            
            if (isWin) {
                // 播放獲勝音效（如果啟用）
                // const soundEnabled = document.getElementById('autoSpinSound').checked;
                // if (soundEnabled) {
                //     soundSystem.playWinSound();
                // }
                
                gameState.autoSpin.wins++;
                const symbol = symbols[0];
                const baseMultiplier = rewards[symbol] || 2;
                const betAmount = gameState.currentBet;
                const winAmount = betAmount * baseMultiplier;
                
                coinSystem.addCoins(winAmount);
                gameState.streak++;
                gameState.totalWins++;
                
                // 更新最高連勝記錄
                if (gameState.streak > gameState.maxStreak) {
                    gameState.maxStreak = gameState.streak;
                }
                
                // 判斷是否為大獎（獎勵超過300000）
                const isJackpot = winAmount >= 300000;
                
                if (isJackpot) {
                    showJackpotModal(symbol, winAmount, baseMultiplier);
                }
                
                // 連續獲勝獎勵
                if (gameState.streak >= 2) {
                    const bonus = Math.floor(winAmount * 0.15);
                    coinSystem.addCoins(bonus);
                } else if (gameState.streak >= 3) {
                    const bonus = Math.floor(winAmount * 0.25);
                    coinSystem.addCoins(bonus);
                } else if (gameState.streak >= 4) {
                    const bonus = Math.floor(winAmount * 0.35);
                    coinSystem.addCoins(bonus);
                } else if (gameState.streak >= 5) {
                    const bonus = Math.floor(winAmount * 0.50);
                    coinSystem.addCoins(bonus);
                } else if (gameState.streak >= 7) {
                    const bonus = Math.floor(winAmount * 0.75);
                    coinSystem.addCoins(bonus);
                } else if (gameState.streak >= 10) {
                    const bonus = Math.floor(winAmount * 1.0);
                    coinSystem.addCoins(bonus);
                }
                
            } else {
                gameState.autoSpin.losses++;
                gameState.streak = 0;
            }
            
            // 重置遊戲狀態
            gameState.isSpinning = false;
            
            // 更新顯示
            updateDisplay();
            saveGameData();
            
            // 檢查是否繼續自動轉動
            if (gameState.autoSpin.isActive && gameState.autoSpin.count < gameState.autoSpin.totalCount) {
                // 繼續下一次轉動
                setTimeout(() => {
                    performAutoSpin();
                }, 500); // 短暫延遲
            } else if (gameState.autoSpin.count >= gameState.autoSpin.totalCount) {
                stopAutoSpin();
            }
        }

        // 頁面載入時初始化
        window.addEventListener('load', initGame);
        
        // 頁面關閉時停止自動轉動
        window.addEventListener('beforeunload', function() {
            if (gameState.autoSpin.isActive) {
                stopAutoSpin();
            }
        });
        
        // 頁面失去焦點時暫停自動轉動（可選）
        window.addEventListener('blur', function() {
            if (gameState.autoSpin.isActive) {
                console.log('🤖 頁面失去焦點，自動轉動繼續進行中...');
            }
        });
        
        // 測試轉動功能
        function testSpin() {
            console.log('🧪 測試轉動功能...');
            console.log('🎰 當前遊戲狀態:', gameState);
            console.log('🪙 當前金幣:', coinSystem ? coinSystem.getCoins() : 'N/A');
            console.log('⭐ 當前星星:', starSystem ? starSystem.getStars() : 'N/A');
            
            // 檢查轉輪元素
            const strips = ['strip1', 'strip2', 'strip3'];
            strips.forEach((stripId, index) => {
                const strip = document.getElementById(stripId);
                if (strip) {
                    console.log(`✅ 轉輪 ${index + 1} (${stripId}) 存在，項目數量: ${strip.children.length}`);
                    
                    // 檢查轉輪內容
                    const items = strip.querySelectorAll('.reel-item');
                    console.log(`📊 轉輪 ${index + 1} 內容:`, Array.from(items).map(item => {
                        const img = item.querySelector('img');
                        return img ? `圖片(${img.src.substring(0, 50)}...)` : item.textContent;
                    }));
                } else {
                    console.error(`❌ 轉輪 ${index + 1} (${stripId}) 不存在`);
                }
            });
            
            // 嘗試轉動
            if (!gameState.isSpinning) {
                console.log('🎰 開始測試轉動...');
                spin();
            } else {
                console.log('⚠️ 遊戲正在轉動中，無法測試');
            }
        }
        
        // 測試轉輪動畫
        function testReelAnimation() {
            console.log('🎬 測試轉輪動畫...');
            
            const strips = ['strip1', 'strip2', 'strip3'];
            strips.forEach((stripId, index) => {
                const strip = document.getElementById(stripId);
                if (strip) {
                    console.log(`🎯 測試轉輪 ${index + 1} (${stripId})`);
                    
                    // 簡單的上下移動測試
                    strip.style.transition = 'transform 1s ease-in-out';
                    strip.style.transform = 'translateY(-200px)';
                    
                    setTimeout(() => {
                        strip.style.transform = 'translateY(0)';
                        console.log(`✅ 轉輪 ${index + 1} 動畫測試完成`);
                    }, 1000);
                }
            });
        }
        
        // 強制轉動測試
        function forceSpin() {
            console.log('🎰 強制轉動測試...');
            
            const strips = ['strip1', 'strip2', 'strip3'];
            const spinDuration = 2000;
            
            strips.forEach((stripId, index) => {
                const strip = document.getElementById(stripId);
                if (strip) {
                    console.log(`🎯 強制轉動轉輪 ${index + 1} (${stripId})`);
                    
                    // 重置位置
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateY(0)';
                    strip.offsetHeight; // 強制重繪
                    
                    // 開始動畫
                    setTimeout(() => {
                        strip.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                        strip.style.transform = `translateY(-${(index + 1) * 200}px)`;
                        console.log(`✅ 轉輪 ${index + 1} 強制轉動已啟動`);
                    }, index * 200);
                } else {
                    console.error(`❌ 找不到轉輪: ${stripId}`);
                }
            });
            
            // 重置按鈕
            setTimeout(() => {
                const spinButton = document.getElementById('spinButton');
                if (spinButton) {
                    spinButton.disabled = false;
                    spinButton.textContent = '🎰 SPIN! (100🪙)';
                }
                gameState.isSpinning = false;
                console.log('🎰 強制轉動測試完成');
            }, spinDuration + 1000);
        }
        
        // 將測試函數暴露到全局
        window.testSpin = testSpin;
        window.testReelAnimation = testReelAnimation;
        window.forceSpin = forceSpin;
    </script>
</body>
</html>
