<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="js/stars.js"></script>
  <meta charset="UTF-8" />
  <title>英打小英雄 - 星座挑戰</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="responsive_enhanced.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="js/playerProgress.js"></script>
  <style>
    html { overflow-x: hidden; }
    * { box-sizing: border-box; max-width: 100%; }

    body {
      margin: 0;
      padding: 24px 14px;
      overflow: auto;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 18%, rgba(0, 255, 255, 0.16), transparent 28%),
        radial-gradient(circle at 82% 76%, rgba(162, 89, 255, 0.18), transparent 34%),
        linear-gradient(145deg, #020111 0%, #06112b 46%, #000010 100%);
      width: 100%;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, #000 0%, transparent 78%);
      z-index: 0;
    }

    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    #container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      min-height: min(820px, calc(100vh - 48px));
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 34px) 26px;
      background:
        linear-gradient(145deg, rgba(10, 18, 42, .88), rgba(7, 12, 31, .94)),
        radial-gradient(circle at 50% 0%, rgba(0, 255, 255, .14), transparent 44%);
      border: 1px solid rgba(0, 255, 255, .24);
      border-radius: 28px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 28px 80px rgba(0,0,0,.48),
        0 0 54px rgba(0,255,255,.18),
        0 0 110px rgba(162,89,255,.16) inset;
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    #container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,.07) 46%, transparent 58%),
        radial-gradient(circle at 100% 0%, rgba(162,89,255,.22), transparent 28%);
      opacity: .85;
    }

    #container > * {
      position: relative;
      z-index: 1;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg,#00ffff 0%,#a259ff 100%);
      color:#000;
      font-weight:bold;
      padding:13px 22px;
      border-radius:13px;
      box-shadow:0 0 22px rgba(0,255,255,.65), 0 10px 24px rgba(0,0,0,.28);
      text-decoration:none;
      z-index:2;
      transition:transform .2s, box-shadow .2s;
      font-family:'Orbitron',sans-serif;
      width: fit-content;
    }
    .home-btn:hover {
      transform:scale(1.1);
      box-shadow:0 0 32px #00ffff;
    }

    #totalStars, #lives {
      position: absolute;
      bottom: 28px;
      padding: 13px 20px;
      border-radius: 13px;
      box-shadow: 0 0 18px rgba(255,215,0,.42), 0 0 36px rgba(0,255,255,.34);
      border: 2px solid #00ffff;
      color: #ffd700;
      font-size: 1.08rem;
      font-weight: bold;
      z-index: 2;
      font-family: 'Orbitron', sans-serif;
      background: rgba(6,13,32,0.88);
      min-width: 220px;
      text-align: center;
    }
    #totalStars { left: 28px; }
    #lives { right: 28px; color: #ffd700; letter-spacing: 3px; }

    #audioControls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      display: flex;
      gap: 10px;
    }

    #toggleMusic {
      background: rgba(10,20,40,0.85);
      border: 2px solid #00ffff;
      color: #00ffff;
      border-radius: 50%;
      width: 50px; height: 50px;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: all .3s ease;
      backdrop-filter: blur(10px);
      box-shadow:0 0 16px #00ffff;
    }
    #toggleMusic:hover {
      background: rgba(0,255,255,0.2);
      transform:scale(1.1);
      box-shadow:0 0 24px #00ffff;
    }

    h1 {
      margin:42px auto 18px;
      font-size:clamp(2rem, 7vw, 3.1rem);
      letter-spacing:1px;
      color:#00ffff;
      text-shadow:0 0 14px #00ffff, 0 0 34px #a259ff;
      text-align:center;
      line-height: 1.18;
    }

    #questionCount {
      width: fit-content;
      margin:12px auto 20px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size:clamp(1rem, 3.6vw, 1.28rem);
      color:#a0a0ff;
      text-align:center;
      text-shadow:0 0 6px #00ffff;
      background: rgba(0,255,255,.07);
      border: 1px solid rgba(0,255,255,.18);
    }

    #wordDisplay {
      width: min(100%, 520px);
      margin:22px auto 20px;
      padding: 18px 18px;
      min-height: 100px;
      display: grid;
      place-items: center;
      font-size:clamp(2.6rem, 10vw, 4.2rem);
      font-weight:bold;
      color:#ffd700;
      text-shadow:0 0 8px #ffd700;
      animation:glow 2s ease-in-out infinite alternate;
      text-align:center;
      border-radius: 22px;
      background:
        radial-gradient(circle at center, rgba(255,215,0,.10), transparent 62%),
        rgba(0,0,0,.14);
      border: 1px solid rgba(255,215,0,.12);
    }
    @keyframes glow {
      from { text-shadow:0 0 8px #ffd700; }
      to { text-shadow:0 0 16px #ffd700, 0 0 32px #00ffff; }
    }

    #timerDisplay {
      width: fit-content;
      font-size:1.22rem;
      color:#00ffff;
      margin:0 auto 18px;
      padding: 8px 16px;
      border-radius: 999px;
      text-align:center;
      text-shadow:0 0 6px #00ffff;
      background: rgba(0,255,255,.06);
    }
    #timerDisplay.danger { animation: flash 1s infinite; }
    @keyframes flash {
      0%,100% { color:#00ffff; }
      50% { color:#ff4444; }
    }

    #answerInput {
      font-family:'Roboto Mono',monospace;
      font-size:1.25rem;
      padding:18px 22px;
      border-radius:18px;
      border:2px solid #00ffff;
      width:min(100%, 520px);
      max-width:520px;
      background:rgba(6,13,32,0.82);
      color:#fff;
      box-shadow:0 0 18px rgba(0,255,255,.45), 0 0 54px rgba(0,255,255,.15);
      text-align:center;
      outline:none;
      margin:0 auto 22px;
      display:block;
    }
    #answerInput:focus {
      border-color:#00ffff;
      box-shadow:0 0 32px #00ffff;
    }

    #feedback {
      height:30px;
      font-size:1.1rem;
      font-weight:bold;
      margin:12px 0;
      text-align:center;
      color:#ffd700;
      text-shadow:0 0 6px #00ffff;
    }

    .btn-row {
      display:flex;
      justify-content:center;
      gap:14px 16px;
      flex-wrap:wrap;
      margin-top:14px;
      margin-bottom:116px;
    }

    .btn-row button {
      font-family:'Orbitron',sans-serif;
      font-size:1.02rem;
      padding:16px 28px;
      min-width:112px;
      border-radius:16px;
      border:none;
      cursor:pointer;
      background:linear-gradient(90deg,#00ffff 0%,#a259ff 100%);
      color:#000;
      font-weight:bold;
      box-shadow:0 0 18px rgba(0,255,255,.65), 0 12px 26px rgba(0,0,0,.34);
      transition:transform .2s, box-shadow .2s;
    }
    .btn-row button:hover {
      transform:scale(1.08);
      box-shadow:0 0 32px #00ffff, 0 0 48px #a259ffcc;
    }

    #speakBtn {
      background:linear-gradient(90deg,#ffd700 0%,#ffaa00 100%);
      color:#000;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px 10px;
      }

      #container {
        min-height: calc(100vh - 28px);
        border-radius: 22px;
        padding: 22px 16px 20px;
      }

      .home-btn {
        padding: 11px 16px;
        font-size: .95rem;
      }

      h1 {
        margin-top: 34px;
      }

      #wordDisplay {
        min-height: 86px;
        padding: 14px 12px;
      }

      #answerInput {
        font-size: 1.06rem;
        padding: 15px 16px;
      }

      .btn-row {
        gap: 12px;
        margin-bottom: 138px;
      }

      .btn-row button {
        flex: 1 1 calc(50% - 12px);
        min-width: 132px;
        padding: 14px 16px;
      }

      #totalStars,
      #lives {
        position: absolute;
        left: 16px;
        right: 16px;
        min-width: 0;
        width: auto;
        padding: 10px 12px;
        font-size: .95rem;
      }

      #totalStars {
        bottom: 76px;
      }

      #lives {
        bottom: 20px;
      }
    }

    @media (max-width: 420px) {
      .btn-row button {
        flex-basis: 100%;
      }

      .btn-row {
        margin-bottom: 150px;
      }
    }

    .modal {
      display:none;
      position:fixed;
      z-index:1000;
      left:0; top:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.85);
      align-items:flex-start;
      justify-content:center;
      overflow-y:auto;
      padding:20px;
      backdrop-filter:blur(8px);
      animation:modalFadeIn .3s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity:0; transform:scale(.9); }
      to { opacity:1; transform:scale(1); }
    }

    .modal-content {
      background:linear-gradient(135deg,rgba(10,20,40,.98),rgba(20,40,80,.95));
      padding:35px;
      border-radius:20px;
      color:#fff;
      max-width:600px;
      width:90%;
      text-align:center;
      box-shadow:0 0 40px #00ffff88, 0 0 80px #a259ff44 inset, 0 20px 40px rgba(0,0,0,.5);
      font-family:'Orbitron',sans-serif;
      margin:20px;
      border:3px solid #00ffff;
      position:relative;
      overflow-y:auto;
      max-height:80vh;
      animation:modalSlideIn .4s cubic-bezier(.68,-.55,.27,1.55);
    }
    @keyframes modalSlideIn {
      from { transform:translateY(-50px) scale(.9); opacity:0; }
      to   { transform:translateY(0) scale(1);   opacity:1; }
    }
    .modal-content::before {
      content:'';
      position:absolute;
      top:0; left:0; right:0;
      height:3px;
      background:linear-gradient(90deg,#00ffff,#a259ff,#ffd700,#00ffff);
      animation:borderGlow 2s linear infinite;
      background-size:200% 100%;
    }
    @keyframes borderGlow {
      0% { background-position:0% 50%; }
      100% { background-position:200% 50%; }
    }
    .modal-content h2 {
      margin-bottom:12px;
      color:#00ffff;
      text-shadow:0 0 15px #00ffff, 0 0 35px #a259ff;
      font-size:1.6rem;
      font-weight:bold;
      letter-spacing:1px;
      position:relative;
    }
    .modal-content h2::after {
      content:'';
      position:absolute;
      bottom:-8px; left:50%;
      transform:translateX(-50%);
      width:60px; height:3px;
      background:linear-gradient(90deg,#00ffff,#a259ff);
      border-radius:2px;
    }
    .modal-content p {
      margin:12px 0;
      font-size:1rem;
      color:#a0a0ff;
      line-height:1.5;
    }
    .modal-content ul {
      list-style:none;
      padding:15px;
      max-height:200px;
      overflow-y:auto;
      margin:20px 0;
      text-align:left;
      font-size:.95rem;
      font-family:'Roboto Mono',monospace;
      color:#fff;
      background:rgba(0,0,0,.3);
      border-radius:10px;
      border:1px solid rgba(0,255,255,.2);
    }
    .modal-content ul li {
      margin:8px 0;
      padding:8px 12px;
      background:linear-gradient(135deg,rgba(0,255,255,.1),rgba(162,89,255,.1));
      border-radius:8px;
      border-left:3px solid #00ffff;
      transition:all .3s ease;
    }
    .modal-content ul li:hover {
      background:linear-gradient(135deg,rgba(0,255,255,.2),rgba(162,89,255,.2));
      transform:translateX(5px);
      box-shadow:0 2px 8px rgba(0,255,255,.3);
    }

    .modal-content table {
      width:100%;
      border-collapse:collapse;
      margin:20px 0;
      background:rgba(0,0,0,.3);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,.3);
    }

    .modal-content th {
      background:linear-gradient(135deg,#00ffff22,#a259ff22);
      color:#00ffff;
      padding:12px 8px;
      font-weight:bold;
      font-size:.9rem;
      text-transform:uppercase;
      letter-spacing:1px;
      border-bottom:2px solid #00ffff;
    }

    .modal-content td {
      padding:10px 8px;
      border-bottom:1px solid rgba(0,255,255,.1);
      transition:background .3s ease;
    }
    .modal-content tr:hover td {
      background:rgba(0,255,255,.1);
    }

    .modal-content button {
      background:linear-gradient(135deg,#00ffff 0%,#a259ff 100%);
      border:none;
      padding:10px 18px;
      border-radius:20px;
      color:#000;
      font-weight:bold;
      font-size:0.95rem;
      cursor:pointer;
      margin:4px;
      transition:all .3s ease;
      box-shadow:0 4px 15px rgba(0,255,255,.3);
      font-family:'Orbitron',sans-serif;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }
    .modal-content button:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 25px rgba(0,255,255,.5);
      background:linear-gradient(135deg,#00ffff 0%,#ffd700 100%);
    }

    /* 結算畫面主要成績卡片 */
    #scoreInfo {
      padding:14px 16px;
      background:linear-gradient(135deg,rgba(0,255,255,.08),rgba(162,89,255,.08));
      border-radius:12px;
      border:1px solid rgba(0,255,255,.2);
      margin-bottom:10px;
      font-size:1.05rem;
      line-height:1.6;
    }

    /* 答題統計區 */
    .result-stats {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px 12px;
      margin-bottom:12px;
    }
    .result-stats .stat-item:nth-child(3) {
      grid-column: span 2;
    }
    .stat-item {
      padding:8px 12px;
      background:rgba(0,0,0,.25);
      border-radius:8px;
      font-size:0.9rem;
      color:#a0a0ff;
      text-align:center;
    }

    /* 功能按鈕區 */
    .result-actions {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:8px;
      margin-bottom:12px;
    }
    .result-actions button {
      margin:0;
      width:100%;
    }

    /* 星級標準卡片 */
    .star-rule-card {
      padding:10px 14px;
      background:rgba(0,0,0,.25);
      border-radius:10px;
      border:1px solid rgba(255,215,0,.15);
      margin-bottom:12px;
    }
    .star-rule-title {
      color:#ffd700;
      font-weight:bold;
      font-size:0.85rem;
      margin-bottom:6px;
    }
    .star-rule-item {
      font-size:0.8rem;
      color:#ccc;
      line-height:1.5;
    }

    /* 錯題列表滾動區 */
    #wrongListAll {
      max-height:180px;
      overflow-y:auto;
      margin-bottom:10px;
    }
    #wrongListAll ul {
      margin:0;
      padding:10px;
    }

    /* 排行榜上傳狀態 */
    #uploadStatus {
      font-size:0.85rem;
      text-align:center;
      padding:8px;
      color:#00ffff;
    }

    .category-select {
      background:linear-gradient(135deg,rgba(10,20,40,.9),rgba(20,40,80,.9));
      border:2px solid #00ffff;
      color:#fff;
      padding:12px 16px;
      border-radius:25px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      transition:all .3s ease;
      font-family:'Orbitron',sans-serif;
      min-width:200px;
      outline:none;
      box-shadow:0 0 15px rgba(0,255,255,.3);
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
      background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat:no-repeat;
      background-position:right 12px center;
      background-size:16px;
      padding-right:40px;
    }
    .category-select:hover {
      border-color:#a259ff;
      box-shadow:0 0 20px rgba(0,255,255,.5);
      transform:translateY(-1px);
    }
    .category-select:focus {
      border-color:#ffd700;
      box-shadow:0 0 25px rgba(255,215,0,.5);
    }
    .category-select option {
      background:rgba(10,20,40,.95);
      color:#fff;
      padding:8px;
      font-size:.9rem;
    }

    .loading {
      text-align:center;
      padding:20px;
      color:#00ffff;
      font-size:1.1rem;
    }
    .loading::after {
      content:'';
      display:inline-block;
      width:20px; height:20px;
      border:2px solid #00ffff;
      border-radius:50%;
      border-top-color:transparent;
      animation:spin 1s linear infinite;
      margin-left:10px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .flip-card-grid {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:28px 18px;
      justify-content:center;
      margin:32px auto 0;
      max-width:600px;
    }
    .flip-card {
      background:transparent;
      width:260px; height:160px;
      perspective:1000px;
      cursor:pointer;
      margin:0 auto;
    }
    .flip-card-inner {
      position:relative;
      width:100%; height:100%;
      transition:transform .7s cubic-bezier(.4,2,.6,1);
      transform-style:preserve-3d;
    }
    .flip-card.flipped .flip-card-inner {
      transform:rotateY(180deg);
    }
    .flip-card-front,.flip-card-back {
      position:absolute;
      width:100%; height:100%;
      backface-visibility:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:2rem;
      border-radius:18px;
      box-shadow:0 0 24px #00ffff44, 0 0 48px #a259ff22 inset;
      background:linear-gradient(135deg,#181818 60%,#00ffff22 100%);
      color:#00ffff;
      border:2px solid #00ffff;
      user-select:none;
    }
    .flip-card-back {
      background:linear-gradient(135deg,#ffd700 60%,#a259ff22 100%);
      color:#a259ff;
      transform:rotateY(180deg);
      font-size:2.2rem;
      font-weight:bold;
      text-shadow:0 0 12px #ffd700,0 0 32px #a259ff;
    }

    .practice-next-btn {
      display:block;
      margin:28px auto 0;
      font-size:1.1rem;
      padding:10px 32px;
      border-radius:10px;
      background:linear-gradient(90deg,#00ffff 0%,#a259ff 100%);
      color:#000;
      font-weight:bold;
      box-shadow:0 0 12px #00ffff;
      border:none;
      cursor:pointer;
      transition:transform .2s, box-shadow .2s;
    }
    .practice-next-btn:hover {
      transform:scale(1.08);
      box-shadow:0 0 32px #00ffff, 0 0 48px #a259ffcc;
    }

    .modal-content::-webkit-scrollbar,
    .leaderboard-scroll-container::-webkit-scrollbar {
      width:8px;
    }
    .modal-content::-webkit-scrollbar-track,
    .leaderboard-scroll-container::-webkit-scrollbar-track {
      background:rgba(0,255,255,.1);
      border-radius:4px;
    }
    .modal-content::-webkit-scrollbar-thumb,
    .leaderboard-scroll-container::-webkit-scrollbar-thumb {
      background:linear-gradient(135deg,#00ffff,#a259ff);
      border-radius:4px;
      border:1px solid rgba(0,255,255,.3);
    }
    .modal-content::-webkit-scrollbar-thumb:hover,
    .leaderboard-scroll-container::-webkit-scrollbar-thumb:hover {
      background:linear-gradient(135deg,#00ffff,#ffd700);
      box-shadow:0 0 8px rgba(0,255,255,.5);
    }
    .modal-content {
      scrollbar-width:thin;
      scrollbar-color:#00ffff rgba(0,255,255,.2);
    }
    .leaderboard-scroll-container {
      scrollbar-width:thin;
      scrollbar-color:#00ffff rgba(0,255,255,.2);
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div id="container">
    <a href="atlas.html" class="home-btn">← 返回首頁</a>
    <div id="totalStars">總星星：<span id="totalStarCount">0</span> ⭐</div>
    <div id="lives">❤️❤️❤️❤️❤️</div>

    <h1>🧠 星座挑戰：<span id="categoryName"></span></h1>
    <div id="questionCount">第 <span id="currentQuestion">0</span> 題 / <span id="totalQuestionCount">20</span> 題</div>
    <div id="wordDisplay">準備中...</div>
    <div id="timerDisplay">⏱ 時間：<span id="timeLeft">30</span> 秒</div>
    <input type="text" id="answerInput" placeholder="請輸入英文..." autocomplete="off" />
    <div id="feedback"></div>

    <div class="btn-row">
      <button onclick="checkAnswer()">送出</button>
      <button onclick="nextWord()">跳過</button>

  <script>
    // 星空背景
    const starCanvas = document.getElementById('starfield');
    const ctx = starCanvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    starCanvas.width = width;
    starCanvas.height = height;
    const starsBg = [];
    function initStars() {
      starsBg.length = 0;
      for (let i = 0; i < 100; i++) {
        starsBg.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.2 + 0.3,
          alpha: Math.random(),
          twinkle: Math.random() * 5
        });
      }
    }
    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      starsBg.forEach(s => {
        s.twinkle += 0.02;
        s.alpha = Math.abs(Math.sin(s.twinkle));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      starCanvas.width = width;
      starCanvas.height = height;
      initStars();
    });
    initStars();
    drawStars();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    // 語音發音封裝
    let isSpeaking = false;
    function speak(text) {
      if (!text || typeof SoundSystem === 'undefined') return;
      // 不再禁用輸入，允許邊聽邊輸入
      const input = document.getElementById('answerInput');

      SoundSystem.speech.speakWord(text, function () {
        isSpeaking = false;
      });
    }
    function speakCurrentWord() {
      if (!current || typeof SoundSystem === 'undefined') return;
      // 不再禁用輸入，允許邊聽邊輸入
      const input = document.getElementById('answerInput');

      SoundSystem.speech.speakWord(current.en, function () {
        isSpeaking = false;
      });
    }

    // 遊戲資料
    const params = new URLSearchParams(location.search);
    const categoryKey = params.get('category') || 'aries';
    const QUESTION_LIMIT = 20;
    document.getElementById('categoryName').textContent = categoryKey;
    const sourceWords = Array.isArray(vocabData[categoryKey]) ? vocabData[categoryKey] : [];

    function shuffleArray(items) {
      const shuffled = items.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function buildQuestionSet() {
      const seenQuestions = new Set();
      const uniqueQuestions = [];

      sourceWords.forEach((word, sourceIndex) => {
        if (!word) return;
        const questionKey = `${word.zh || ''}::${word.en || ''}`.trim().toLowerCase();
        if (seenQuestions.has(questionKey)) return;
        seenQuestions.add(questionKey);
        uniqueQuestions.push({ ...word, __sourceIndex: sourceIndex });
      });

      return shuffleArray(uniqueQuestions)
        .slice(0, QUESTION_LIMIT)
        .map((word, index) => ({
          ...word,
          __quizId: `${categoryKey}-${word.__sourceIndex}-${index}-${word.en || ''}-${word.zh || ''}`
        }));
    }

    let words = buildQuestionSet();

    let current = null;
    let used = [];
    let wrongList = [];
    let correctCount = 0;
    let currentAnswered = false;
    let timer = null;
    let timeLeft = 30;
    let lives = 5;
    let zodiacScoreSubmitted = false;
    let finalQuizResult = null;

    let timeLimit = 30;
    let pauseSkillSeconds = 0;
    let pauseSkillUses = 0;
    let starMultiplier = 1;

    // 愛心系統 (持久化)
    let heartConsumed = false; // 防止同一場遊戲重複扣愛心

    // 愛心系統 localStorage key
    const HEARTS_KEY = 'playerHearts';

    // 取得愛心數量
    function getPlayerHearts() {
      try {
        return Math.max(0, parseInt(localStorage.getItem(HEARTS_KEY) || '5', 10));
      } catch (error) {
        console.warn('[Heart System] 讀取愛心失敗，使用預設值', error);
        return 5;
      }
    }

    // 設定愛心數量
    function setPlayerHearts(hearts) {
      const safeHearts = Math.max(0, Number(hearts) || 0);
      localStorage.setItem(HEARTS_KEY, String(safeHearts));
      updateHeartsDisplay();
    }

    // 扣除愛心
    function consumeHeart() {
      const currentHearts = getPlayerHearts();
      if (currentHearts <= 0) {
        return { success: false, hearts: currentHearts };
      }
      const newHearts = currentHearts - 1;
      setPlayerHearts(newHearts);
      return { success: true, hearts: newHearts };
    }

    // 更新愛心顯示
    function updateHeartsDisplay() {
      const hearts = getPlayerHearts();
      const livesEl = document.getElementById('lives');
      if (livesEl) {
        livesEl.textContent = '❤️'.repeat(hearts);
      }
    }

    // 檢查是否可以開始遊戲
    function canStartGame() {
      const hearts = getPlayerHearts();
      if (hearts <= 0) {
        console.warn('[Heart System] 愛心不足，改以練習模式開始。');
      }
      return true;
    }

    function initCardSkills() {
      try {
        const owned = JSON.parse(localStorage.getItem('ownedCards') || '{}') || {};
        if (!owned || typeof window === 'undefined' || !Array.isArray(window.allCards)) return;

        let maxExtend = 0;
        let maxFreeze = 0;
        let maxMultiply = 1;

        Object.keys(owned).forEach(word => {
          if (!owned[word]) return;
          const card = window.allCards.find(c => c && c.word === word);
          if (!card || !card.effect) return;
          const eff = card.effect;
          if (eff.type === 'time_extend') maxExtend = Math.max(maxExtend, Number(eff.value) || 0);
          if (eff.type === 'time_freeze') maxFreeze = Math.max(maxFreeze, Number(eff.value) || 0);
          if (eff.type === 'score_multiply') maxMultiply = Math.max(maxMultiply, Number(eff.value) || 1);
        });

        const extendPerQuestion = Math.max(0, Math.min(15, Math.floor(maxExtend / 6)));
        timeLimit = 30 + extendPerQuestion;
        pauseSkillSeconds = Math.max(0, Math.min(8, Math.floor(maxFreeze / 6)));
        pauseSkillUses = pauseSkillSeconds > 0 ? 1 : 0;
        starMultiplier = Math.max(1, Math.min(2, maxMultiply >= 2 ? 2 : maxMultiply));

        const badge = document.getElementById('categoryName');
        if (badge) badge.textContent = categoryKey;

        // 原本的卡片技能「暫停」按鈕已移除，改由商城「時間暫停藥水」提供
      } catch (e) {
      }
    }

    function refreshPauseSkillBtn() {
      const btn = document.getElementById('pauseSkillBtn');
      if (!btn) return;
      btn.textContent = `⏸️ 暫停(${pauseSkillUses})`;
      btn.disabled = pauseSkillUses <= 0;
    }

    function usePauseSkill() {
      if (pauseSkillUses <= 0) return;
      if (!timer) return;
      pauseSkillUses -= 1;
      refreshPauseSkillBtn();
      clearInterval(timer);
      timer = null;
      const display = document.getElementById('feedback');
      if (display) {
        display.textContent = `⏸️ 暫停 ${pauseSkillSeconds} 秒`;
        display.style.color = '#00ffff';
      }
      setTimeout(() => {
        if (!timer && timeLeft > 0 && current && !isProcessingAnswer) startTimer();
      }, pauseSkillSeconds * 1000);
    }

    // ===== 商城道具：愛心護盾、提示藥水、時間暫停藥水 =====
    function hasInventoryItem(itemId) {
      return typeof getItemCount === 'function' && getItemCount(itemId) > 0;
    }
    function consumeInventoryItem(itemId) {
      return typeof removeItem === 'function' && removeItem(itemId);
    }
    function consumeHeartShield() {
      if (hasInventoryItem('heart_shield') && consumeInventoryItem('heart_shield')) {
        return true;
      }
      return false;
    }
    function useHintPotion() {
      if (!current) return;
      const fb = document.getElementById('feedback');
      if (hasInventoryItem('hint_potion') && consumeInventoryItem('hint_potion')) {
        const letters = String(current.en || '').slice(0, 3);
        if (fb) {
          fb.textContent = `💡 提示：${letters}...`;
          fb.style.color = '#ffd700';
        }
      } else if (fb) {
        fb.textContent = '沒有三字母提示藥水';
        fb.style.color = '#f66';
      }
    }
    function useTimeFreezePotion() {
      const fb = document.getElementById('feedback');
      if (!timer) {
        if (fb) {
          fb.textContent = '計時尚未開始';
          fb.style.color = '#f66';
        }
        return;
      }
      if (hasInventoryItem('time_freeze_potion') && consumeInventoryItem('time_freeze_potion')) {
        clearInterval(timer);
        timer = null;
        if (fb) {
          fb.textContent = '⏸️ 時間暫停 5 秒';
          fb.style.color = '#00ffff';
        }
        setTimeout(() => {
          if (!timer && timeLeft > 0 && current && !isProcessingAnswer) startTimer();
        }, 5000);
      } else if (fb) {
        fb.textContent = '沒有時間暫停藥水';
        fb.style.color = '#f66';
      }
    }
    function initItemButtons() {
      const row = document.querySelector('.btn-row');
      if (!row || document.getElementById('hintPotionBtn')) return;
      const hintBtn = document.createElement('button');
      hintBtn.id = 'hintPotionBtn';
      hintBtn.textContent = '💡 三字母提示';
      hintBtn.onclick = useHintPotion;
      row.appendChild(hintBtn);
      const freezeBtn = document.createElement('button');
      freezeBtn.id = 'timeFreezeBtn';
      freezeBtn.textContent = '⏸️';
      freezeBtn.title = '時間暫停藥水';
      freezeBtn.setAttribute('aria-label', '時間暫停藥水');
      freezeBtn.onclick = useTimeFreezePotion;
      row.appendChild(freezeBtn);
    }

    let gameStats = {
      correctCount: 0,
      totalAnswered: 0,
      consecutiveCorrect: 0,
      fastestAnswer: Infinity,
      slowestAnswer: 0,
      totalTimeUsed: 0,
      perfectAnswers: 0,
      startTime: Date.now()
    };

    let isProcessingAnswer = false;

    // 遊戲狀態標記
    let isGameFinished = false;
    let hasAppliedStarsThisRun = false;
    let hasAnsweredCurrentQuestion = false;

    // 星星總數
    let totalStarCount = parseInt(localStorage.getItem('totalStars') || '0', 10);
    function updateTotal() {
      if (typeof StarSystem !== 'undefined' && typeof StarSystem.getTotalStars === 'function') {
        totalStarCount = StarSystem.getTotalStars();
      } else if (typeof LinkageSystem !== 'undefined') {
        totalStarCount = LinkageSystem.stars.get();
      } else if (typeof StarRewardSystem !== 'undefined' &&
                 typeof StarRewardSystem.getTotalStars === 'function') {
        totalStarCount = StarRewardSystem.getTotalStars();
      }
      document.getElementById('totalStarCount').textContent = totalStarCount;
    }
    function updateLives() {
      const el = document.getElementById('lives');
      const safeLives = Math.max(0, Math.min(5, lives));
      el.innerHTML = '❤️'.repeat(safeLives) + '🤍'.repeat(5 - safeLives);
    }
    function updateQuestionCount() {
      document.getElementById('currentQuestion').textContent = used.length;
      const totalEl = document.getElementById('totalQuestionCount');
      if (totalEl) totalEl.textContent = words.length;
    }

    function calculateStarReward(isCorrect, answerTime, consecutiveCount, wordLength) {
      if (!isCorrect) return 0;
      let base = 1;
      let combo = 0;
      if (consecutiveCount >= 5) combo = 2;
      else if (consecutiveCount >= 3) combo = 1;
      else if (consecutiveCount >= 2) combo = 1;
      return base + combo;
    }

    function showComboNotification(comboCount) {
      if (comboCount < 2) return;
      const div = document.createElement('div');
      div.style.cssText = `
        position:fixed;
        top:20%;
        left:50%;
        transform:translateX(-50%);
        background:linear-gradient(135deg,rgba(255,69,0,.9),rgba(255,140,0,.9));
        color:#fff;
        padding:15px 25px;
        border-radius:25px;
        font-size:1.2rem;
        font-weight:bold;
        z-index:1000;
        box-shadow:0 0 20px #ff4500;
        animation:comboSlide .8s ease-out forwards;
        font-family:'Orbitron',sans-serif;
      `;
      let text = '';
      if (comboCount >= 5) text = `${comboCount} 連擊！🔥 無敵連擊！`;
      else if (comboCount >= 3) text = `${comboCount} 連擊！⚡ 超強連擊！`;
      else text = `${comboCount} 連擊！✨ 連擊開始！`;
      div.textContent = text;

      const style = document.createElement('style');
      style.textContent = `
        @keyframes comboSlide {
          0% { transform:translateX(-50%) translateY(-100%); opacity:0; }
          50% { transform:translateX(-50%) translateY(0); opacity:1; }
          100% { transform:translateX(-50%) translateY(0); opacity:0; }
        }
      `;
      document.head.appendChild(style);
      document.body.appendChild(div);
      setTimeout(() => {
        if (div.parentNode) div.parentNode.removeChild(div);
        if (style.parentNode) style.parentNode.removeChild(style);
      }, 4000);
    }

    function showResultPanel() {
      console.log('[Quiz] showResultPanel called, isGameFinished:', isGameFinished);
      
      // 防止重複結算
      if (isGameFinished) {
        console.warn('[星星系統] 結算已執行過，略過重複結算');
        return;
      }

      isGameFinished = true;
      console.log('[Quiz] isGameFinished set to true');

      const sessionStarsEl = document.getElementById('sessionStars');
      const sessionCorrectEl = document.getElementById('sessionCorrect');
      const sessionWrongEl = document.getElementById('sessionWrong');
      const wrongBtnEl = document.getElementById('wrongBtn');
      const resultModalEl = document.getElementById('resultModal');

      console.log('[Quiz] DOM elements check:', {
        sessionStars: !!sessionStarsEl,
        sessionCorrect: !!sessionCorrectEl,
        sessionWrong: !!sessionWrongEl,
        wrongBtn: !!wrongBtnEl,
        resultModal: !!resultModalEl
      });

      if (sessionStarsEl) sessionStarsEl.textContent = correctCount * 2;
      if (sessionCorrectEl) sessionCorrectEl.textContent = correctCount;
      if (sessionWrongEl) sessionWrongEl.textContent = wrongList.length;
      if (wrongBtnEl) wrongBtnEl.style.display = wrongList.length ? 'inline-block' : 'none';
      if (resultModalEl) resultModalEl.style.display = 'flex';
      
      console.log('[Quiz] Result modal display set to flex');
      disablePlay();

      // 計算本關星數（基於答對率）
      const answeredQuestions = correctCount + wrongList.length;
      const totalQuestions = Math.max(1, words.length || answeredQuestions || used.length);
      let earnedLevelStars = 0;

      // 統一星星結算
      if (!hasAppliedStarsThisRun) {
        hasAppliedStarsThisRun = true;

        earnedLevelStars = typeof StarSystem !== 'undefined'
          ? StarSystem.calculateStars(correctCount, totalQuestions)
          : (correctCount >= totalQuestions * 0.95 ? 3 : correctCount >= totalQuestions * 0.90 ? 2 : correctCount >= totalQuestions * 0.80 ? 1 : 0);

        // 使用 categoryKey 作為關卡 ID
        const levelId = categoryKey;

        console.group('⭐ 關卡星級結算');
        console.log('關卡ID:', levelId);
        console.log('答對:', correctCount);
        console.log('總題數:', totalQuestions);
        console.log('答對率:', (correctCount / totalQuestions * 100).toFixed(1) + '%');
        console.log('本次星級:', earnedLevelStars);
        console.log('是否通關:', earnedLevelStars >= 1);
        console.groupEnd();

        // 套用關卡星星（只補差額）
        if (typeof StarSystem !== 'undefined') {
          const isPassed = earnedLevelStars >= 1;
          const starResult = StarSystem.applyLevelStars(levelId, earnedLevelStars, {
            isPracticeMode: false,
            isCompleted: isPassed
          });

          console.group('[星星系統] 結算檢查');
          console.log('關卡:', levelId);
          console.log('答對數:', correctCount);
          console.log('總題數:', totalQuestions);
          console.log('本次獲得星數:', earnedLevelStars);
          console.log('歷史最高星數:', starResult.oldStars);
          console.log('本次實際增加星星:', starResult.addedStars);
          console.log('目前總星星:', starResult.totalStars);
          console.groupEnd();
        }

        updateTotal();
      } else {
        // 如果已經結算過，重新計算星級用於顯示
        earnedLevelStars = typeof StarSystem !== 'undefined'
          ? StarSystem.calculateStars(correctCount, totalQuestions)
          : (correctCount >= totalQuestions * 0.95 ? 3 : correctCount >= totalQuestions * 0.90 ? 2 : correctCount >= totalQuestions * 0.80 ? 1 : 0);
      }

      const score = correctCount * 2;
      const accuracy = totalQuestions > 0 ? ((correctCount / totalQuestions) * 100).toFixed(1) : '0.0';
      const totalTime = Math.max(0, Math.floor((Date.now() - gameStats.startTime) / 1000));
      const averageTime = correctCount > 0 ? Number((totalTime / correctCount).toFixed(1)) : 0;
      finalQuizResult = {
        correctCount,
        wrongCount: wrongList.length,
        totalQuestions,
        score,
        accuracy,
        totalTime,
        averageTime
      };

      console.log('[Zodiac Result] correctCount:', correctCount, 'totalQuestions:', totalQuestions, 'accuracy:', accuracy, 'totalTime:', totalTime, 'averageTime:', averageTime);

      let rating = '';
      let starDisplay = '';
      let passStatus = '';
      
      if (earnedLevelStars === 3) {
        starDisplay = '⭐⭐⭐';
        rating = '🌟 滿分高手！';
        passStatus = '通關成功！';

    function getQuizPlayerKey(item) {

    function getQuizEntryKey(item) {
      const category = String(item.category || item.level || currentCategory || 'all').trim().toLowerCase();
      const player = getQuizPlayerKey(item).toLowerCase();
      return `${category}__${player}`;

    function compareQuizEntries(a, b) {
      const scoreDiff = (Number(b.score) || 0) - (Number(a.score) || 0);
      if (scoreDiff !== 0) return scoreDiff;

      const correctDiff = (Number(b.correctCount || b.correct) || 0) - (Number(a.correctCount || a.correct) || 0);
      if (correctDiff !== 0) return correctDiff;

      const aTime = Number(a.totalTime) || Number.MAX_SAFE_INTEGER;
      const bTime = Number(b.totalTime) || Number.MAX_SAFE_INTEGER;
      if (aTime !== bTime) return aTime - bTime;

      return String(b.timestamp || b.date || '').localeCompare(String(a.timestamp || a.date || ''));
    }

    function normalizeQuizLeaderboard(data) {
      if (!Array.isArray(data)) return [];

      const bestByPlayerAndCategory = new Map();
      data.forEach((rawItem) => {
        const item = {
          ...rawItem,
          playerName: getQuizPlayerKey(rawItem),
          category: String(rawItem.category || rawItem.level || currentCategory || '').trim().toLowerCase(),
          score: Number(rawItem.score) || 0,
          correctCount: Number(rawItem.correctCount || rawItem.correct) || 0,
          totalTime: Number(rawItem.totalTime) || 0,
          averageTime: Number(rawItem.averageTime) || 0
        };
        const key = getQuizEntryKey(item);
        const existing = bestByPlayerAndCategory.get(key);
        if (!existing || compareQuizEntries(item, existing) < 0) {
          bestByPlayerAndCategory.set(key, item);
        }
      });

      return Array.from(bestByPlayerAndCategory.values())
        .sort(compareQuizEntries)
        .map((item, index) => ({ ...item, rank: index + 1 }));
    }

    function readQuizRankSnapshot(category) {
      try {
        return JSON.parse(localStorage.getItem(getQuizRankSnapshotKey(category)) || '{}') || {};
      } catch (error) {
        return {};
      }
    }

    function saveQuizRankSnapshot(category, leaderboard) {
      if (!Array.isArray(leaderboard)) return;
      const snapshot = {};
      leaderboard.forEach((item, index) => {
        snapshot[getQuizEntryKey(item)] = index + 1;
      });
      localStorage.setItem(getQuizRankSnapshotKey(category), JSON.stringify(snapshot));
    }

    function addQuizRankChanges(leaderboard, category) {
      if (!Array.isArray(leaderboard)) return [];
      const previousRanks = readQuizRankSnapshot(category);
      return leaderboard.map((item, index) => {
        const currentRank = index + 1;
        const previousRank = previousRanks[getQuizEntryKey(item)] || previousRanks[getQuizPlayerKey(item)];
        let rankChange = { type: 'new', display: 'NEW', subText: '首次進榜' };

        if (previousRank) {
          const diff = previousRank - currentRank;
          if (diff > 0) {
            rankChange = { type: 'up', display: `↑ ${diff}`, subText: `原本第${previousRank}名` };
          } else if (diff < 0) {
            rankChange = { type: 'down', display: `↓ ${Math.abs(diff)}`, subText: `原本第${previousRank}名` };
          } else {
            rankChange = { type: 'same', display: '—', subText: '排名不變' };
          }
        }

        return { ...item, rank: currentRank, previousRank, rankChange };
      });
    }

    function getQuizRankChangeHtml(item) {
      const change = item && item.rankChange;
      if (!change) return '<span style="color:#64748b;">—</span><div style="font-size:.72rem;color:#64748b;">尚無資料</div>';

      const colorMap = {
        up: '#22c55e',
        down: '#fb7185',
        new: '#facc15',
        same: '#94a3b8'
      };
      const color = colorMap[change.type] || '#94a3b8';
      return `
        <span style="display:inline-block;color:${color};font-weight:900;text-shadow:0 0 8px ${color}66;">${change.display}</span>
        <div style="font-size:.72rem;color:#94a3b8;margin-top:2px;">${change.subText || ''}</div>
      `;
    }

      try {
        if (!GOOGLE_SHEETS_API) {
          throw new Error('尚未設定 Google Apps Script Web App URL');
        }

        const formData = new URLSearchParams();
        formData.append('action', 'getQuizLeaderboard');
        if (currentCategory !== 'all') {
          formData.append('category', currentCategory);
        }

        const response = await fetch(GOOGLE_SHEETS_API, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        if (response.ok) {
          const data = await response.json();
          if (data.success && data.leaderboard) {
            displayLeaderboard(normalizeQuizLeaderboard(data.leaderboard));
            return;
          }
        }
        throw new Error(`Google Sheet 回應失敗：HTTP ${response.status}`);
      } catch (error) {
        console.error('載入 Google Sheet 排行榜失敗:', error);
        displayErrorLeaderboard(error);

    }

    // 帶逾時機制的 fetch
    async function fetchWithTimeout(url, options = {}, timeout = 10000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

          uploadStatusEl.style.color = '#ffaa00';

      const formData = new FormData();
      formData.append('action', 'addQuizScore');
      formData.append('playerName', String(playerName).trim());

      formData.append('totalTime', String(Number(totalTime) || 0));
      formData.append('averageTime', String(Number(averageTime) || 0));
      formData.append('date', new Date().toLocaleDateString('zh-TW'));

      console.log('[Zodiac Upload] 準備POST', Object.fromEntries(formData.entries()));

      // 本地排行榜備份
      try {
        const localData = JSON.parse(localStorage.getItem('quizLeaderboard') || '[]');
        const localRecord = {
          playerName: String(playerName).trim(),
          level: String(category).trim().toLowerCase(),
          score: Number(score) || 0,
          correct: uploadCorrectCount,
          correctCount: uploadCorrectCount,
          totalTime: Number(totalTime) || 0,
          averageTime: Number(averageTime) || 0,
          category: String(category).trim().toLowerCase(),
          date: new Date().toLocaleDateString('zh-TW'),
          timestamp: new Date().toISOString()
        };
        const localKey = getQuizEntryKey(localRecord);
        const existingIndex = localData.findIndex(item => getQuizEntryKey(item) === localKey);
        if (existingIndex >= 0) {
          localData[existingIndex] = { ...localData[existingIndex], ...localRecord };
        } else {
          localData.push(localRecord);
        }
        localStorage.setItem('quizLeaderboard', JSON.stringify(localData));
      } catch (error) {
        console.error('[Zodiac Score] localStorage 儲存失敗', error);
      }

      if (!GOOGLE_SHEETS_API) {
        console.warn('[Zodiac Upload] 尚未設定 Google Apps Script URL');
        if (uploadStatusEl) {
          uploadStatusEl.textContent = 'Google Sheet 網址尚未設定，無法上傳排行榜';
          uploadStatusEl.style.color = '#ff6b6b';
        }
        return;
      }

      try {
        console.log('[Zodiac Upload] 發送請求到:', GOOGLE_SHEETS_API);
        const response = await fetchWithTimeout(GOOGLE_SHEETS_API, {
          method: 'POST',
          body: formData
        }, 10000);

        console.log('[Zodiac Upload] HTTP', response.status);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        console.log('[Zodiac Upload] RESPONSE', text);

        let result = null;

        try {
          result = JSON.parse(text);
        } catch (error) {
          throw new Error('API回傳不是JSON');
        }

        console.log('[Zodiac Upload] API result:', result);

        // 檢查 success:true
        if (result.success !== true) {
          throw new Error(result.error || result.message || 'Google Sheet寫入失敗');
        }

        console.log('[Zodiac Upload] success:', result);

        // 更新結算畫面顯示
        if (uploadStatusEl) {
          uploadStatusEl.textContent = '排行榜成績已上傳 ✓';
          uploadStatusEl.style.color = '#00ff00';
        }

      } catch (error) {
        console.error('[Zodiac Upload] upload failed:', error);

        // 更新結算畫面顯示
        if (uploadStatusEl) {
          if (error.name === 'AbortError') {
            uploadStatusEl.textContent = '排行榜上傳逾時，不影響本次通關';
          } else {
            uploadStatusEl.textContent = `排行榜上傳失敗：${error.message}`;
          }
          uploadStatusEl.style.color = '#ff6b6b';
        }

        // 不影響遊戲正常進行
      }
    }

    // 處理待上傳佇列
    async function processPendingUploads() {
      try {
        if (!GOOGLE_SHEETS_API) return;

        const pending = JSON.parse(localStorage.getItem('quizPendingUploads') || '[]');
        if (pending.length === 0) return;

        console.log('[Quiz Upload] 開始處理待上傳佇列，數量:', pending.length);

        const remaining = [];
        for (const record of pending) {
          try {
            const formData = new URLSearchParams();
            formData.append('action', 'addQuizScore');
            formData.append('playerName', record.playerName);
            formData.append('score', String(record.score));
            formData.append('correctCount', String(record.correctCount));
            formData.append('category', record.category);
            formData.append('date', record.date);
            formData.append('totalTime', String(record.totalTime));

            const resp = await fetch(GOOGLE_SHEETS_API, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: formData.toString()
            });

            const responseText = await resp.text();
            const result = JSON.parse(responseText);

            if (resp.ok && result.success) {
              console.log('[Quiz Upload] 佇列上傳成功:', record.playerName);
              updateLocalRecordCloudStatus(record.timestamp, true);
            } else {
              remaining.push(record);
            }
          } catch (e) {
            console.warn('[Quiz Upload] 佇列上傳失敗，保留記錄:', record.playerName);
            remaining.push(record);
          }
        }

        localStorage.setItem('quizPendingUploads', JSON.stringify(remaining));
        console.log('[Quiz Upload] 佇列處理完成，剩餘待上傳:', remaining.length);

      } catch (e) {
        console.error('[Quiz Upload] 處理待上傳佇列失敗：', e);
      }
    }

    function getPendingAtlasGame() {
      try {
        const rawValue = sessionStorage.getItem(ATLAS_PENDING_GAME_KEY);
        if (!rawValue) return null;
        const parsedValue = JSON.parse(rawValue);
        if (!parsedValue.gameId || !parsedValue.gameUrl) return null;

    function hasAtlasStageAlreadyCleared(stageId) {
      if (typeof isStageCleared === 'function') {
        return isStageCleared('zodiac', stageId);
      }

      try {
        const passedStages = JSON.parse(localStorage.getItem('passed_atlas') || '[]');
        if (Array.isArray(passedStages) && passedStages.includes(stageId)) {
          return true;
        }
      } catch (error) {
        console.warn('[Atlas Free Game] passed_atlas 讀取失敗', error);
      }

      if (typeof StarSystem !== 'undefined' && typeof StarSystem.getLevelBestStars === 'function') {
        return StarSystem.getLevelBestStars(stageId) >= 1;
      }

      return false;
    }

    function validateUnclearedAtlasChallenge() {
      const urlParams = new URLSearchParams(window.location.search);
      const isFreeGameUnlockMode = urlParams.get('mode') === 'free-game-unlock';

      if (!isFreeGameUnlockMode) {
        return true;
      }

      const pendingGame = getPendingAtlasGame();
      if (!pendingGame) {
        console.warn('[Atlas Free Game] 找不到待解鎖遊戲資料');
        return false;
      }

      if (pendingGame.requiresUnclearedAtlasStage !== true) {
        return true;
      }

      const currentStageId = categoryKey;
      if (pendingGame.selectedStageId !== currentStageId) {
        console.warn('[Atlas Free Game] 關卡 ID 不匹配');
        return false;
      }

      if (hasAtlasStageAlreadyCleared(currentStageId)) {
        console.warn('[Atlas Free Game] 關卡已通關，不符合條件');
        return false;
      }

      return true;
    }

    function recordFreeGameAtlasPass(levelId) {
      const pendingGame = getPendingAtlasGame();
      if (!pendingGame) return;

      const urlParams = new URLSearchParams(window.location.search);
      const isFreeGameUnlockMode = urlParams.get('mode') === 'free-game-unlock';

      if (!isFreeGameUnlockMode) return;

      if (pendingGame.requiresUnclearedAtlasStage === true) {
        if (pendingGame.selectedStageId !== levelId) {
          console.warn('[Atlas Free Game] 關卡 ID 不匹配，不發放資格');
          return;
        }

        if (pendingGame.stageWasClearedBeforeChallenge === true) {
          console.warn('[Atlas Free Game] 關卡在挑戰前已通關，不發放資格');
          return;
        }
      }

      const result = {
        passed: true,
        levelId: typeof levelId === 'string' ? levelId : 'unknown',
        passedAt: Date.now(),
        flowId: pendingGame.flowId
      };

      try {
        sessionStorage.setItem(ATLAS_PASS_RESULT_KEY, JSON.stringify(result));

        const updatedPendingGame = {
          ...pendingGame,
          status: 'passed'
        };
        sessionStorage.setItem(ATLAS_PENDING_GAME_KEY, JSON.stringify(updatedPendingGame));

        console.log('[Atlas Free Game] 通關結果已記錄:', result);
      } catch (error) {
        console.error('[Atlas Free Game] 通關結果儲存失敗。', error);
      }
    }

    function startTimer() {
      timeLeft = timeLimit;
      document.getElementById('timeLeft').textContent = timeLeft;
      document.getElementById('timerDisplay').classList.remove('danger');
      if (timer) clearInterval(timer);

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timeLeft').textContent = timeLeft;
        if (timeLeft <= 10) {
          document.getElementById('timerDisplay').classList.add('danger');
        }
        if (timeLeft <= 0) {
          clearInterval(timer);
          const answerTime = timeLimit;
          gameStats.totalAnswered++;
          gameStats.totalTimeUsed += answerTime;
          currentAnswered = true;
          if (typeof SoundSystem !== 'undefined') SoundSystem.play('wrong');
          wrongList.push(current);
          if (consumeHeartShield()) {
            document.getElementById('feedback').textContent = `🛡️ 愛心護盾抵銷扣血！正解是：${current.en}`;
            document.getElementById('feedback').style.color = '#00ffff';
          } else {
            lives--;
            document.getElementById('feedback').textContent = `⏰ 時間到！正解是：${current.en}`;
            document.getElementById('feedback').style.color = '#f66';
          }
          gameStats.consecutiveCorrect = 0;
          updateLives();
          if (lives <= 0) {
            setTimeout(() => { showResultPanel(); isProcessingAnswer = false; }, 800);
          } else {
            setTimeout(() => { nextWord(); isProcessingAnswer = false; }, 800);
          }
        }
      }, 1000);
    }

    function nextWord() {
      isProcessingAnswer = false;
      if (used.length >= words.length) {
        document.getElementById('wordDisplay').textContent = '✅ 挑戰完成';
        clearInterval(timer);
        showResultPanel();
        return;
      }

      if (current && used.length > 0 && !currentAnswered) {
        const answerTime = (timeLimit - timeLeft);
        gameStats.totalAnswered++;
        gameStats.totalTimeUsed += answerTime;
        if (!consumeHeartShield()) {
          lives--;
        }
        updateLives();
        wrongList.push(current);
        gameStats.consecutiveCorrect = 0;
        if (lives <= 0) {
          clearInterval(timer);
          showResultPanel();
          return;
        }
      }

      const available = words.filter(w => !used.includes(w.__quizId));
      if (available.length === 0) {
        document.getElementById('wordDisplay').textContent = '✅ 挑戰完成';
        clearInterval(timer);
        showResultPanel();
        return;
      }
      current = available[Math.floor(Math.random() * available.length)];
      used.push(current.__quizId);
      currentAnswered = false;
      updateQuestionCount();
      document.getElementById('wordDisplay').textContent = current.zh;
      const input = document.getElementById('answerInput');
      if (input) {
        input.value = '';
        // 不再禁用輸入，允許立即輸入
        input.disabled = false;
        input.focus();
      }
      document.getElementById('feedback').textContent = '';

      if (typeof SoundSystem !== 'undefined') {
        // 不等待語音完成，直接允許輸入
        SoundSystem.speech.speakWord(current.en, function () {
          isSpeaking = false;
        });
      }

      startTimer();
      document.getElementById('resultModal').style.display = 'none';
      document.getElementById('wrongModal').style.display = 'none';
      enablePlay();
      updateLives();
    }

    function checkAnswer() {
      if (!current || isProcessingAnswer) return;
      isProcessingAnswer = true;
      const ans = document.getElementById('answerInput').value.trim().toLowerCase();

      const answerTime = (timeLimit - timeLeft);
      gameStats.totalAnswered++;
      gameStats.totalTimeUsed += answerTime;

      if (ans === current.en.toLowerCase()) {
        currentAnswered = true;
        document.getElementById('feedback').textContent = '✅ 正確';
        document.getElementById('feedback').style.color = '#0f0';
        if (typeof SoundSystem !== 'undefined') SoundSystem.play('correct');
        correctCount++;

        gameStats.correctCount++;
        gameStats.consecutiveCorrect++;

        if (answerTime < gameStats.fastestAnswer) gameStats.fastestAnswer = answerTime;
        if (answerTime > gameStats.slowestAnswer) gameStats.slowestAnswer = answerTime;
        if (answerTime <= 15) gameStats.perfectAnswers++;

        let starsEarned = calculateStarReward(true, answerTime, gameStats.consecutiveCorrect, current.en.length);
        if (starMultiplier > 1) starsEarned = Math.round(starsEarned * starMultiplier);

        // 不再答對時直接加星星，星星將在結算時統一計算
        // starsEarned 僅用於顯示連擊通知

        showComboNotification(gameStats.consecutiveCorrect);

        if (typeof VocabularyAchievementSystem !== 'undefined') {
          VocabularyAchievementSystem.recordCorrectWord(current.en, categoryKey);
        }

        clearInterval(timer);
        setTimeout(() => { nextWord(); isProcessingAnswer = false; }, 800);
      } else {
        currentAnswered = true;
        if (typeof SoundSystem !== 'undefined') SoundSystem.play('wrong');
        wrongList.push(current);
        if (consumeHeartShield()) {
          document.getElementById('feedback').textContent = `🛡️ 愛心護盾抵銷扣血！正解是：${current.en}`;
          document.getElementById('feedback').style.color = '#00ffff';
        } else {
          lives--;
          document.getElementById('feedback').textContent = `❌ 正解是：${current.en}`;
          document.getElementById('feedback').style.color = '#f66';
        }
        gameStats.consecutiveCorrect = 0;
        updateLives();
        clearInterval(timer);
        if (lives <= 0) {
          setTimeout(() => { showResultPanel(); isProcessingAnswer = false; }, 800);
        } else {
          setTimeout(() => { nextWord(); isProcessingAnswer = false; }, 800);
        }
      }
    }

      updateHeartsDisplay(); // 更新愛心顯示

      initCardSkills();
      refreshPauseSkillBtn();
      initItemButtons();

      const answerInput = document.getElementById('answerInput');
      if (answerInput) {
        answerInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            // 移除語音和處理中的檢查，允許立即輸入
            checkAnswer();
          }
        });
      }

      nextWord();
    });
  </script>

  
  <!-- 排行榜 ALL 模式分組 patch -->
  <script>
  (function(){
    function install(){
      if (typeof window.displayLeaderboard !== 'function') {
        return setTimeout(install, 80);
      }
      const __origDisplay = window.displayLeaderboard;
      window.displayLeaderboard = function(data){
        try{
          const activeCategory = typeof currentCategory !== 'undefined'
            ? currentCategory
            : (window.currentCategory || 'all');
          if (Array.isArray(data) && String(activeCategory) === 'all'){
            const content = document.getElementById('leaderboardContent');
            const groups = data.reduce((m,item)=>{
              const cat = item.category || 'default';
              (m[cat] = m[cat] || []).push(item);
              return m;
            },{});
            const names = {
              'all':'全部關卡','aries':'白羊座','taurus':'金牛座','gemini':'雙子座','cancer':'巨蟹座',
              'leo':'獅子座','virgo':'處女座','libra':'天秤座','scorpio':'天蠍座','sagittarius':'射手座',
              'capricorn':'摩羯座','aquarius':'水瓶座','pisces':'雙魚座','andromeda':'仙女座','cygnus':'天鵝座',
              'orion':'獵戶座','pegasus':'飛馬座','cassiopeia':'仙后座','scorpius':'天蠍座','phoenix':'鳳凰座','vela':'船帆座',
              'default':'一般關卡'
            };
            const zodiacOrder = ['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'];
            const otherKeys = Object.keys(groups).filter(k=>!zodiacOrder.includes(k)).sort();
            const keys = zodiacOrder.filter(k=>groups[k]).concat(otherKeys);

            const fmtAvgTime = (totalTime, correctCount)=>{
              if (!totalTime || !correctCount) return '-';
              const sec = Math.round(totalTime / correctCount);
              const m = Math.floor(sec/60), s = sec%60;
              return m>0 ? `${m}分${s}秒` : `${s}秒`;
            };
            const fmtTotalTime = (totalTime)=>{
              if (!totalTime) return '-';
              const m = Math.floor(totalTime/60), s = totalTime%60;
              return m>0 ? `${m}分${s}秒` : `${s}秒`;
            };

            let html = `
              <div style="text-align:center;margin-bottom:12px;color:#a0a0ff;font-size:.95rem;">
                📚 顯示 <b>${keys.length}</b> 個關卡，共 <b>${data.length}</b> 筆記錄
              </div>
            `;
            keys.forEach(cat=>{
              let list = normalizeQuizLeaderboard(groups[cat]);
              list = addQuizRankChanges(list, cat);
              const title = names[cat] || cat;
              html += `
                <div class="leaderboard-scroll-container" style="margin:18px 0 26px;border-radius:12px;background:rgba(0,0,0,.2);padding:10px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;">
                    <div style="color:#00ffff;font-weight:bold;">${title} 排行榜</div>
                    <div style="color:#a0a0ff;font-size:.9rem;">${list.length} 筆</div>
                  </div>
                  <table style="width:100%;border-collapse:collapse;font-family:'Orbitron',sans-serif;">
                    <thead>
                      <tr>
                        <th>排名</th>
                        <th>玩家</th>
                        <th>分數</th>
                        <th>答對</th>
                        <th>排名變化</th>
                        <th>平均時間</th>
                        <th>總時間</th>
                      </tr>
                    </thead>
                    <tbody>
              `;
              list.forEach((item,idx)=>{
                const isTop3 = idx<3;
                const rankIcon = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':(idx+1);
                const rowStyle = isTop3
                  ? `background:linear-gradient(90deg,${idx===0?'#ffd70022':idx===1?'#c0c0c022':'#cd7f3222'},transparent);`
                  : '';
                html += `
                  <tr style="${rowStyle}">
                    <td style="text-align:center;font-weight:bold;color:${isTop3?'#ffd700':'#fff'};">${rankIcon}</td>
                    <td style="text-align:left;color:#fff;">${escapeHtml(item.playerName || item.user || '未知玩家')}</td>
                    <td style="text-align:center;color:#ffd700;font-weight:bold;">${item.score || 0}</td>
                    <td style="text-align:center;color:#0f0;">${item.correctCount || 0}/20</td>
                    <td style="text-align:center;">${getQuizRankChangeHtml(item)}</td>
                    <td style="text-align:center;color:#ff6b6b;">${fmtAvgTime(item.totalTime, item.correctCount)}</td>
                    <td style="text-align:center;color:#a0a0ff;font-style:italic;">${fmtTotalTime(item.totalTime)}</td>
                  </tr>
                `;
              });
              html += `
                    </tbody>
                  </table>
                </div>
              `;
              saveQuizRankSnapshot(cat, list);
            });
            content.innerHTML = html;
            return;
          }
        }catch(e){
          console.warn('[leaderboard patch] error', e);
        }
        return __origDisplay.apply(this, arguments);
      };
      console.log('[patch] Grouped ALL-levels leaderboard installed');
    }
    install();
  })();
  </script>

  <script>
  (function(){
    function keepUnlimited(){
      try{
        const activeCategory = typeof currentCategory !== 'undefined'
          ? currentCategory
          : (window.currentCategory || 'all');
        if (String(activeCategory).toLowerCase() === 'all') {
          if (typeof window.LEADERBOARD_LIMIT !== 'undefined') window.LEADERBOARD_LIMIT = Infinity;
          if (typeof window.maxLeaderboardItems !== 'undefined') window.maxLeaderboardItems = Infinity;
          if (typeof window.leaderboardLimit !== 'undefined') window.leaderboardLimit = Infinity;
        }
      }catch(e){}
      setTimeout(keepUnlimited, 500);
    }
    keepUnlimited();
  })();
  </script>
