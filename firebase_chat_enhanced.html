<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="js/stars.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #e0e0e0;
      overflow: hidden;
    }

    .chat-app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 24px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header - Game HUD Style */
    .chat-app .chat-header {
      background: linear-gradient(135deg, rgba(233, 69, 96, 0.9) 0%, rgba(236, 100, 75, 0.9) 100%);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .chat-app .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-app .chat-home-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      height: 36px;
    }

    .chat-app .chat-home-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .chat-app .header-icon {
      font-size: 24px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .chat-app .header-title {
      display: flex;
      flex-direction: column;
    }

    .chat-app .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      margin: 0;
      line-height: 1.2;
    }

    .chat-app .header-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      margin-top: 2px;
    }

    .chat-app .chat-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-app .music-toggle {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
    }

    .chat-app .music-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .chat-app .music-icon {
      font-size: 16px;
    }

    .chat-app .music-text {
      font-size: 13px;
    }

    .chat-app .online-count {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .chat-app .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .chat-app .current-user {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .chat-app .current-user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .chat-app .current-user-name {
      font-weight: 600;
      font-size: 14px;
      color: white;
    }

    /* Login Screen */
    .chat-app .login-screen {
      background: rgba(30, 30, 50, 0.95);
      border-radius: 20px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      margin: 60px auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-app .login-screen h2 {
      margin-bottom: 24px;
      color: white;
      font-size: 28px;
      font-weight: 700;
    }

    .chat-app .name-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      transition: all 0.3s ease;
    }

    .chat-app .name-input:focus {
      border-color: #e94560;
      background: rgba(255, 255, 255, 0.1);
    }

    .chat-app .name-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-app .enter-button {
      background: linear-gradient(135deg, #e94560 0%, #ec644b 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    .chat-app .enter-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }

    .chat-app .enter-button:active {
      transform: translateY(0);
    }

    /* Chat Layout */
    .chat-app .chat-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 16px;
      display: none;
    }

    /* Sidebar */
    .chat-app .chat-sidebar {
      width: clamp(260px, 20vw, 300px);
      background: rgba(30, 30, 50, 0.95);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .chat-app .sidebar-section {
      margin-bottom: 24px;
    }

    .chat-app .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .chat-app .room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-app .room-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-app .room-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(4px);
    }

    .chat-app .room-item.active {
      background: linear-gradient(135deg, rgba(233, 69, 96, 0.25) 0%, rgba(236, 100, 75, 0.25) 100%);
      border-left: 3px solid rgba(233, 69, 96, 0.8);
    }

    .chat-app .room-icon {
      font-size: 20px;
    }

    .chat-app .room-info {
      flex: 1;
    }

    .chat-app .room-name {
      font-weight: 600;
      font-size: 15px;
      color: white;
      margin-bottom: 2px;
    }

    .chat-app .room-preview {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-app .room-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .chat-app .room-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
    }

    .chat-app .unread-badge {
      background: #e94560;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .chat-app .players-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-app .player-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 3px solid #4CAF50;
      transition: all 0.3s ease;
    }

    .chat-app .player-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .chat-app .player-item.own {
      background: rgba(233, 69, 96, 0.15);
      border-left-color: #e94560;
    }

    .chat-app .player-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      margin-right: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .chat-app .player-info {
      flex: 1;
    }

    .chat-app .player-name {
      font-weight: 600;
      color: white;
      font-size: 14px;
    }

    .chat-app .player-status {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-app .player-online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }

    /* Main Chat Area */
    .chat-app .chat-main {
      flex: 1;
      min-height: 0;
      background: rgba(30, 30, 50, 0.95);
      border-radius: 12px;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .chat-app .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px;
      scroll-padding-top: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .chat-app .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-app .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-app .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .chat-app .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Messages */
    .chat-app .chat-message {
      margin-bottom: 20px;
      animation: messageSlide 0.3s ease-out;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-app .chat-message.own {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 8px;
    }

    .chat-app .chat-message.other {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .chat-app .message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .chat-app .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .chat-app .message-username {
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .chat-app .message-time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-app .message-bubble {
      max-width: 70%;
      padding: 12px 18px;
      border-radius: 18px;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .chat-app .chat-message.other .message-bubble {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom-left-radius: 6px;
    }

    .chat-app .chat-message.own .message-bubble {
      background: linear-gradient(135deg, #e94560 0%, #ec644b 100%);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
    }

    .chat-app .chat-message.system {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .chat-app .chat-message.system .message-bubble {
      background: linear-gradient(135deg, rgba(255, 193, 7, 0.2) 0%, rgba(255, 152, 0, 0.2) 100%);
      border: 2px solid rgba(255, 193, 7, 0.5);
      color: #ffc107;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
      animation: systemGlow 2s ease-in-out infinite alternate;
    }

    @keyframes systemGlow {
      0% { box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2); }
      100% { box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4); }
    }

    /* Input Area */
    .chat-app .chat-input-area {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .chat-app .input-group {
      flex: 1;
      position: relative;
    }

    .chat-app .chat-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 16px;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      min-height: 52px;
      max-height: 120px;
    }

    .chat-app .chat-input:focus {
      border-color: #e94560;
      background: rgba(255, 255, 255, 0.1);
    }

    .chat-app .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .chat-app .char-count {
      position: absolute;
      bottom: 8px;
      right: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-app .chat-send-btn {
      background: linear-gradient(135deg, #e94560 0%, #ec644b 100%);
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
      min-width: 80px;
    }

    .chat-app .chat-send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }

    .chat-app .chat-send-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .chat-app .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Empty State */
    .chat-app .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-app .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .chat-app .empty-state-text {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .chat-app .empty-state-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.3);
    }

    /* Loading */
    .chat-app .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.6);
    }

    .chat-app .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #e94560;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Connection Status */
    .chat-app .connection-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .chat-app .status-connected {
      background: rgba(76, 175, 80, 0.9);
    }

    .chat-app .status-connecting {
      background: rgba(255, 152, 0, 0.9);
    }

    .chat-app .status-disconnected {
      background: rgba(244, 67, 54, 0.9);
    }

    /* Notification */
    .chat-app .notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      z-index: 1000;
      animation: slideDown 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .chat-app .notification.success {
      background: rgba(76, 175, 80, 0.95);
    }

    .chat-app .notification.error {
      background: rgba(244, 67, 54, 0.95);
    }

    .chat-app .notification.info {
      background: rgba(33, 150, 243, 0.95);
    }

    /* Back Button */
    .chat-app .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
    }

    .chat-app .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Gacha Button */
    .chat-app .gacha-button {
      position: fixed;
      top: 80px;
      right: 20px;
      background: linear-gradient(135deg, #e94560 0%, #ec644b 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
      z-index: 1000;
      min-width: 120px;
      justify-content: center;
    }

    .chat-app .gacha-button:hover {
      background: linear-gradient(135deg, #ff5252 0%, #d84315 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }

    .chat-app .gacha-button:active {
      transform: translateY(0);
    }

    .chat-app .gacha-button {
      animation: gachaPulse 2s ease-in-out infinite;
    }

    @keyframes gachaPulse {
      0%, 100% {
        box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        transform: scale(1.05);
      }
    }

    .chat-app .gacha-button:hover {
      animation: none;
    }

    /* YouTube Player */
    .chat-app .youtube-player-container {
      position: fixed;
      top: 140px;
      right: 20px;
      background: rgba(30, 30, 50, 0.95);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      max-width: 330px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.3s ease;
      touch-action: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .chat-app .youtube-player-container:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }

    .chat-app .youtube-player-container:active {
      cursor: grabbing;
    }

    .chat-app .youtube-player-container.dragging {
      cursor: grabbing;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
      transform: scale(1.02);
      touch-action: none;
      pointer-events: none;
    }

    .chat-app .youtube-player-container.dragging * {
      pointer-events: none;
    }

    .chat-app .youtube-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chat-app .youtube-header h3 {
      margin: 0;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .chat-app .toggle-youtube-btn {

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyBcUJ1v9I67qSofbCpiLr3UfKkE8TT-YOY",
      authDomain: "quiz-star-arena.firebaseapp.com",
      databaseURL: "https://quiz-star-arena-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quiz-star-arena",
      storageBucket: "quiz-star-arena.appspot.com",
      messagingSenderId: "631540520004",
      appId: "1:631540520004:web:f209cc7a3d9fdcf6805811"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // 聊天系統
    class EnhancedFirebaseChat {
      constructor() {
        this.currentUser = null;
        this.messagesRef = ref(db, 'enhanced_chat/messages');
        this.usersRef = ref(db, 'enhanced_chat/users');
        this.typingRef = ref(db, 'enhanced_chat/typing');
        this.isConnected = false;
        this.lastMessageCount = 0;
        this.typingTimeout = null;
        this.userName = '';
        
        this.init();
      }

      async init() {
        try {
          // 匿名登入
          await signInAnonymously(auth);
          
          // 監聽認證狀態
          onAuthStateChanged(auth, (user) => {
            if (user) {
              this.currentUser = {
                uid: user.uid,
                name: this.userName || `用戶${user.uid.slice(-4)}`,
                avatar: this.generateAvatar(user.uid)
              };
              
              console.log('✅ Firebase 認證成功，用戶:', this.currentUser);
              
              // 如果已經設定了用戶名稱，立即初始化聊天室
              if (this.userName) {
                console.log('✅ 用戶名稱已設定，初始化聊天室');
                this.setupUser();
                this.loadMessages();
                this.loadPlayers();
                this.setupTypingListener();
                this.updateConnectionStatus('connected');
                this.showChatLayout();
              } else {
                console.log('⏳ 等待用戶輸入名稱...');
              }
            }
          });

        } catch (error) {
          console.error('❌ 初始化失敗:', error);
          this.showNotification('連線失敗，請重新整理頁面', 'error');
        }
      }

      generateAvatar(uid) {
        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];
        const color = colors[uid.charCodeAt(0) % colors.length];
        return color;
      }

      async setupUser() {
        if (!this.currentUser) return;

        // 更新用戶資訊
        const userRef = ref(db, `enhanced_chat/users/${this.currentUser.uid}`);
        await set(userRef, {
          name: this.currentUser.name,
          avatar: this.currentUser.avatar,
          lastSeen: serverTimestamp(),
          online: true
        });

        // 設定離線時自動移除
        await onDisconnect(userRef).update({
          online: false,
          lastSeen: serverTimestamp()
        });

        // 更新 UI
        const headerUserName = document.getElementById('headerUserName');
        const headerUserAvatar = document.getElementById('headerUserAvatar');
        if (headerUserName) headerUserName.textContent = this.currentUser.name;
        if (headerUserAvatar) {
          headerUserAvatar.textContent = this.currentUser.name.charAt(0);
          headerUserAvatar.style.background = this.currentUser.avatar;
        }
      }

      loadMessages() {
        // 監聽訊息變化
        onValue(this.messagesRef, (snapshot) => {
          const messages = [];
          snapshot.forEach((childSnapshot) => {
            const message = childSnapshot.val();
            if (message) {
              messages.push({
                id: childSnapshot.key,
                ...message
              });
            }
          });

          // 按時間排序
          messages.sort((a, b) => a.timestamp - b.timestamp);

          this.displayMessages(messages);

          // 檢查新訊息
          if (messages.length > this.lastMessageCount) {
            this.playMessageSound();
            this.lastMessageCount = messages.length;
          }
        });
      }

      loadPlayers() {
        // 監聽玩家列表變化
        onValue(this.usersRef, (snapshot) => {
          const players = [];
          snapshot.forEach((childSnapshot) => {
            const player = childSnapshot.val();
            if (player && player.online) {
              players.push({
                uid: childSnapshot.key,
                ...player
              });
            }
          });

          this.displayPlayers(players);
        });
      }

      displayPlayers(players) {
        const playersList = document.getElementById('playersList');
        const headerOnlineCount = document.getElementById('headerOnlineCount');
        
        if (headerOnlineCount) {
          headerOnlineCount.textContent = `${players.length} 人在線`;
        }

        if (players.length === 0) {
          playersList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-text">目前沒有其他玩家在線</div><div class="empty-state-sub">等待其他玩家加入...</div></div>';
          return;
        }

        playersList.innerHTML = players.map(player => {
          const isOwn = player.uid === this.currentUser?.uid;
          return `
            <div class="player-item ${isOwn ? 'own' : ''}">
              <div class="player-avatar" style="background: ${player.avatar}">
                ${player.name.charAt(0)}
              </div>
              <div class="player-info">
                <div class="player-name">${player.name} ${isOwn ? '(您)' : ''}</div>
                <div class="player-status">在線</div>
              </div>
              <div class="player-online-dot"></div>
            </div>
          `;
        }).join('');
      }

      displayMessages(messages) {
        const chatMessages = document.getElementById('chatMessages');
        
        if (messages.length === 0) {
          chatMessages.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <div class="empty-state-text">還沒有聊天訊息</div>
              <div class="empty-state-sub">開始第一則對話吧！</div>
            </div>
          `;
          return;
        }

        chatMessages.innerHTML = messages.map(message => {
          const isOwn = message.userId === this.currentUser?.uid;
          const isSystem = message.isSystem || message.userId === 'system';
          const time = new Date(message.timestamp).toLocaleTimeString('zh-TW', {
            hour: '2-digit',
            minute: '2-digit'
          });

          if (isSystem) {
            return `
              <div class="chat-message system">
                <div class="message-bubble">
                  ${this.escapeHtml(message.text)}
                </div>
              </div>
            `;
          }

          return `
            <div class="chat-message ${isOwn ? 'own' : 'other'}">
              <div class="message-header">
                <div class="message-avatar" style="background: ${message.avatar}">
                  ${message.userName.charAt(0)}
                </div>
                <div class="message-username">${message.userName}</div>
                <div class="message-time">${time}</div>
              </div>
              <div class="message-bubble">
                ${this.escapeHtml(message.text)}
              </div>
            </div>
          `;
        }).join('');

        // 滾動到底部
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      async sendMessage(text) {
        if (!this.currentUser || !text.trim()) return;

        try {
          const messageData = {
            text: text.trim(),
            userId: this.currentUser.uid,
            userName: this.currentUser.name,
            avatar: this.currentUser.avatar,
            timestamp: Date.now()
          };

          await push(this.messagesRef, messageData);
          
          // 清除輸入框
          document.getElementById('messageInput').value = '';
          this.updateCharCount();
          this.updateSendButton();

        } catch (error) {
          console.error('❌ 發送訊息失敗:', error);
          this.showNotification('發送失敗，請重試', 'error');
        }
      }

      setupTypingListener() {
        const messageInput = document.getElementById('messageInput');
        
        // 設定輸入框事件監聽器
        messageInput.addEventListener('input', () => {
          this.updateCharCount();
          this.updateSendButton();
          this.updateTypingStatus(true);
        });

        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            this.sendMessage(messageInput.value);
          }
          if (e.key === 'Escape') {
            messageInput.value = '';
            messageInput.blur();
            this.updateCharCount();
            this.updateSendButton();
          }
        });
      }

      updateCharCount() {
        const input = document.getElementById('messageInput');
        const charCount = document.getElementById('charCount');
        const remaining = 200 - input.value.length;
        
        charCount.textContent = remaining;
        charCount.style.color = remaining < 20 ? '#f44336' : 'rgba(255, 255, 255, 0.5)';
        
        if (remaining < 0) {
          input.value = input.value.substring(0, 200);
          this.showNotification('訊息長度已達上限', 'error');
        }
      }

      updateSendButton() {
        const input = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        sendButton.disabled = input.value.trim().length === 0;
      }

      updateTypingStatus(isTyping) {
        if (!this.currentUser) return;

        const typingRef = ref(db, `enhanced_chat/typing/${this.currentUser.uid}`);
        
        if (isTyping) {
          set(typingRef, {
            userName: this.currentUser.name,
            userId: this.currentUser.uid,
            timestamp: Date.now()
          });

          // 清除之前的超時
          if (this.typingTimeout) {
            clearTimeout(this.typingTimeout);
          }

          // 5秒後自動停止打字狀態
          this.typingTimeout = setTimeout(() => {
            this.updateTypingStatus(false);
          }, 5000);
        } else {
          set(typingRef, null);
        }
      }

      playMessageSound() {
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
          oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
          
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.2);
        } catch (error) {
          console.log('無法播放提示音:', error);
        }
      }

      updateConnectionStatus(status) {
        const statusElement = document.getElementById('connectionStatus');
        
        if (!statusElement) return;
        
        statusElement.className = `connection-status status-${status}`;
        
        switch (status) {
          case 'connected':
            statusElement.textContent = '✅ 已連線';
            this.isConnected = true;
            break;
          case 'connecting':
            statusElement.textContent = '🔄 連線中...';
            this.isConnected = false;
            break;
          case 'disconnected':
            statusElement.textContent = '❌ 連線中斷';
            this.isConnected = false;
            break;
        }
      }

                     showChatLayout() {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('chatLayout').style.display = 'flex';
        }

      setUserName(name) {
        console.log('設定用戶名稱:', name);
        this.userName = name;
        
        // 記憶用戶名稱，防止隨意改變
        localStorage.setItem('chatUserName', name);
        
        if (this.currentUser) {
          this.currentUser.name = name;
          console.log('✅ 用戶已登入，更新用戶資訊');
          this.setupUser();
        } else {
          console.log('⏳ 用戶尚未登入，等待認證完成');
        }
      }

      showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.textContent = message;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // 發送系統訊息到聊天室
      async sendSystemMessage(message) {
        if (!this.currentUser) return;

        try {
          const messageData = {
            text: message,
            userId: 'system',
            userName: '🎉 系統通知',
            avatar: '#ff6b6b',
            timestamp: Date.now(),
            isSystem: true
          };

          await push(this.messagesRef, messageData);
          console.log('✅ 系統訊息已發送');
        } catch (error) {
          console.error('❌ 發送系統訊息失敗:', error);
        }
      }
    }

    // 初始化聊天系統
    const chat = new EnhancedFirebaseChat();
    
           // 暴露到全域，供其他頁面使用
       window.firebaseChat = chat;


       

    // 全域函數
    window.sendMessage = () => {
      const input = document.getElementById('messageInput');
      chat.sendMessage(input.value);
    };

    // 檢查是否有記憶的用戶名稱
    function checkSavedUserName() {
      const savedUserName = localStorage.getItem('chatUserName');
      if (savedUserName) {
        // 如果有記憶的用戶名稱，直接進入聊天室
        document.getElementById('userNameInput').value = savedUserName;
        chat.setUserName(savedUserName);
        
        // 如果用戶已經登入，立即初始化聊天室
        if (chat.currentUser) {
          chat.setupUser();
          chat.loadMessages();
          chat.loadPlayers();
          chat.setupTypingListener();
          chat.updateConnectionStatus('connected');
          chat.showChatLayout();
        }
        
        chat.showNotification(`歡迎回來，${savedUserName}！`, 'success');
        return true;
      }
      return false;
    }

    // 重新設定用戶名稱
    window.resetUserName = () => {
      const confirmReset = confirm('確定要清除記憶的用戶名稱嗎？\n\n清除後將需要重新輸入用戶名稱。');
      if (confirmReset) {
        localStorage.removeItem('chatUserName');
        document.getElementById('userNameInput').value = '';
        chat.showNotification('用戶名稱已清除，請重新輸入', 'info');
      }
    };


    // 開啟抽卡視窗函數
    window.openGachaWindow = () => {
      // 顯示提示訊息
      if (chat && chat.showNotification) {
        chat.showNotification('🎲 正在開啟抽卡系統...', 'info');
      }
      
      // 開啟新視窗
      const gachaWindow = window.open('gacha.html', '_blank', 'width=1200,height=800,scrollbars=yes,resizable=yes');
      
      // 檢查視窗是否成功開啟
      if (gachaWindow) {
        console.log('✅ 抽卡視窗已開啟');
      } else {
        console.error('❌ 無法開啟抽卡視窗，可能被瀏覽器阻擋');
        if (chat && chat.showNotification) {
          chat.showNotification('❌ 無法開啟抽卡視窗，請檢查瀏覽器設定', 'error');
        }
      }
    };

    // YouTube 播放器控制函數
    let isYouTubeVisible = false;
    let youtubePlayer = null;

    window.toggleYouTubePlayer = () => {
      const playerContainer = document.getElementById('youtubePlayer');
      const playerContainerWrapper = document.getElementById('youtubePlayerContainer');
      const toggleBtn = document.getElementById('toggleYouTubeBtn');
      
      if (isYouTubeVisible) {
        // 隱藏播放器
        if (playerContainerWrapper) {
          playerContainerWrapper.style.display = 'none';
        }
        if (playerContainer) {
          playerContainer.style.display = 'none';
        }
        
        // 更新按鈕狀態
        if (toggleBtn) {
          const musicIcon = toggleBtn.querySelector('.music-icon');
          const musicText = toggleBtn.querySelector('.music-text');
          if (musicIcon) musicIcon.textContent = '🎵';
          if (musicText) musicText.textContent = '音樂';
        }
        
        isYouTubeVisible = false;
        
        // 暫停 YouTube 播放
        const iframe = document.getElementById('youtubeIframe');
        if (iframe) {
          const currentSrc = iframe.src;
          iframe.src = currentSrc.replace('&autoplay=1', '&autoplay=0');
        }
        
        console.log('🎵 YouTube 播放器已隱藏');
        if (chat && chat.showNotification) {
          chat.showNotification('🎵 音樂播放器已隱藏', 'info');
        }
      } else {
        // 顯示播放器
        if (playerContainerWrapper) {
          playerContainerWrapper.style.display = 'block';
        }
        if (playerContainer) {
          playerContainer.style.display = 'block';
        }
        
        // 更新按鈕狀態
        if (toggleBtn) {
          const musicIcon = toggleBtn.querySelector('.music-icon');
          const musicText = toggleBtn.querySelector('.music-text');
          if (musicIcon) musicIcon.textContent = '🔇';
          if (musicText) musicText.textContent = '音樂';
        }
        
        isYouTubeVisible = true;
        
        // 自動播放 YouTube
        const iframe = document.getElementById('youtubeIframe');
        if (iframe) {
          const currentSrc = iframe.src;
          iframe.src = currentSrc.replace('&autoplay=0', '&autoplay=1');
        }
        
        console.log('🎵 YouTube 播放器已顯示');
        if (chat && chat.showNotification) {
          chat.showNotification('🎵 背景音樂已開啟！', 'success');
        }
      }
    };

    // 初始化 YouTube 播放器
    window.initializeYouTubePlayer = () => {
      console.log('🎵 初始化 YouTube 播放器');
      
      // 檢查用戶是否已經設定過播放器狀態
      const savedState = localStorage.getItem('youtubePlayerState');
      if (savedState === 'visible') {
        // 延遲顯示，確保頁面完全載入
        setTimeout(() => {
          window.toggleYouTubePlayer();
        }, 1000);
      }

      // 初始化拖拽功能
      window.initializeDragAndDrop();
    };

    // 拖拽功能變數
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialX = 0;
    let initialY = 0;

    // 初始化拖拽功能
    window.initializeDragAndDrop = () => {
      const playerContainer = document.getElementById('youtubePlayerContainer');
      
      if (!playerContainer) {
        console.error('❌ 找不到 YouTube 播放器容器');
        return;
      }

      console.log('🎵 開始初始化拖拽功能...');

      // 載入保存的位置
      const savedPosition = localStorage.getItem('youtubePlayerPosition');
      if (savedPosition) {
        try {
          const position = JSON.parse(savedPosition);
          playerContainer.style.left = position.x + 'px';
          playerContainer.style.top = position.y + 'px';
          playerContainer.style.right = 'auto';
          console.log('🎵 載入保存的播放器位置:', position);
        } catch (e) {
          console.log('載入位置失敗，使用預設位置');
        }
      }

      // 簡化的拖拽功能
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      // 滑鼠事件
      playerContainer.onmousedown = function(e) {
        // 檢查是否點擊了按鈕
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
          console.log('🎵 點擊了按鈕，不啟動拖拽');
          return;
        }

        console.log('🎵 開始拖拽');
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseInt(playerContainer.style.left) || 0;
        startTop = parseInt(playerContainer.style.top) || 0;
        
        playerContainer.classList.add('dragging');
        e.preventDefault();
      };

      document.onmousemove = function(e) {
        if (!isDragging) return;
        
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        let newLeft = startLeft + deltaX;
        let newTop = startTop + deltaY;
        
        // 邊界檢查
        const maxX = window.innerWidth - playerContainer.offsetWidth;
        const maxY = window.innerHeight - playerContainer.offsetHeight;
        
        newLeft = Math.max(0, Math.min(newLeft, maxX));
        newTop = Math.max(0, Math.min(newTop, maxY));
        
        playerContainer.style.left = newLeft + 'px';
        playerContainer.style.top = newTop + 'px';
        playerContainer.style.right = 'auto';
        
        e.preventDefault();
      };

      document.onmouseup = function() {
        if (!isDragging) return;
        
        console.log('🎵 拖拽結束');
        isDragging = false;
        playerContainer.classList.remove('dragging');
        
        // 保存位置
        const position = {
          x: parseInt(playerContainer.style.left) || 0,
          y: parseInt(playerContainer.style.top) || 0
        };
        localStorage.setItem('youtubePlayerPosition', JSON.stringify(position));
        
        if (chat && chat.showNotification) {
          chat.showNotification('🎵 播放器位置已更新', 'success');
        }
      };

      // 觸控事件
      playerContainer.ontouchstart = function(e) {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
          return;
        }

        console.log('🎵 開始觸控拖拽');
        isDragging = true;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startLeft = parseInt(playerContainer.style.left) || 0;
        startTop = parseInt(playerContainer.style.top) || 0;
        
        playerContainer.classList.add('dragging');
        e.preventDefault();
      };

      document.ontouchmove = function(e) {
        if (!isDragging) return;
        
        const touch = e.touches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        
        let newLeft = startLeft + deltaX;
        let newTop = startTop + deltaY;
        
        const maxX = window.innerWidth - playerContainer.offsetWidth;
        const maxY = window.innerHeight - playerContainer.offsetHeight;
        
        newLeft = Math.max(0, Math.min(newLeft, maxX));
        newTop = Math.max(0, Math.min(newTop, maxY));
        
        playerContainer.style.left = newLeft + 'px';
        playerContainer.style.top = newTop + 'px';
        playerContainer.style.right = 'auto';
        
        e.preventDefault();
      };

      document.ontouchend = function() {
        if (!isDragging) return;
        
        console.log('🎵 觸控拖拽結束');
        isDragging = false;
        playerContainer.classList.remove('dragging');
        
        const position = {
          x: parseInt(playerContainer.style.left) || 0,
          y: parseInt(playerContainer.style.top) || 0
        };
        localStorage.setItem('youtubePlayerPosition', JSON.stringify(position));
      };

      console.log('✅ YouTube 播放器拖拽功能已初始化');
      console.log('🎵 播放器容器:', playerContainer);
      console.log('🎵 播放器樣式:', {
        position: playerContainer.style.position,
        left: playerContainer.style.left,
        top: playerContainer.style.top,
        zIndex: playerContainer.style.zIndex
      });
    };



    window.enterChat = () => {
      const nameInput = document.getElementById('userNameInput');
      const userName = nameInput.value.trim();
      
      if (!userName) {
        alert('請輸入您的暱稱！');
        return;
      }
      
      if (userName.length > 20) {
        alert('暱稱不能超過20個字元！');
        return;
      }
      
      // 檢查是否與記憶的用戶名稱不同
      const savedUserName = localStorage.getItem('chatUserName');
      if (savedUserName && savedUserName !== userName) {
        const confirmChange = confirm(`您之前使用的暱稱是「${savedUserName}」，確定要改為「${userName}」嗎？\n\n注意：更改暱稱後將無法再改回原來的暱稱！`);
        if (!confirmChange) {
          nameInput.value = savedUserName;
          return;
        }
      }
      
      chat.setUserName(userName);
      
      // 如果用戶已經登入，立即初始化聊天室
      if (chat.currentUser) {
        chat.setupUser();
        chat.loadMessages();
        chat.loadPlayers();
        chat.setupTypingListener();
        chat.updateConnectionStatus('connected');
        chat.showChatLayout();
      }
      
      chat.showNotification(`歡迎 ${userName} 加入聊天室！`, 'success');
    };



    // 事件監聽器
    document.addEventListener('DOMContentLoaded', () => {
      const sendButton = document.getElementById('sendButton');
      const nameInput = document.getElementById('userNameInput');
      const enterButton = document.getElementById('enterButton');

      // 立即初始化拖拽功能
      console.log('🚀 頁面載入完成，初始化拖拽功能...');
      setTimeout(() => {
        window.initializeDragAndDrop();
      }, 100);

      // 檢查是否有記憶的用戶名稱，如果有則自動進入聊天室
      if (checkSavedUserName()) {
        // 自動進入聊天室，不需要用戶手動點擊
        return;
      }

      // 發送按鈕事件
      if (sendButton) {
        sendButton.addEventListener('click', window.sendMessage);
      }

      // 名稱輸入框事件
      if (nameInput) {
        nameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            window.enterChat();
          }
        });
      }

      // 進入按鈕事件
      if (enterButton) {
        enterButton.addEventListener('click', window.enterChat);
      }

      // 初始化 YouTube 播放器
      window.initializeYouTubePlayer();
    });
  </script>
</body>
</html>
